        C.muted outline. The heatmap shrinks to rail slot 2 on the final line.
      reveal_sequence:
        - {at_word: "sixty-four rows", action: "heatmap builds row by row (staggered 0.01s)"}
        - {at_word: "two pixels", action: "a pixel pair highlights on the tile and in the matrix"}
        - {at_word: "Neighbouring pixels", action: "the pixel's row lights its neighbours on the tile"}
        - {at_word: "blank in every scan", action: "three empty rows/columns outlined"}
        - {at_word: "best view", action: "heatmap pins to the rail; chapter end"}
