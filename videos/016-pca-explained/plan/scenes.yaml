  - id: out_s02
    chapter: outro
    title: "The best shadow"
    arc_step: close
    duration_s: 23.58
    duration_source: audio
    goal: "Close loops L2 and L3 with the opening image; end-screen hold."
    narration: |
      Every view of data throws something away, just like a shadow. [pause 0.6s] PCA doesn't avoid that. [pause 0.3s]
      It tells you exactly what you kept, and exactly what you lost. [pause 1.0s] So the next time you meet a table with
      too many columns, turn it to the light first.
    pause_after_s: 6.0
    visual:
      description: >
        The lamp and sculpture from in_s01. The sculpture turns once through blob shadows and settles at the best view;
        the shadow resolves with its accent glow. A small kept / lost readout (C.pc1 / C.residual bars) under the
        shadow. Title card fades in on the final line; the frame holds 6 s for the end screen with the shadow dim
        behind.
      reveal_sequence:
