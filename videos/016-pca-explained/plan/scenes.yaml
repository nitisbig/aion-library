  - id: ch5_s02
    chapter: ch5
    title: "How much we keep"
    arc_step: quantify
    duration_s: 32.45
    duration_source: audio
    goal: "Explained variance from eigenvalues; for the digits, two keep a bit over a quarter, about twenty keep 90 %."
    narration: |
      How much did we lose? [pause 0.4s] The eigenvalues answer that. [pause 0.4s] Each one is the variance along its
      direction, and together they add up to the total variance. [pause 0.8s] So each eigenvalue's share of the total is
      the share of the variation that direction carries. [pause 1.0s] For the digits, the first two directions carry a
      little more than a quarter. [pause 0.5s] About twenty of them carry nine tenths. [pause 0.6s] And three carry
      nothing at all: those are the pixels that are blank in every scan.
    pause_after_s: 1.5
    visual:
      description: >
        Scree chart (Manim axes): 64 bars of the digits' eigenvalue shares (C.spread), sorted, with a cumulative
        curve (C.pc1) rising over them. A dashed 90% line; the curve crosses it at k = 21, marked. The first two bars
        highlight with "28.5%". The last three bars are zero-height, outlined in C.muted, and link to the three blank
        pixels on a small digit tile. Chart pins to the rail (B_scree).
      reveal_sequence:
        - {at_word: "eigenvalues", action: "axes draw; bars rise staggered"}
        - {at_word: "add up to the total", action: "bars stack into one 100% column, then return"}
        - {at_word: "share", action: "cumulative curve draws"}
        - {at_word: "first two directions", action: "first two bars highlight; 28.5% label"}
        - {at_word: "nine tenths", action: "90% line; crossing at k = 21 marked"}
        - {at_word: "nothing at all", action: "last three bars outlined; link to blank pixels"}
        - {at_word: "every scan", action: "chart pins to rail (B_scree)"}
      equations: ['\dfrac{\lambda_j}{\sum_i \lambda_i}', '\sum_{j\le 21} \lambda_j \big/ \sum_i \lambda_i \approx 0.90']
      camera: static
      layout: L2
      rail: [B_recipe, B_scree]
      layers: [manim_scree, manim_cumulative, skia_digit_tile, rail_boards]
    engines: {primary: manim, secondary: [numpy, sklearn]}
    engine_reason: "A computed bar chart in Manim."
    retention_device: "a concrete number answers loop L3"
    interrupt: null
    transition_out: "The eigen-digit images replace the bars."
    sfx_music: "A tick as the curve crosses 90%."

  - id: ch5_s03
    chapter: ch5
    title: "Rebuilding a digit"
    arc_step: apply
    duration_s: 32.81
    duration_source: audio
    goal: "Components are images; a digit is the mean plus a weighted sum of them; reconstruction sharpens with k."
    narration: |
      Each principal component of the digits is itself a pattern of sixty-four shades, so we can draw it as an image.
      [pause 0.8s] Every digit is the average digit plus some amount of each pattern. [pause 0.6s] Start from the
      average, and add the patterns one at a time, largest first. [pause 1.2s] With a few, it's a blur. [pause 0.4s]
      With ten, you can read it. [pause 0.4s] With twenty, it's hard to tell from the original. [pause 1.0s] So twenty
      numbers per digit, instead of sixty-four, lose very little.
    pause_after_s: 1.5
    visual:
      description: >
        A row of the first eight eigen-digits as 8x8 tiles (skia, diverging C.data (negative) / black / C.spread (positive)). The mean
        digit tile (greyscale). Equation builds: x ≈ μ + Σ z_j v_j with each z_j a small slider. A "3" rebuilds in a
        large tile beside the original as k steps 1, 2, 3, 5, 10, 20, 64; each added pattern flies from the row into
        the sum. A k counter in CM sans.
      reveal_sequence:
        - {at_word: "draw it as an image", action: "eigen-digit row fades in, staggered"}
        - {at_word: "average digit", action: "mean tile; equation builds"}
        - {at_word: "one at a time", action: "k = 1, 2, 3 with patterns flying in"}
        - {at_word: "blur", action: "k = 5"}
        - {at_word: "With ten", action: "k = 10"}
        - {at_word: "With twenty", action: "k = 20; original appears beside it"}
        - {at_word: "lose very little", action: "k = 64 (exact); difference tile nearly black"}
      equations: ['\tilde x = \sum_j z_j v_j', 'x \approx \mu + \sum_{j\le k} z_j\,v_j', 'z_j = \tilde x\cdot v_j']
      camera: static
      layout: L2
      rail: [B_recipe, B_scree]
      layers: [skia_eigendigits, skia_recon, manim_eqn, manim_counter, rail_boards]
    engines: {primary: skia, secondary: [manim, numpy]}
    engine_reason: "Pixel tiles are rasters; reconstructions computed exactly with numpy."
    retention_device: "watching a picture sharpen (progress reward)"
    interrupt: null
    transition_out: "Tiles fly to the axes of the digit map."
    sfx_music: "A soft pop per step."

  - id: ch5_s04
    chapter: ch5
    title: "The map, explained"
    arc_step: payoff
    duration_s: 37.26
    duration_source: audio
    goal: "Close loop L1: the intro map's axes are PC1 and PC2; mention the SVD as how it's computed in practice."
    narration: |
      Now the map from the beginning makes sense. [pause 0.4s] Its two axes are the first two principal components.
      [pause 0.4s] Each dot is one digit, placed by how much of each pattern it contains. [pause 1.0s] Digits that share
      strokes contain similar amounts, so they land near each other. [pause 1.0s] In practice, nobody builds the
      covariance matrix for large data. [pause 0.4s] A related factorization, the singular value decomposition, finds
      the same directions straight from the table, and more accurately. [pause 0.8s] The answer is the same: the
      directions of greatest spread.
    pause_after_s: 2.0
    visual:
      description: >
        B_map returns from storage to full stage (PointsLayer, digit hues). The first two eigen-digit tiles fly onto
        its axes as axis labels (PC1 along x, PC2 along y). One "0" dot is picked: its two coordinates drawn as
        dashed projections, its tile shown as μ + z1 v1 + z2 v2 (blurry but recognisable). Accent glow on the map. Then
        a compact SVD line: the table X splits into U Σ Vᵀ blocks (Manim rectangles), and Vᵀ's top rows light as the
        same two eigen-digits; σ²/n = λ noted.
      reveal_sequence:
        - {at_word: "map from the beginning", action: "B_map returns full stage"}
        - {at_word: "two axes", action: "eigen-digit tiles land on the axes"}
        - {at_word: "each pattern", action: "one dot's coordinates shown as projections"}
        - {at_word: "share strokes", action: "two neighbouring clusters pulse; accent glow"}
        - {at_word: "In practice", action: "map shrinks; table block appears"}
        - {at_word: "singular value decomposition", action: "X splits into U Σ V^T"}
        - {at_word: "same directions", action: "V^T rows light as the eigen-digits"}
        - {at_word: "greatest spread", action: "hold; chapter end"}
      equations: ['X = U\Sigma V^\top', '\lambda_j = \sigma_j^2 / n']
      camera: "gentle pull-back at 'In practice'"
      layout: L2
      rail: [B_recipe, B_scree]
      layers: [points_digits, skia_axis_tiles, manim_svd_blocks, glow_map, rail_boards]
    engines: {primary: PointsLayer, secondary: [manim, skia, numpy]}
    engine_reason: "The map is the same PointsLayer as the intro (continuity); SVD blocks are Manim rectangles."
    retention_device: "pays loop L1"
    interrupt: callback
    transition_out: "Chapter 6 card."
    sfx_music: "The intro shimmer, reprised softly."

# ======================================================================== CH6 WHERE PCA BREAKS
  - id: ch6_s01
    chapter: ch6
    title: "Units matter"
    arc_step: caution
    duration_s: 31.13
    duration_source: audio
    goal: "A human example: a unit change hijacks PC1; standardising fixes it."
    narration: |
      PCA is simple, and that makes its limits easy to see. [pause 0.5s] Suppose we record height in millimetres, but
      arm span in metres. [pause 0.6s] The height numbers are now a thousand times bigger than the arm span numbers, so
      their variance is a million times bigger. [pause 0.8s] The first component points almost straight along height,
      whatever the people are like. [pause 0.8s] The fix is to put every measurement on the same footing first: divide
      each one by its own spread.
    pause_after_s: 1.2
    visual:
      description: >
        Chapter card (\textsc{Where PCA Breaks}). The centred people cloud with PC1 (C.pc1). Axis tags change: height
        in \textsf{mm}, arm span in \textsf{m}. The cloud stretches horizontally off the frame (the camera zooms out to
        follow), and PC1 snaps flat to the height axis. Then the z-score equation builds and the cloud rescales back
        to a round-ish tilted cloud; PC1 returns to the diagonal.
      reveal_sequence:
        - {at_word: "millimetres", action: "height tag changes to mm"}
        - {at_word: "metres", action: "arm span tag changes to m"}
        - {at_word: "thousand times bigger", action: "cloud stretches; camera zooms out"}
        - {at_word: "straight along height", action: "PC1 snaps to the height axis (C.residual flash)"}
        - {at_word: "same footing", action: "z-score equation builds"}
        - {at_word: "own spread", action: "cloud rescales; PC1 returns to the diagonal"}
      equations: ['z = \dfrac{x - \mu}{\sigma}']
      camera: "zoom out and back"
      layout: L1
      layers: [chapter_card, manim_plane, manim_dots, manim_pc1, manim_eqn]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "2D geometry and one equation."
    retention_device: "human example (a unit mix-up anyone could make)"
    interrupt: contrast
    transition_out: "Cut to the rolled sheet."
    sfx_music: "A stretch, then a settle."

