        rolling up from a flat sheet, slow orbit. Right: its PCA projection: the colours mix and overlap. Two points
        far apart along the sheet (ringed) land next to each other. Three key-word tags appear small:
        \textsf{kernel PCA}, \textsf{t-SNE}, \textsf{UMAP}, with a ghost of the roll unrolling cleanly.
      reveal_sequence:
        - {at_word: "flat views", action: "flat sheet of points"}
        - {at_word: "spiral", action: "sheet rolls up, orbit"}
        - {at_word: "squashes the layers", action: "right board: PCA projection, colours mixed"}
        - {at_word: "far apart", action: "two ringed points land side by side"}
        - {at_word: "follow the curve", action: "ghost roll unrolls cleanly"}
        - {at_word: "kernel PCA", action: "three tags appear"}
      equations: []
      camera: "slow orbit on the left board"
      layout: L3
      layers: [points_swiss_roll_3d, points_projection_2d, manim_tags]
    engines: {primary: PointsLayer, secondary: [numpy]}
    engine_reason: "3D points with a camera; projection computed by our own PCA."
    retention_device: "a failure you can see"
    interrupt: null
    transition_out: "The two-group example slides in."
    sfx_music: "Low tone."

  - id: ch6_s03
    chapter: ch6
    title: "Spread is not meaning"
    arc_step: caution + callback
    duration_s: 33.56
    duration_source: audio
    goal: "Largest variance can hide the structure you care about; tie back to the shadow."
    narration: |
      And the biggest spread is not always the most interesting. [pause 0.4s] Take two groups that are long and thin,
      lying side by side. [pause 0.6s] Most of the spread runs along their length, so that's where the first component
      points. [pause 0.6s] Its shadow piles both groups on top of each other. [pause 1.0s] The direction that separates
      them has very little spread, and PCA ranks it last. [pause 0.8s] PCA finds the view that keeps the most variation.
      [pause 0.4s] Whether that's the view you need is still your call.
    pause_after_s: 2.5
    visual:
      description: >
        Two parallel thin clusters (C.d1 and C.d7 hues). PC1 (C.pc1) along their length: the shadow histogram on PC1
        shows one merged hump. PC2 (C.pc2): its histogram shows two clean humps. B_shadow returns from storage in a
        small frame: the blob shadow vs the structured shadow, echoing the intro.
      reveal_sequence:
        - {at_word: "long and thin", action: "two clusters draw"}
        - {at_word: "first component", action: "PC1 line"}
        - {at_word: "piles both groups", action: "PC1 histogram: one hump"}
        - {at_word: "separates them", action: "PC2 histogram: two humps"}
        - {at_word: "ranks it last", action: "small 'λ2 ≪ λ1' tag"}
        - {at_word: "keeps the most variation", action: "B_shadow returns small"}
        - {at_word: "your call", action: "hold; chapter end"}
      equations: ['\lambda_2 \ll \lambda_1']
      camera: static
      layout: L2
      rail: [B_shadow]
      layers: [manim_clusters, manim_histograms, rail_boards]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Points and histograms computed from seeded data."
    retention_device: "callback to the opening shadow"
    interrupt: callback
    transition_out: "Recap wall."
    sfx_music: "Quiet."

# ======================================================================== OUTRO
  - id: out_s01
