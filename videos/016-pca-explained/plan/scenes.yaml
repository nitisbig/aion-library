# ======================================================================== CH4 EIGENVECTORS
  - id: ch4_s01
    chapter: ch4
    title: "Directions that don't turn"
    arc_step: discover
    duration_s: 31.78
    duration_source: audio
    goal: "Eigenvectors as the directions C only stretches."
    narration: |
      Watch what the covariance matrix does to a fan of arrows. [pause 0.8s] Almost every arrow gets stretched and
      turned off its own line. [pause 0.6s] But two directions only stretch. [pause 0.4s] They stay pointing exactly
      where they were. [pause 1.0s] Arrows like these are called eigenvectors, from the German word for own. [pause
      0.5s] Each one has a number that says how much it's stretched, its eigenvalue. [pause 0.8s] And these two lie
      right along the long and short axes of our cloud.
    pause_after_s: 1.5
    visual:
      description: >
        Chapter card (\textsc{Eigenvectors}). A fan of 16 arrows (C.probe) with faint lines through each. C acts:
        each arrow moves to Cu, with a thin trail; most leave their lines (lines flash C.muted). Two arrows stay on
        their lines and stretch: one long (C.pc1), one short (C.pc2), both glow. Cv = λv builds with v in the arrow's
        colour and λ in C.spread. The cloud ghost fades in beneath; its axes match the two arrows. Pins to rail (B_eig).
      reveal_sequence:
        - {at_word: "fan of arrows", action: "fan + guide lines draw"}
        - {at_word: "stretched and turned", action: "C acts on all arrows, 2s"}
        - {at_word: "two directions", action: "two arrows highlighted on their lines"}
        - {at_word: "exactly where they were", action: "accent glow on both"}
        - {at_word: "eigenvectors", action: "Cv = λv writes in"}
        - {at_word: "eigenvalue", action: "λ highlights (C.spread); stretch factors shown 135.0 and 16.9"}
        - {at_word: "long and short axes", action: "cloud ghost fades in under the arrows; pins B_eig"}
      equations: ['C v = \lambda v']
      camera: static
      layout: L2
      rail: [B_C, B_eig]
      layers: [chapter_card, manim_fan, manim_eqn, glow_eigs, rail_boards]
    engines: {primary: manim, secondary: [moderngl, numpy]}
    engine_reason: "Arrows and equations in Manim; accent glow as a GL fx; eigenpairs from numpy.linalg.eigh."
    retention_device: "spot the odd ones out; human example: the two arrows are the people cloud's own size and proportion axes"
    interrupt: reveal
    transition_out: "The two eigenvectors become the axes of the next board."
    sfx_music: "A soft chord when the two arrows stay put."

  - id: ch4_s02
    chapter: ch4
    title: "Why the top one wins"
    arc_step: prove
    duration_s: 36.93
    duration_source: audio
    goal: "In the eigenbasis, variance is a weighted average of eigenvalues; maximum at the top eigenvector."
    narration: |
      Why should the best direction be an eigenvector? [pause 0.5s] Describe any arrow using the two eigenvectors as
      axes. [pause 0.4s] Its variance becomes a mix of the two eigenvalues, with weights that always add up to one.
      [pause 1.0s] A mix can never be bigger than its largest ingredient. [pause 0.5s] So the best you can do is put
      all the weight on the largest eigenvalue. [pause 0.4s] That means pointing straight along its eigenvector. [pause
      1.0s] The method of Lagrange multipliers reaches the same place: at the best arrow, the matrix times the arrow
      points along the arrow itself.
    pause_after_s: 1.5
    visual:
      description: >
        Axes are the eigenvectors (C.pc1, C.pc2). A unit arrow u turns; its components a, b shown as projections. A
        horizontal balance bar below: weight a² on the λ1 side (C.pc1), b² on the λ2 side (C.pc2); a marker at the
        weighted mean slides between λ2 and λ1. When u aligns with v1 the marker hits λ1 and glows. Equation builds
        term by term. Small inset board (callback to video 012): level curve of uᵀCu tangent to the unit circle, two
        gradient arrows parallel, Cu = λu.
      reveal_sequence:
        - {at_word: "eigenvectors as axes", action: "grid turns to eigen-axes"}
        - {at_word: "mix", action: "balance bar with weights a², b²; equation builds"}
        - {at_word: "add up to one", action: "a² + b² = 1 highlights"}
        - {at_word: "largest ingredient", action: "marker slides; it never passes λ1"}
        - {at_word: "all the weight", action: "u turns onto v1; marker hits λ1; glow"}
        - {at_word: "Lagrange multipliers", action: "inset: level curve tangent to circle, parallel gradients"}
        - {at_word: "arrow itself", action: "Cu = λu in the inset"}
      equations: ['u = a\,v_1 + b\,v_2', 'u^\top C u = \lambda_1 a^2 + \lambda_2 b^2', 'a^2 + b^2 = 1', '\nabla(u^\top C u) = 2\lambda u \;\Rightarrow\; Cu = \lambda u']
      camera: static
      layout: L2
      rail: [B_C, B_eig]
      layers: [manim_eigen_axes, manim_balance, manim_eqn, manim_inset_lagrange, glow_lock]
    engines: {primary: manim}
    engine_reason: "Equations, a bar and a small contour inset."
    retention_device: "an argument the viewer can finish themselves"
    interrupt: callback
    transition_out: "Inset closes; the ellipse returns."
    sfx_music: "Quiet; one bright tone at the lock."

  - id: ch4_s03
    chapter: ch4
    title: "Eigenvalues are spreads"
    arc_step: interpret
    duration_s: 29.73
    duration_source: audio
    goal: "λ = variance along v; symmetric C gives perpendicular eigenvectors; C = VΛVᵀ."
    narration: |
      So each eigenvalue has a plain meaning. [pause 0.4s] It's the variance of the data along its eigenvector. [pause
      0.8s] And because the covariance matrix is symmetric, its eigenvectors always meet at right angles. [pause 0.6s]
      That's why the principal components come out perpendicular, with no extra work. [pause 1.0s] Put it together,
      and the matrix splits into three simple moves: turn to the eigenvector axes, stretch by the eigenvalues, and turn
      back.
    pause_after_s: 1.5
    visual:
      description: >
        The cloud with its ellipse; semi-axes along v1, v2 with lengths proportional to √λ (C.pc1, C.pc2), the
        shadows on v1 spread to show λ1. B_C slides back; a right-angle mark at the origin pulses on "right angles".
        C = VΛVᵀ builds with each factor under a tiny animation: a unit square turns (Vᵀ), stretches (Λ, C.spread), and
        turns back (V); the result matches C applied directly (ghost overlay).
      reveal_sequence:
        - {at_word: "plain meaning", action: "ellipse semi-axes draw"}
        - {at_word: "variance of the data", action: "shadows on v1 spread; λ1 label"}
        - {at_word: "symmetric", action: "B_C slides in; its mirror flash repeats"}
        - {at_word: "right angles", action: "right-angle mark pulses"}
        - {at_word: "turn to the eigenvector axes", action: "V^T: square turns"}
        - {at_word: "stretch", action: "Λ: square stretches"}
        - {at_word: "turn back", action: "V: square turns back; overlay matches"}
      equations: ['\lambda_j = \mathrm{Var}(v_j)', 'v_1 \perp v_2', 'C = V\Lambda V^\top']
      camera: static
      layout: L2
      rail: [B_C, B_eig]
      layers: [manim_ellipse, manim_square_steps, manim_eqn, rail_boards]
    engines: {primary: manim}
    engine_reason: "Geometric transform steps."
    retention_device: "one equation, three moves"
    interrupt: null
    transition_out: "The pieces fly to the recipe board."
    sfx_music: "Three soft steps."

  - id: ch4_s04
    chapter: ch4
    title: "The recipe"
    arc_step: summarise
    duration_s: 26.28
    duration_source: audio
    goal: "The PCA algorithm in five steps, assembled from the rail boards."
    narration: |
      That's the whole method. [pause 0.4s] Centre the data. [pause 0.3s] Build the covariance matrix. [pause 0.3s] Find
      its eigenvectors. [pause 0.3s] Sort them by eigenvalue, largest first. [pause 0.3s] Then describe every point by
      its shadows on the top few. [pause 1.2s] No searching, no guessing. [pause 0.4s] The same steps work for two
      columns, for sixty-four, or for ten thousand.
    pause_after_s: 2.0
    visual:
      description: >
        A tall recipe board builds five lines, each with a tiny icon pulled from an earlier board (the mean marker,
        the matrix, the two eigen-arrows, sorted bars, shadows on PC1). Lines are short: \textsf{centre},
        \textsf{covariance}, \textsf{eigenvectors}, \textsf{sort}, \textsf{project}, with the formula beside each.
        On "ten thousand" the matrix icon scales from 2x2 to 64x64 to a big grey block. Board pins to the rail
        (B_recipe) and stays through Ch5.
      reveal_sequence:
        - {at_word: "Centre the data", action: "line 1 with mean icon"}
        - {at_word: "covariance matrix", action: "line 2 with matrix icon"}
        - {at_word: "eigenvectors", action: "line 3 with eigen-arrows"}
        - {at_word: "Sort", action: "line 4 with sorted bars"}
        - {at_word: "shadows on the top few", action: "line 5 with projection icon"}
        - {at_word: "ten thousand", action: "matrix icon scales up; board pins to rail (B_recipe)"}
      equations: ['\tilde X = X - \mu', 'C = \tfrac1n \tilde X^\top \tilde X', 'C v_j = \lambda_j v_j', '\lambda_1 \ge \lambda_2 \ge \dots', 'z = V_k^\top \tilde x']
      camera: static
      layout: L1
      rail: [B_recipe]
      layers: [manim_recipe, manim_icons]
    engines: {primary: manim}
    engine_reason: "A board of equations and vector icons."
    retention_device: "a clean summary card the viewer can screenshot"
    interrupt: null
    transition_out: "Chapter 5 card."
    sfx_music: "A tick per line."

