    arc_step: recap
    duration_s: 27.99
    duration_source: audio
    goal: "Recap the whole chain using the saved boards, each lighting in turn."
    narration: |
      Let's put it all back together. [pause 0.4s] Data becomes a cloud of points. [pause 0.4s] We centre it, and ask
      which direction spreads the shadows the most. [pause 0.5s] That variance fits inside one symmetric matrix. [pause
      0.4s] Its eigenvectors are the answer, and its eigenvalues say how much each one keeps. [pause 0.5s] Keep the top
      few, and sixty-four numbers become a handful, with most of the picture still there.
    pause_after_s: 1.5
    visual:
      description: >
        The saved boards return as a wall (L4 grid extended to 2x3): B_cloud, B_dial, B_C, B_eig, B_scree, B_map.
        Each lights to full brightness on its line while the others sit at 40%. A thin C.pc1 thread links them in
        order.
      reveal_sequence:
