        - {at_word: Lasers, action: three icons slide in}
        - {at_word: swirls, action: cloud points start to flow}
        - {at_word: larger, action: points smear into coloured dye}
      equations: ['\psi_{n\ell m}(r,\theta,\phi)']
      camera: "3D orbit, 0.12 rad/s"
      layout: L1
