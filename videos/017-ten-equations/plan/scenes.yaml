  - id: c03_s02
    chapter: c03
    title: "The wave"
    arc_step: equation
    duration_s: 22.50
    duration_source: audio
    goal: "Read Schrödinger's equation in words; show probability and tunnelling."
    narration: |
      In nineteen twenty six, Erwin Schrödinger wrote down the equation that governs this wave. [pause 0.4s] It
      tells you how the wave changes from moment to moment, given the energy around it. [pause 0.6s] Where the wave
      is tall, the electron is likely to be found. [pause 0.4s] The wave can even leak through a wall that a ball
      could never cross, an effect called tunnelling.
    pause_after_s: 0.8
    visual:
      description: >
        L2. Stage: a wave packet on a line drawn as a 2.5D ribbon whose height is |ψ| and whose colour is the phase
        (domain-colouring hue wheel, GLSL), computed by split-step FFT (baked). Right column: iħ ∂ψ/∂t = Ĥψ; "∂ψ/∂t" lights
        with tag "change", "Ĥψ" with tag "energy". On "tall" the ribbon's height turns into a filled |ψ|² curve
        (C.psi) with tag "chance". On "wall" a barrier (C.frame block) rises; the packet hits it, most reflects and a
        small packet emerges on the far side (from the sim); the far piece glows.
      reveal_sequence:
        - {at_word: Schrödinger, action: 'name tag: Erwin Schrödinger · 1926; equation writes'}
        - {at_word: changes, action: ∂ψ/∂t lights; packet moves}
        - {at_word: energy, action: Ĥψ lights}
        - {at_word: tall, action: "|ψ|² curve fills; tag 'chance'"}
        - {at_word: wall, action: barrier rises; packet hits it}
        - {at_word: tunnelling, action: small packet emerges beyond; glow}
      equations: ['i\hbar\,\frac{\partial\psi}{\partial t}=\hat H\psi', 'P = |\psi|^2']
      camera: "2.5D: ribbon seen at 25° tilt, slow pan with the packet"
      layout: L2
      layers: [bg_solid, glsl_phase_ribbon, barrier, equation_column, prob_curve_manim]
    engines: {primary: moderngl, secondary: [numpy, manim]}
    engine_reason: "Complex phase colouring is per-pixel (GLSL); the evolution is a baked numpy FFT solve."
    retention_device: "rule-breaking moment (passing through a wall)"
    interrupt: equation
    transition_out: "The packet wraps into a ring around a nucleus; the view goes 3D."
    sfx_music: "A soft 'blip' when the packet tunnels."

  - id: c03_s03
