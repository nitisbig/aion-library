    duration_source: audio
    goal: "Pay loop L4 (Fourier's bar from the opening) and show superposition with a piano chord."
    narration: |
      That tool is the one we met at the very start, from Joseph Fourier and his bar of hot metal. [pause 0.5s] Play
      three notes on a piano together, and the sound reaching your ear is one bumpy wave, yet you hear three
      separate notes. [pause 0.5s] Fourier's claim was that any wiggle at all can be built by adding together
      simple, smooth waves.
    pause_after_s: 0.8
    visual:
      description: >
        Callback: the jagged turbulence trace settles onto the glowing bar from the opening (T5 tile image, 50 %), then
        the bar fades. 2D: the bumpy sum of C, E, G (261.6, 329.6, 392.0 Hz, scaled in time) drawn in C.fourier across
        the stage. On "three separate notes" it separates in 2.5D into three stacked layers (sines in three tints of the
        hue), staggered in depth, then recombines. On "adding together" a square wave builds from 1, 3, 5 … 25 sines,
        each added on a soft stagger.
      reveal_sequence:
        - {at_word: Fourier, action: "the opening's hot bar returns briefly, then fades"}
        - {at_word: piano, action: bumpy wave draws}
        - {at_word: three separate notes, action: layers separate in depth and recombine}
        - {at_word: adding together, action: square wave builds from sines}
      equations: ['f(t)=\sum_k a_k\sin(k\omega t)']
      camera: "2D → 2.5D layer separation (z 0, −1, −2) and back"
      layout: L1
      layers: [bg_solid, wave_manim, layers_parallax, portrait]
