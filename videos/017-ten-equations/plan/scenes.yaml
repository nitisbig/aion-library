  - id: c08_s02
    chapter: c08
    title: "The limit"
    arc_step: equation
    duration_s: 25.10
    duration_source: audio
    goal: "Packing more levels blurs them; Shannon's limit and its two ingredients."
    narration: |
      To send more bits each second, you can pack more signal levels closer together, but then the noise begins to
      blur one into another. [pause 0.6s] Shannon found the exact limit. [pause 0.4s] It depends on how wide a band
      of frequencies you use, and how strong the signal is compared to the noise. [pause 0.6s] Under that limit,
      errors can be made as rare as you like, and beyond it, nothing helps.
    pause_after_s: 0.8
    visual:
      description: >
        2.5D: a constellation plane tilted 20°: 2, then 4, then 16 points (QAM, C.signal) each with a noise cloud of
        received samples (PointsLayer, C.noise, seeded). As points pack closer, clouds overlap and the overlapping
        samples flash C.bad. Right column: C = B log₂(1 + S/N); "B" lights with a frequency-band bracket (tag "width"), "S/N"
        with a loud/quiet bar pair (tag "signal / noise"). A capacity curve over S/N draws (log shape, computed) with
        one marker: 20 MHz at 30 dB → 199 Mbit/s (computed). On "rare" clouds shrink as error-correcting redundancy
        is added (a code-word tag) and errors vanish.
      reveal_sequence:
        - {at_word: pack, action: 2 → 4 → 16 constellation points}
        - {at_word: blur, action: clouds overlap; errors flash}
        - {at_word: limit, action: equation writes}
        - {at_word: wide, action: B lights with band bracket}
        - {at_word: strong, action: S/N lights; capacity curve draws; marker}
        - {at_word: rare, action: errors vanish with coding}
      equations: ['C = B\log_2\!\Big(1+\frac{S}{N}\Big)']
      camera: "2.5D tilt and slow orbit of the constellation plane"
      layout: L2
      layers: [bg_solid, constellation_points, noise_clouds, equation_column, capacity_curve]
    engines: {primary: moderngl, secondary: [manim, numpy]}
    engine_reason: "Tens of thousands of noisy samples as GPU splats; curve and equation in Manim."
    retention_device: "a hard limit (nature says no)"
    interrupt: equation
    transition_out: "The constellation plane recedes into a starfield."
    sfx_music: "Static that clears as errors vanish."

  - id: c08_s03
    chapter: c08
    title: "Voyager"
    arc_step: payoff
    duration_s: 24.00
    duration_source: audio
    goal: "Where it runs (WiFi, phones, Voyager); bridge to inference."
    narration: |
      Every WiFi and mobile network is designed against this limit. [pause 0.4s] Voyager One, more than twenty four
      billion kilometres away, still sends data home with a radio of about twenty watts. [pause 0.8s] The receiver
      hears a faint, noisy signal and has to work out what was most likely sent, and reasoning backward from
      evidence like that is the subject of our next equation.
    pause_after_s: 2.0
    visual:
      description: >
        2.5D depth: a starfield (seeded points at three depths, parallax). A small Voyager line-art silhouette far
        away; a faint wave pulse travels toward the camera, getting weaker (amplitude ∝ 1/distance, tag "24 billion
        km"). A dish outline at the near side receives it; the received constellation plane shows one fuzzy point
        between candidates. On "most likely" each candidate gets a probability bar (C.bayes) computed from the
        Gaussian likelihoods.
      reveal_sequence:
        - {at_word: WiFi, action: router and tower icons glow briefly}
        - {at_word: Voyager, action: starfield; Voyager far away; distance tag}
        - {at_word: twenty watts, action: pulse travels toward the camera}
        - {at_word: receiver, action: dish; fuzzy received point}
        - {at_word: most likely, action: probability bars on the candidates}
        - {at_word: evidence, action: bars turn the Bayes hue}
      equations: []
      camera: "2.5D long dolly from Voyager to the dish (parallax layers)"
      layout: L1
      layers: [starfield_points, voyager_skia, pulse_shader, dish, candidate_bars]
    engines: {primary: moderngl, secondary: [skia-python, manim]}
    engine_reason: "Parallax starfield and pulse in GL; line art in skia; bars in Manim."
    retention_device: "scale wonder (a 20 W radio across the solar system)"
