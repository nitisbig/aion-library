    sfx_music: "The chord plays, then its three notes one by one."

  - id: c05_s02
    chapter: c05
    title: "The sieve"
    arc_step: equation
    duration_s: 24.23
    duration_source: audio
    goal: "The transform as a frequency test; epicycles as the same idea drawn."
    narration: |
      The Fourier transform runs this in reverse. [pause 0.4s] It tests a signal against one pure frequency after
      another, and when a test wave matches part of the signal, the total grows large. [pause 0.6s] What comes out
      is a list of the frequencies inside, and how strong each one is. [pause 0.5s] Even a drawing can be rebuilt
      this way, from circles spinning at different speeds.
    pause_after_s: 0.8
    visual:
      description: >
        L2. Stage top: the chord signal; middle: a test wave (C.muted) whose frequency sweeps; bottom: their product,
        shaded area above/below zero. Right: the spectrum builds bar by bar (C.fourier) as the sweep passes; three tall
        spikes at C, E, G. Right column: F(ω) = ∫ f(t) e^{−iωt} dt with "f(t)" tag "signal", "e^{−iωt}" tag "test wave",
        "∫" tag "total". On "drawing" the stage clears to a Fourier epicycle chain (aion.maths.fourier, 60 terms)
        drawing a treble-clef outline in C.fourier with the circles in C.muted.
      reveal_sequence:
        - {at_word: reverse, action: equation writes}
        - {at_word: tests, action: test wave sweeps; product area shades}
        - {at_word: matches, action: product all positive; area glows; spike rises}
        - {at_word: list, action: 'spectrum completes: three spikes'}
        - {at_word: drawing, action: epicycle chain starts drawing}
        - {at_word: circles, action: camera pushes along the chain's tip}
      equations: ['F(\omega)=\int_{-\infty}^{\infty} f(t)\,e^{-i\omega t}\,dt']
      camera: "2D, then 2.5D follow-cam on the epicycle tip"
      layout: L2
      layers: [bg_solid, signal_product_manim, spectrum_bars, equation_column, epicycles_manim]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Products, integrals and epicycles are all exact numpy curves drawn by Manim."
    retention_device: "machine metaphor (test and match); signature shot (epicycles)"
    interrupt: equation
    transition_out: "The finished drawing tilts back into a 3D spectrogram landscape."
    sfx_music: "A sweep tone; a soft ding at each spike."

