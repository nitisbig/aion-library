# ======================================================================== C08 SHANNON
  - id: c08_s01
    chapter: c08
    title: "Bits and noise"
    arc_step: hook
    duration_s: 21.81
    duration_source: audio
    goal: "The bit as a unit; human example (a song or a text is just bits); noise enters."
    narration: |
      In nineteen forty eight, Claude Shannon, an engineer at Bell Labs, gave information a unit: the bit, a single
      yes or no. [pause 0.5s] A song, a photograph or a page of text can all be written as bits. [pause 0.5s] But
      any signal sent down a wire, or through the air, collects noise along the way.
    pause_after_s: 0.8
    visual:
      description: >
        2D: name tag "Claude Shannon · 1948" (portrait on the chapter card). A coin-like toggle flips 0/1 (C.shannon). On
        "song" three small icons (note, photo, speech bubble) dissolve into rows of bits. The bits become a clean
        square wave (C.signal) on a scope grid; on "noise" seeded Gaussian noise (C.noise) adds live and the wave
        frays; at the receiver end a threshold line decides each bit, and a few are wrong (marked C.bad).
      reveal_sequence:
        - {at_word: Shannon, action: name tag}
        - {at_word: bit, action: 0/1 toggle flips}
        - {at_word: song, action: icons dissolve into bits}
        - {at_word: wire, action: square wave on a scope}
        - {at_word: noise, action: noise adds; wrong bits marked}
      equations: []
      camera: "2D, slow push"
      layout: L1
      layers: [bg_solid, portrait, icons_skia, scope_manim, noise_trace]
    engines: {primary: manim, secondary: [skia-python, numpy]}
    engine_reason: "Scope traces from seeded numpy noise; icons as skia arrays."
    retention_device: "human example (everything is bits)"
    interrupt: visual
    transition_out: "The scope's two levels become two points on a plane; more points appear."
