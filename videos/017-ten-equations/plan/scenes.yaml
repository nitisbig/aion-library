        5 %, 20 % of its DCT coefficients (computed), sharpening. On "MRI" a k-space image transforms into a head
        slice (Shepp–Logan phantom, computed inverse FFT). On "clocks" the spectrum spike becomes a single sine that
        ticks; on "same rate" two identical ticking clocks appear side by side.
