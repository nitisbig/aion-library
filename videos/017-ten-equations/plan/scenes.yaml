      are the orbitals of the atom, and they decide how atoms bond, which is to say, all of chemistry. [pause 0.6s]
      Lasers, computer chips and MRI scanners were all designed with this equation. [pause 0.8s] And a wave that
      spreads and swirls as it moves turns out to describe something much larger than an atom.
    pause_after_s: 2.0
    visual:
