# plan/scenes.yaml: the source of truth for video 017 (10 Equations That Run the Modern World).
#
# Edit narration and visuals here, then regenerate everything that derives from it:
#   uv run python videos/017-ten-equations/scripts/build_script.py
# That rewrites voiceover.md, script/narration_full.md, plan/scene_plan.md, storyboard.md and fills duration_s
# (estimate). After voicing, scripts/timing.py replaces duration_s with the real value (duration_source: audio).
#
# Narration marks: [pause 0.8s] = extra silence inserted after the audio is generated (free to change);
# *word* = emphasis (a note for the read; stripped before TTS). Numbers are written as spoken.
# The narration never reads symbols aloud: each equation is translated into a plain sentence while its terms light.
# reveal_sequence[].at_word must appear in the scene's narration, in order (checked by build_script.py).
# Every spoken figure is computed and asserted in eqdata.py (verify()).
# Colours are theme roles (C.<role>): one hue per chapter (maxwell, einstein, schrod, navier, fourier, dilation,
# descent, shannon, bayes, bs) plus in-chapter roles (e_field, b_field, charge_p, charge_n, light, mass, psi, dye,
# signal, noise, prior, posterior, path, payoff). Final hexes are set in theme.py at the design-sheet stage.
# Layouts: L1 full-bleed, L2 sim + open column, L3 one open stage with two subjects, L4 wall / carousel. No boards,
# boxes, panels or n/10 counters; text never glows; the progress rail sits bottom-left. See design/design_sheet.md.
# Camera: 2D flat · 2.5D (s.camera push/pan/rotate + parallax depth layers) · 3D (Manim ThreeD, pyvista, ray trace).

video:
  slug: 017-ten-equations
  title: "10 Equations That Run the Modern World"
  alt_titles:
    - "The 10 Equations Behind Your Phone, Your Weather and the Stock Market"
    - "Ten Equations That Changed Everything, Explained Visually"
    - "From Light to Markets: 10 Equations That Run the World"
  mode: concept overview (one plain-words translation and one live simulation per equation; no derivations)
  audience: curious learners and undergrads; no maths assumed beyond the idea of a rate of change
  target_runtime_s: {min: 720, goal: 780, max: 840}
  master_format: "3840x2160, 30 fps, SDR Rec.709 (drafts, stills and previews 1920x1080)"
  spine: >-
    Ten windows on one wall. The intro shows all ten equations running at once as live simulations in a 5x2 wall of
    tiles; each chapter opens by flying into its tile and closes on a bridge line that hands one idea to the next
    (light → gravity → the atom → flow → frequency → clocks → learning → noisy wires → evidence → markets). Every
    chapter follows the same rhythm: an everyday hook, the picture (a simulation computed from the real maths), the
    equation lit term by term while the narration says it in plain words, where it runs today, and the bridge. The
    outro pulls the ten tiles into one orbiting 3D web whose links are those bridges.

datasets:
  - name: wall
    what: >-
      The ten tile precomps (one Comp per chapter, 16:9, rendered at tile size): EM wave, ray-traced black hole,
      phase-coloured wave packet, vortex street, Fourier epicycles, light clock, ball on a loss surface, noisy
      constellation, Bayes dot grid, random-walk fan. Built once, reused in the intro, every chapter opening, every
      chapter card and the outro carousel.
    used_in: [in_s02, in_s03, every chapter's s01, out_s01]
  - name: physics
    what: >-
      eqdata.py: c = 1/sqrt(mu0 eps0) = 2.998e8 m/s; GPS clocks -7.21 us/day (speed) +45.72 us/day (gravity) = +38.5
      us/day, 11.5 km/day range error; muon at 0.995c: gamma 10, 655 m → 6.6 km; Bayes 10 ill, 9 true and 89 false
      positives → 9.2 % (1 in 10.9); Shannon 20 MHz at 30 dB → 199 Mbit/s; call payoff max(S - 100, 0).
    used_in: [c01_s03, c06_s02, c06_s03, c08_s02, c09_s01, c10_s01]
  - name: sims
    what: >-
      Seeded, baked simulations in sims.py: dipole radiation (analytic, GLSL), Schrödinger split-step FFT (numpy,
      1D barrier + 2D double slit), stable-fluids vortex street (Taichi, 512x256, seed 1704), gradient-descent swarm
      on a two-valley landscape (numpy, seed 1707), QAM-16 constellation with Gaussian noise (seed 1708), geometric
      Brownian price paths (seed 1710, 2,000 paths), heat equation (aion Heat2D).
    used_in: [c01, c03, c04, c07, c08, c10]

layouts:
  - {id: L1, name: Full-bleed, use: "The simulation owns the whole frame and runs to the edges. The equation floats over it in open space, on a feathered shade (an invisible soft darkening) only where the picture behind is busy. Hooks, chapter cards, black hole, vortex street, price paths."}
  - {id: L2, name: Sim + open column, use: "The simulation fills the left two thirds and fades into black (no edge, no frame). The equation floats in the open right column (x 2.75 to 6.40), lit term by term, with one key-word tag per term or a small term → word legend, plus at most one small plot."}
  - {id: L3, name: One stage, two subjects, use: "Comparisons share one open black stage, separated by space and a small-caps label, never by boxes or a divider (clock at rest vs moving, small vs large steps, prior vs posterior)."}
  - {id: L4, name: Wall / carousel, use: "The 5x2 wall of ten borderless live tiles (intro), each with a 2 px rule in its chapter hue and its name and year in small caps; the outro turns the same tiles into a carousel in depth."}

boards:
  - {name: "T1–T10 · the ten live tiles", pinned_in: in_s02, recalled_in: [c01_s01, c02_s01, c03_s01, c04_s01, c05_s01, c06_s01, c07_s01, c08_s01, c09_s01, c10_s01, out_s01], wiped_at: "never; each chapter flies into its tile and out of it"}
  - {name: "Progress rail · bottom-left, ten segments sized by chapter length, chapter title in small caps above, head moves with audio time", pinned_in: in_s03 (draws in on 'begin with light'), recalled_in: [all chapters], wiped_at: out_s01}
  - {name: "Name tag · top-left hue rule over small caps 'Name · year', first appearance only", pinned_in: each person's first mention, recalled_in: [], wiped_at: "fades after ~4 s"}

chapters:
  - id: intro
    title: Intro
    target_s: 80
  - id: c01
    title: "Maxwell's Equations"
    target_s: 66
    lens: "Electricity and magnetism are one thing, and light is a wave of it."
    takeaway: "Four rules for electric and magnetic fields; two of them feed each other into a wave that moves at the speed of light."
    concepts:
      - {concept: field, graphic: "iron-filing texture around a charge and a bar magnet", equation: null, animation: "LIC texture flows in, field lines fade up"}
      - {concept: the four laws, graphic: "one field picture morphing through four states: spreading, closed loops, two swirls", equation: '\nabla\cdot\mathbf E=\rho/\varepsilon_0,\ \nabla\cdot\mathbf B=0,\ \nabla\times\mathbf E=-\partial_t\mathbf B,\ \nabla\times\mathbf B=\mu_0\mathbf J+\mu_0\varepsilon_0\partial_t\mathbf E', animation: "each law lights with its picture"}
      - {concept: light as a wave, graphic: "3D E and B sine waves at right angles, travelling", equation: 'c = 1/\sqrt{\mu_0\varepsilon_0}', animation: "camera orbits the travelling wave; dipole antenna radiates"}
  - id: c02
    title: "Einstein's Field Equations"
    target_s: 70
    lens: "Gravity is the shape of spacetime."
    takeaway: "Matter and energy curve spacetime; things move along the curves; enough curve traps light."
    concepts:
      - {concept: curved spacetime, graphic: "grid sheet sinking under a mass, a marble orbiting", equation: null, animation: "sheet warps, orbit traced"}
      - {concept: field equations, graphic: "geometry on the left, matter on the right", equation: 'G_{\mu\nu}+\Lambda g_{\mu\nu}=\frac{8\pi G}{c^4}T_{\mu\nu}', animation: "two halves light, Wheeler line"}
      - {concept: black hole, graphic: "ray-traced black hole with disk and photon ring", equation: null, animation: "camera orbit; LIGO ripples"}
  - id: c03
    title: "The Schrödinger Equation"
    target_s: 66
    lens: "At the smallest scale, matter moves like a wave."
    takeaway: "A wave decides where a particle is likely to be; trapped waves make atoms."
    concepts:
      - {concept: wave-particle, graphic: "double-slit dots building stripes", equation: null, animation: "dots land one at a time, then thousands"}
      - {concept: wave function, graphic: "phase-coloured wave packet tunnelling through a wall", equation: 'i\hbar\,\frac{\partial\psi}{\partial t}=\hat H\psi', animation: "packet splits at the barrier"}
      - {concept: orbitals, graphic: "3D probability clouds of hydrogen", equation: null, animation: "camera orbits 1s, 2p, 3d clouds"}
  - id: c04
    title: "The Navier–Stokes Equations"
    target_s: 66
    lens: "Newton's push rule, written for every drop of a fluid."
    takeaway: "A parcel of fluid is pushed by the flow, by pressure and by stickiness; nobody has proved the answers always stay smooth."
    concepts:
      - {concept: fluid parcel, graphic: "cream swirling in coffee; one parcel picked out", equation: 'F = ma', animation: "parcel highlighted and followed"}
      - {concept: the terms, graphic: "arrow grid: carried, pressure, viscosity", equation: '\rho\Big(\frac{\partial\mathbf u}{\partial t}+\mathbf u\cdot\nabla\mathbf u\Big)=-\nabla p+\mu\nabla^2\mathbf u+\mathbf f', animation: "each term lights with its arrows"}
      - {concept: turbulence, graphic: "vortex street, then a turbulent cascade", equation: '\nabla\cdot\mathbf u=0', animation: "Taichi sim, camera drift"}
  - id: c05
    title: "The Fourier Transform"
    target_s: 64
    lens: "Any signal is a sum of pure waves."
    takeaway: "The transform tests every frequency and lists which ones are inside a signal."
    concepts:
      - {concept: superposition, graphic: "a chord's wave splitting into three sines", equation: null, animation: "the bumpy line separates into layers"}
      - {concept: the transform, graphic: "test wave sliding through frequencies, a spike where it matches; epicycles drawing", equation: 'F(\omega)=\int_{-\infty}^{\infty} f(t)\,e^{-i\omega t}\,dt', animation: "spectrum grows bar by bar"}
      - {concept: compression, graphic: "3D spectrogram; a photo rebuilt from a few frequencies", equation: null, animation: "camera orbit; image sharpens"}
  - id: c06
    title: "Relativistic Time Dilation"
    target_s: 70
    lens: "Light's speed is fixed, so time has to give."
    takeaway: "A moving clock ticks slower by the factor gamma; GPS has to correct for it."
    concepts:
      - {concept: light clock, graphic: "photon between mirrors, at rest and on a train", equation: null, animation: "vertical vs slanted path"}
      - {concept: gamma, graphic: "right triangle → the gamma curve, flat then a wall", equation: '\Delta t\,'' = \frac{\Delta t}{\sqrt{1-v^2/c^2}}', animation: "triangle legs lock to the formula"}
      - {concept: GPS, graphic: "lit Earth with GPS orbits and clock faces", equation: '+45.7 - 7.2 = +38.5\ \mu s/\text{day}', animation: "clock offsets tally; position drifts"}
  - id: c07
    title: "Gradient Descent"
    target_s: 64
    lens: "Learning is walking downhill on your own error."
    takeaway: "Feel the slope, step against it, repeat; the same rule trains models with billions of knobs."
    concepts:
      - {concept: descent, graphic: "a walker on a foggy 3D hill", equation: '\theta \leftarrow \theta - \eta\,\nabla L(\theta)', animation: "steps follow the slope"}
      - {concept: step size, graphic: "three balls: crawl, settle, overshoot; a line fitting points", equation: null, animation: "two subjects on one open stage"}
      - {concept: scale, graphic: "a swarm of descenders on a large landscape", equation: null, animation: "swarm pours into valleys"}
  - id: c08
    title: "Shannon's Channel Capacity"
    target_s: 64
    lens: "Every channel has a speed limit set by noise."
    takeaway: "Capacity grows with bandwidth and with signal-to-noise, but only as a logarithm."
    concepts:
      - {concept: bit and noise, graphic: "a clean square wave becoming noisy", equation: null, animation: "noise added live"}
      - {concept: capacity, graphic: "constellation points blurring together; capacity curve", equation: 'C = B\log_2\!\Big(1+\frac{S}{N}\Big)', animation: "more points → overlap"}
      - {concept: deep space, graphic: "Voyager signal crossing a starfield", equation: null, animation: "2.5D depth push"}
  - id: c09
    title: "Bayes' Theorem"
    target_s: 66
    lens: "A belief is updated by evidence, weighed by how common things were to begin with."
    takeaway: "A positive test from a rare disease is usually a false alarm; each clue sharpens belief."
    concepts:
      - {concept: base rates, graphic: "1,000 dots: 10 ill, 9 + 89 positives", equation: '9/(9+89)\approx 9\%', animation: "dots sort into groups"}
      - {concept: the rule, graphic: "area diagram rebuilt from the dots", equation: 'P(A\mid B)=\frac{P(B\mid A)\,P(A)}{P(B)}', animation: "areas map to terms"}
      - {concept: updating, graphic: "belief curve sharpening clue by clue (3D ribbon); search heat map", equation: null, animation: "ribbon grows in depth"}
  - id: c10
    title: "The Black–Scholes Equation"
    target_s: 66
    lens: "Price a promise by cancelling the randomness."
    takeaway: "Hedging removes the risk term and leaves a heat equation for the option's value; a model, not the market."
    concepts:
      - {concept: option payoff, graphic: "hockey-stick payoff", equation: '\max(S-K,\,0)', animation: "price slider bends the stick"}
      - {concept: the equation, graphic: "random price paths fanning; heat spreading in a bar", equation: '\frac{\partial V}{\partial t}+\tfrac12\sigma^2S^2\frac{\partial^2V}{\partial S^2}+rS\frac{\partial V}{\partial S}-rV=0', animation: "paths → bell; PDE → heat equation"}
      - {concept: model risk, graphic: "3D value surface; a crash jump the model misses", equation: null, animation: "surface orbit, jump"}
  - id: outro
    title: Outro
    target_s: 45

loops:
  - {id: L1, promise: "How does a beam of light lead all the way to the stock market?", planted_in: [in_s03], paid_in: [out_s01]}
  - {id: L2, promise: "Does every clock tick at the same rate?", planted_in: [c05_s03], paid_in: [c06_s01, c06_s03]}
  - {id: L3, promise: "What happens near something heavy?", planted_in: [c01_s03], paid_in: [c02_s01, c02_s03]}
  - {id: L4, promise: "Fourier's bar of hot metal: where does a modest question lead?", planted_in: [in_s01], paid_in: [c05_s01, c10_s02, out_s02]}

scenes:
# ======================================================================== INTRO
  - id: in_s01
    chapter: intro
    title: "A bar of hot metal"
    arc_step: hook
    duration_s: 36.17
    duration_source: audio
    goal: "Open on history and mathematics: Fourier's modest question about heat grew into tools he never imagined."
    narration: |
      Two hundred years ago, the French mathematician Joseph Fourier set out to understand something quite modest:
      how heat spreads through a bar of metal. [pause 0.6s] To solve the equation he wrote for it, he broke the
      temperature into a sum of simple, smooth waves. [pause 0.8s] He could not have known that the same idea would
      one day carry music, compress photographs and let doctors see inside the human body. [pause 0.8s] Equations
      often go this way. [pause 0.3s] Someone writes one down to understand a single thing, and it ends up running a
      part of the world they never imagined.
    pause_after_s: 0.8
    visual:
      description: >
        Black stage, Classic look. A thin metal bar (C.frame outline) lies across the lower third; one end starts to glow
        and heat spreads along it (aion Heat2D, C.fourier → white, accent glow on the hot end only). Above it the heat
        equation writes itself stroke by stroke in Computer Modern, ∂u/∂t = α ∂²u/∂x², with a name tag (top-left) "Joseph
        Fourier · 1822". On "smooth waves" the bar's temperature curve lifts off the bar and
        splits into its first five sine modes (computed Fourier series of the real profile), stacked in 2.5D depth, each
        decaying at its own rate. On "music", "photographs" and "inside" the sines flow into three small line-art vignettes
        (unframed, fading into black) in turn: a sound waveform, an 8x8 DCT block over a photo, an MRI slice. On "Equations often" everything shrinks
        into one tile (T5) and the other nine tiles fade up around it in the dark, still dim, hinting at the wall.
      reveal_sequence:
        - {at_word: Two hundred years ago, action: the year rolls back from 2026 to 1807}
        - {at_word: Joseph, action: Fourier's portrait is revealed; the year becomes his name tag}
        - {at_word: modest, action: the portrait steps aside; the metal bar fades in}
        - {at_word: heat, action: one end glows; heat spreads along the bar}
        - {at_word: equation, action: heat equation writes stroke by stroke; Fourier name tag}
        - {at_word: smooth waves, action: temperature curve splits into five sine modes in depth}
        - {at_word: music, action: sines flow into a sound waveform}
        - {at_word: photographs, action: an 8x8 frequency block over a photo}
        - {at_word: inside, action: an MRI slice}
        - {at_word: Equations often, action: everything shrinks into tile T5; nine dim tiles fade up around it}
        - {at_word: never imagined, action: 'hold; T5 lit, the rest dim'}
      equations: ['\frac{\partial u}{\partial t}=\alpha\,\frac{\partial^2 u}{\partial x^2}']
      camera: "2D, then 2.5D: the sine modes separate in z; slow pull-back as the scene shrinks into T5"
      layout: L1
      layers: [bg_solid, heat2d_bar, equation_manim, name_tag, sine_modes_parallax, app_vignettes_skia, dim_tiles]
    engines: {primary: manim, secondary: [taichi, skia-python, moderngl]}
    engine_reason: "Heat flow is aion's Taichi Heat2D; the equation and sine modes are exact Manim curves; vignettes are skia."
    retention_device: "historical story with a twist (a modest question → modern tools); plants loop L4 (Fourier's bar)"
    interrupt: visual
    transition_out: "Camera pulls back: T5 is one tile of a 5x2 wall whose other tiles are still dark."
    sfx_music: "Low room tone; a soft warm swell as the bar heats."

  - id: in_s02
    chapter: intro
    title: "Ten windows"
    arc_step: promise
    duration_s: 31.62
    duration_source: audio
    goal: "Show all ten equations running at once in one frame, introduced as a span of history."
    narration: |
      This video is about ten of them. [pause 0.4s] The oldest is an idea about probability, published in seventeen
      sixty three, and the youngest is a formula for pricing financial contracts, from nineteen seventy three.
      [pause 0.6s] Between them sit the laws of light and magnetism, the shape of gravity, and the wave that
      describes an atom. [pause 0.4s] Then come the motion of air and water, the slowing of moving clocks, the
      method machines use to learn, and the limit on how much any wire can carry.
    pause_after_s: 0.8
    visual:
      description: >
        L4 wall: 5x2 borderless tiles, each a live precomp running its simulation, with a 2 px rule in its chapter hue
        beneath it and its name in small caps on a shared baseline. T5 (Fourier) is already lit from the opening. The others light in
        the order the narration names them (dim 25 % → 100 %, a brief accent glow on the hue rule, never on the text), and each tile's year writes
        beneath it in small caps: T9 Bayes 1763 (1,000-dot grid sorting), T10 Black–Scholes 1973 (random-walk fan opening
        into a bell), T1 Maxwell 1865 (E/B wave), T2 Einstein 1915 (ray-traced black hole), T3 Schrödinger 1926 (phase-coloured
        wave packet), T4 Navier–Stokes 1845 (vortex street), T6 time dilation 1905 (light clock on a train), T7 gradient
        descent 1847 (ball rolling into a 3D valley), T8 Shannon 1948 (noisy constellation). A thin timeline 1763 → 1973
        runs under the wall with a tick per tile. The camera starts close on T5 and pulls back across the wall as tiles
        light, ending on the whole wall: the one-frame preview.
      reveal_sequence:
        - {at_word: ten of them, action: 'wall assembles; T5 lit, the others dim; timeline draws'}
        - {at_word: probability, action: T9 lights; 1763}
        - {at_word: pricing, action: T10 lights; 1973}
        - {at_word: light, action: T1 lights; 1865}
        - {at_word: gravity, action: T2 lights; 1915}
        - {at_word: atom, action: T3 lights; 1926}
        - {at_word: air, action: T4 lights; 1845}
        - {at_word: clocks, action: T6 lights; 1905}
        - {at_word: learn, action: T7 lights; 1847}
        - {at_word: wire, action: T8 lights; 1948; camera settles on the full wall}
      equations: []
      camera: "2.5D: start framed on T1 (zoom 4.5), pull back along the wall to zoom 1.0, easy_ease, synced to the lighting"
      layout: L4
      layers: [bg_solid, tile_precomps_x10, hue_rules, name_year_labels, timeline_manim, glow_rules]
    engines: {primary: moderngl, secondary: [manim, taichi, pyvista, skia-python]}
    engine_reason: "Ten precomps composited on the GPU; each tile uses its own chapter's engine at tile resolution."
    retention_device: "the whole video in one frame; ten lighting beats ordered by the story, not the list"
    interrupt: visual
    transition_out: "Wall holds; equations begin to type in under the tiles."
    sfx_music: "A soft tone per tile, rising across the ten."

  - id: in_s03
    chapter: intro
    title: "Sentences about change"
    arc_step: roadmap
    duration_s: 20.92
    duration_source: audio
    goal: "Lower the barrier (no symbols needed), promise the chain from light to markets, and launch chapter one."
    narration: |
      You won't need to follow the symbols, because each equation is really a sentence about how something changes,
      and we'll say each of those sentences in plain words. [pause 0.6s] They also lead into one another, in a chain
      that runs from a beam of light all the way to the stock market. [pause 0.8s] So we'll begin with light.
    pause_after_s: 2.0
    visual:
      description: >
        Under each tile its equation types in (Eqn, coloured in the tile's hue, font 30). On "plain words" the
        symbols of T1 dissolve and re-form as a short sans phrase ("fields make waves") and back, to show the
        translation idea. On "links" thin lit arcs draw tile to tile in chapter order (C.muted, the current arc in the
        next tile's hue) snaking through the wall from T1 to T10. On "light" the progress rail draws in at the bottom-left
        (ten segments in their hues, the first one live, "Maxwell's equations" above it) and the camera dives into T1 until it fills the frame (2.5D zoom with the other tiles sliding past in parallax).
      reveal_sequence:
        - {at_word: symbols, action: 'ten equations type in under the tiles, staggered 0.08 s'}
        - {at_word: plain words, action: T1's equation morphs to a short sans phrase and back}
        - {at_word: lead into, action: arc chain draws T1 → T10}
        - {at_word: stock market, action: chain reaches T10; T10 pulses}
        - {at_word: begin with light, action: progress rail draws in bottom-left; camera dives into T1}
      equations: ['all ten, one per tile (see chapters)']
      camera: "2.5D: hold, then dive into T1 (zoom 1 → 5.6, 1.6 s easy_ease, other tiles parallax past)"
      layout: L4
      layers: [bg_solid, tile_precomps_x10, equations_manim, link_arcs, progress_rail]
    engines: {primary: manim, secondary: [moderngl]}
    engine_reason: "Equations and arcs are Manim vector layers that re-render crisp through the camera dive."
    retention_device: "open loop L1 (light → market); the dive as a door"
    interrupt: camera
    transition_out: "Dive into T1 becomes chapter one's first shot (the chapter card plays over the dive)."
    sfx_music: "Whoosh on the dive, soft and low."

# ======================================================================== C01 MAXWELL
  - id: c01_s01
    chapter: c01
    title: "Two curiosities"
    arc_step: hook
    duration_s: 26.31
    duration_source: audio
    goal: "A short historical story (Ørsted's compass, a human-scale example) that leads to the idea of a field."
    narration: |
      In the early eighteen hundreds, electricity and magnetism looked like two separate curiosities. [pause 0.4s]
      Then in eighteen twenty, Hans Christian Ørsted saw a compass needle twitch beside a live wire, and the two
      turned out to be connected. [pause 0.6s] Around every charge and every magnet there is a field, a push or pull
      waiting at each point in space, and iron filings let you see its shape.
    pause_after_s: 0.8
    visual:
      description: >
        L3, one open stage. Left of centre: a charged sphere (C.charge_p) with small paper scraps lifting toward it.
        Right of centre: a lodestone bar magnet (N in C.b_field, S muted) with an iron nail sliding to it. On "Ørsted"
        the two drift together into one scene: a straight wire with a battery and a compass beside it; the current
        switches on and the needle swings (name tag "Hans Christian Ørsted · 1820"). On "field" the stage fills with a line-integral-convolution texture of the computed
        fields (GLSL LIC: the charge's radial field in C.e_field, the magnet's loops in C.b_field), flowing gently. On
        "iron filings" the magnet's texture sharpens into filing streaks and the camera pushes in.
      reveal_sequence:
        - {at_word: electricity, action: 'left: charged sphere lifts paper scraps'}
        - {at_word: magnetism, action: 'right: magnet pulls a nail'}
        - {at_word: Ørsted, action: 'the two drift together: wire, battery, compass; Ørsted name tag'}
        - {at_word: twitch, action: current on; needle swings}
        - {at_word: field, action: LIC field textures flow in}
        - {at_word: iron filings, action: magnet texture sharpens into filings; camera pushes in}
      equations: []
      camera: "2D, then a 2.5D push into the magnet"
      layout: L3
      layers: [bg_solid, skia_props, glsl_lic_e, glsl_lic_b, name_tag]
    engines: {primary: moderngl, secondary: [skia-python, manim]}
    engine_reason: "LIC (vector field texture) is a per-pixel shader; props are crisp skia arrays."
    retention_device: "human-scale historical moment (a twitching needle); turns the invisible into a picture"
    interrupt: visual
    transition_out: "The magnet's filing texture spreads to fill the stage and becomes the first law's field."
    sfx_music: "A faint electric click as the current switches on."

  - id: c01_s02
    chapter: c01
    title: "Four rules"
    arc_step: equation
    duration_s: 27.14
    duration_source: audio
    goal: "Give each of Maxwell's four laws a picture and a plain sentence."
    narration: |
      Forty years later, James Clerk Maxwell gathered all of it into four equations. [pause 0.5s] Electric field
      lines spread outward from charges, while magnetic field lines never begin or end, and always close into loops.
      [pause 0.5s] A changing magnetic field drives the electric field around in a circle, which is how every power
      station makes electricity. [pause 0.4s] And a changing electric field does the same to the magnetic field.
    pause_after_s: 0.8
    visual:
      description: >
        L2. Name tag "James Clerk Maxwell · 1865" (his portrait is on the chapter card). One stage on the left morphs
        through four vector-field pictures, one per law, while the laws stack in the open right column as each is spoken
        (the stack that frame 03 shows): (1) arrows bursting
        out of a + charge (C.charge_p) into a − charge (C.charge_n): ∇·E = ρ/ε₀; (2) closed magnetic loops through a
        bar magnet, a probe box shows equal in and out: ∇·B = 0; (3) a magnet pushed into a coil; the rising B
        (C.b_field) wraps a circulating E swirl (C.e_field) and a bulb glows: ∇×E = −∂B/∂t; (4) a charging capacitor;
        the growing E between the plates wraps a B swirl: ∇×B = μ₀J + μ₀ε₀∂E/∂t. Key-word tags only: "spread",
        "loops", "swirl", "swirl". The ∂E/∂t term gets an accent glow (it is Maxwell's own addition).
      reveal_sequence:
        - {at_word: Maxwell, action: name tag (James Clerk Maxwell · 1865); the stage clears}
        - {at_word: spread outward, action: 'picture 1: field bursts from charges; law 1 writes in the column'}
        - {at_word: never begin, action: 'morph to picture 2: closed loops; law 2 writes'}
        - {at_word: loops, action: 'probe box: in = out'}
        - {at_word: changing magnetic, action: 'morph to picture 3: magnet into coil, E swirl; law 3 writes'}
        - {at_word: power station, action: the bulb glows}
        - {at_word: changing electric, action: 'morph to picture 4: capacitor, B swirl; law 4 writes; ∂E/∂t glows'}
      equations: ['\nabla\cdot\mathbf E=\rho/\varepsilon_0', '\nabla\cdot\mathbf B=0', '\nabla\times\mathbf E=-\frac{\partial\mathbf B}{\partial t}', '\nabla\times\mathbf B=\mu_0\mathbf J+\mu_0\varepsilon_0\frac{\partial\mathbf E}{\partial t}']
      camera: "2D; a slow 2.5D drift as each picture morphs into the next"
      layout: L2
      layers: [bg_solid, name_tag, field_morph_manim, field_arrows, law_stack_column, glow_term]
    engines: {primary: manim, secondary: [moderngl]}
    engine_reason: "2D vector fields, coils and equations are Manim; the term glow is a GL fx layer."
    retention_device: "four quick beats, each picture + rule; history in one line"
    interrupt: equation
    transition_out: "Pictures 3 and 4 overlap on the stage; their two swirls interlock."
    sfx_music: "A low hum when the bulb lights."

  - id: c01_s03
    chapter: c01
    title: "Light"
    arc_step: payoff
    duration_s: 30.76
    duration_source: audio
    goal: "The two swirls feed each other into a travelling wave whose speed is c; light is that wave."
    narration: |
      Those last two laws feed each other. [pause 0.4s] Each field, as it changes, creates the other, so together
      they can travel through empty space as a wave. [pause 0.6s] When Maxwell worked out its speed, he got the
      speed of light. [pause 0.8s] Light is an electromagnetic wave, and so are radio, WiFi and every signal a phone
      sends. [pause 0.8s] It seemed obvious that light travels in straight lines, until Einstein asked what happens
      near something heavy.
    pause_after_s: 2.0
    visual:
      description: >
        3D: an E sine wave (C.e_field, vertical plane) and a B sine wave (C.b_field, horizontal plane) at right
        angles, travelling along the axis (Manim ThreeD, pure function of t). Camera orbits from side view to a
        three-quarter view. On "speed" the right column shows c = 1/√(μ₀ε₀) and the value 2.998 × 10⁸ m/s (computed);
        it matches a "speed of light" tag (accent glow on the match). On "radio" the scene cuts wide (2.5D) to a
        dipole antenna radiating: an analytic dipole-radiation shader (field strength rings, C.light) with a
        wavelength ruler sliding from radio to visible (a spectrum bar in muted hues). On "straight lines" a single
        ray (C.light, glow) shoots across the frame; a heavy dark sphere fades in ahead of it.
      reveal_sequence:
        - {at_word: feed each other, action: 'E and B waves start travelling, camera orbit begins'}
        - {at_word: empty space, action: background fields fade; only the wave in space}
        - {at_word: its speed, action: 'right column: c from mu0 and eps0'}
        - {at_word: speed of light, action: value matches the tag; glow}
        - {at_word: radio, action: 'wide: dipole antenna radiating rings'}
        - {at_word: signal, action: spectrum ruler slides; radio band highlighted}
        - {at_word: straight lines, action: one light ray crosses the frame}
        - {at_word: heavy, action: a dark mass fades in ahead of the ray}
      equations: ['c=\frac{1}{\sqrt{\mu_0\varepsilon_0}}\approx 2.998\times10^{8}\ \mathrm{m/s}']
      camera: "3D orbit (phi 70°, theta −60° → −20°), then 2.5D wide on the antenna"
      layout: L2
      layers: [bg_solid, manim3d_em_wave, glsl_dipole, equation_column, light_ray_glow]
    engines: {primary: manim, secondary: [moderngl]}
    engine_reason: "The 3D wave is Manim ThreeD driven by t; the dipole radiation is an analytic GLSL field."
    retention_device: "payoff (light = EM wave); opens loop L3 (near something heavy)"
    interrupt: camera
    transition_out: "Bridge: the light ray bends around the mass, and the mass sinks into a grid sheet (chapter two)."
    sfx_music: "A rising tone as the wave starts moving."

# ======================================================================== C02 EINSTEIN
  - id: c02_s01
    chapter: c02
    title: "Gravity as shape"
    arc_step: hook
    duration_s: 24.74
    duration_source: audio
    goal: "Gravity as shape, through the human-scale example of a ball on a stretched sheet; pays loop L3."
    narration: |
      Newton described gravity as a pull between masses, but in nineteen fifteen, Einstein replaced that picture.
      [pause 0.4s] Mass bends space and time around it, much as a heavy ball sinks into a stretched sheet, and
      anything moving nearby simply follows the curve. [pause 0.5s] The Earth orbits the Sun because that is the
      straightest path open to it through curved spacetime.
    pause_after_s: 0.8
    visual:
      description: >
        3D: a flat grid sheet (C.grid lines over black) seen at 30°. On "pulls" a 2D Newton picture: an arrow from
        Earth to Sun (C.muted) that fades. On "bends" a heavy sphere (C.mass, lit) presses in and the sheet sinks into
        an embedding surface computed from the Schwarzschild metric (pyvista, smooth shading, grid lines kept). A
        marble (C.einstein) rolls in and settles into a precessing orbit (integrated geodesic, seeded). On
        "straightest" the camera drops to look along the orbit; a dashed "straight" line on the curved sheet lights.
      reveal_sequence:
        - {at_word: pull, action: 'Newton arrow Earth → Sun, then fades'}
        - {at_word: Einstein, action: 'name tag: Albert Einstein · 1915'}
        - {at_word: bends, action: mass lowers; sheet sinks}
        - {at_word: curve, action: marble rolls in and orbits}
        - {at_word: Earth, action: marble becomes a small Earth; Sun at the centre}
        - {at_word: straightest, action: camera drops along the orbit; geodesic line lights}
      equations: []
      camera: "3D: slow orbit around the sheet, then a low dolly along the orbit"
      layout: L1
      layers: [bg_solid, pyvista_sheet_and_mass, orbit_trail, portrait, newton_arrow_manim]
    engines: {primary: pyvista, secondary: [manim, numpy]}
    engine_reason: "A shaded height-field surface with a lit sphere needs a 3D renderer; the orbit is integrated in numpy."
    retention_device: "human example (ball on a sheet); old idea vs new idea"
    interrupt: camera
    transition_out: "The sheet drifts to the left of the stage; the equation writes into the open space on the right."
    sfx_music: "Low rubbery stretch as the sheet sinks."

  - id: c02_s02
    chapter: c02
    title: "The equation"
    arc_step: equation
    duration_s: 27.46
    duration_source: audio
    goal: "Read the field equations as geometry = matter; show the 1919 eclipse test."
    narration: |
      The field equations put this into a single line. [pause 0.4s] One side describes the shape of spacetime, and
      the other the matter and energy inside it. [pause 0.6s] As the physicist John Wheeler put it, matter tells
      spacetime how to curve, and spacetime tells matter how to move. [pause 0.6s] Four years later, during a solar
      eclipse, astronomers measured starlight bending around the Sun by just the amount Einstein had predicted.
    pause_after_s: 0.8
    visual:
      description: >
        L2: the sheet on the left keeps orbiting. Right column: G_μν + Λg_μν = (8πG/c⁴) T_μν. Left side lights in
        C.einstein with tag "shape"; right side T_μν lights in C.mass with tag "matter". On Wheeler's line, arrows
        loop between the two halves and between the sheet and the marble. On "eclipse" the stage becomes 2.5D: a
        black Moon disc covers the Sun's glow, background stars (seeded) shift outward by the computed deflection
        (exaggerated ×2000, tagged), with ghost markers at their old spots; "1.75″" tag at the limb.
      reveal_sequence:
        - {at_word: single line, action: equation writes}
        - {at_word: shape, action: left side lights; tag 'shape'}
        - {at_word: matter and energy, action: right side lights; tag 'matter'}
        - {at_word: Wheeler, action: arrows loop between the halves}
        - {at_word: eclipse, action: eclipse scene; stars shift from ghost markers}
        - {at_word: predicted, action: 1.75 arcsec tag; hold}
      equations: ['G_{\mu\nu}+\Lambda g_{\mu\nu}=\frac{8\pi G}{c^4}\,T_{\mu\nu}']
      camera: "2D; 2.5D push into the eclipse"
      layout: L2
      layers: [bg_solid, sheet_precomp, equation_column, eclipse_stars_points, moon_disc]
    engines: {primary: manim, secondary: [moderngl, pyvista]}
    engine_reason: "Equation and arrows in Manim; stars as a PointsLayer; the sheet reuses the s01 render."
    retention_device: "a prediction tested (proof moment); short quote"
    interrupt: equation
    transition_out: "Camera pushes into the Sun's glow; it collapses to a black disc with a ring."
    sfx_music: "Quiet; a shutter click on the eclipse."

  - id: c02_s03
    chapter: c02
    title: "Black hole"
    arc_step: payoff
    duration_s: 30.56
    duration_source: audio
    goal: "The extreme case: a ray-traced black hole; then LIGO's ripples; bridge to the very small."
    narration: |
      Squeeze enough mass into a small enough space, and the curve becomes so steep that not even light can climb
      back out. [pause 0.6s] That is a black hole. [pause 0.8s] In twenty fifteen, the LIGO detectors picked up
      ripples in spacetime from two black holes merging, a stretch of less than a hundredth of a proton's width.
      [pause 0.8s] Einstein's equations govern the very large, but at the scale of a single atom, matter stops
      behaving like a ball on a sheet.
    pause_after_s: 2.0
    visual:
      description: >
        3D: BlackHoleLayer (ray-traced Schwarzschild, thin accretion disk, photon ring, lensed galaxy sky). Camera
        approaches from far, inclination easing 84° → 78°, azimuth orbit; accent glow on the photon ring only. On
        "black hole" a thin C.muted circle marks the event horizon with tag "no way out". On "LIGO" cut to 2.5D: two
        small black holes spiral in; a Wave2D ripple field (C.einstein diverging map) spreads; a strain trace (the
        chirp, computed from a simple inspiral formula) draws along the bottom. On "atom" the camera dives toward a
        single bright point in the ripples, which becomes a tiny atom.
      reveal_sequence:
        - {at_word: Squeeze, action: 'black hole fades up, far'}
        - {at_word: light, action: 'camera nears; light rays bend round (ring brightens, glow)'}
        - {at_word: black hole, action: horizon circle + tag}
        - {at_word: LIGO, action: binary spiral; ripple field}
        - {at_word: merging, action: merger flash; chirp trace completes}
        - {at_word: proton's, action: tag 'less than 1/100 of a proton'}
        - {at_word: atom, action: dive toward a bright point that becomes an atom}
      equations: []
      camera: "3D orbit + approach (ray traced); 2.5D for the ripples; dive"
      layout: L1
      layers: [blackhole_layer, glow_ring, wave2d_field, chirp_manim, binary_points]
    engines: {primary: moderngl, secondary: [taichi, manim]}
    engine_reason: "The black hole is aion's ray-traced BlackHoleLayer; ripples are the Wave2D Taichi sim."
    retention_device: "signature shot (black hole orbit); scale contrast sets up the next chapter"
    interrupt: camera
    transition_out: "Bridge: the dive lands in an atom-sized world; a dark wall with two slits."
    sfx_music: "Deep low rumble near the hole; a chirp sound on the merger."

