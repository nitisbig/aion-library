  - id: c04_s02
    chapter: c04
    title: "Three pushes"
    arc_step: equation
    duration_s: 21.82
    duration_source: audio
    goal: "Each term of Navier–Stokes as a picture; then the vortex street emerges."
    narration: |
      Their equation adds up everything that pushes on a parcel. [pause 0.4s] The flow carries it along, pressure
      shoves it from high to low, and a kind of stickiness, called viscosity, drags it toward the speed of its
      neighbours. [pause 0.6s] Let water run past an obstacle, and the equation produces swirls that peel away from
      one side and then the other.
    pause_after_s: 0.8
    visual:
      description: >
        L2. Right column: ρ(∂u/∂t + u·∇u) = −∇p + μ∇²u + f, and ∇·u = 0 under it. Stage: a small arrow grid around the
        parcel. "u·∇u" lights with a carried-along streak (tag "carried"); "−∇p" lights with a pressure colour field
        (C.data-like high, dark low) and arrows from high to low (tag "pressure"); "μ∇²u" lights with neighbours'
        arrows averaging (tag "sticky"). On "obstacle" the stage becomes the Taichi vortex street behind a cylinder
        (dye in C.dye, vorticity in a diverging map), camera drifts along the wake.
      reveal_sequence:
        - {at_word: adds up, action: equation writes; arrow grid around the parcel}
        - {at_word: carries, action: u·∇u lights; carried streak}
        - {at_word: pressure, action: −∇p lights; pressure field + arrows}
        - {at_word: viscosity, action: μ∇²u lights; neighbour averaging}
        - {at_word: obstacle, action: vortex street sim fills the stage}
        - {at_word: other, action: camera drifts along the wake; hold}
      equations: ['\rho\Big(\frac{\partial\mathbf u}{\partial t}+\mathbf u\cdot\nabla\mathbf u\Big)=-\nabla p+\mu\nabla^2\mathbf u+\mathbf f', '\nabla\cdot\mathbf u=0']
      camera: "2D for the terms; 2.5D drift along the wake (pan 3 u, slight rotate)"
      layout: L2
      layers: [bg_solid, arrow_grid_manim, pressure_field, equation_column, taichi_vortex_street]
    engines: {primary: taichi, secondary: [manim, moderngl]}
    engine_reason: "The vortex street is a baked Taichi fluid; term pictures are Manim arrows over a FieldLayer."
    retention_device: "each term = one picture; signature shot (vortex street)"
    interrupt: equation
    transition_out: "The wake widens into a weather map seen from orbit."
    sfx_music: "Air rushing softly."

