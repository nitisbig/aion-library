# ======================================================================== C06 TIME DILATION
  - id: c06_s01
    chapter: c06
    title: "Light clock"
    arc_step: hook
    duration_s: 27.44
    duration_source: audio
    goal: "Human example (a clock on a train) that derives the slowdown from a triangle."
    narration: |
      Imagine a clock made of light, a pulse bouncing between two mirrors, where each bounce counts as one tick.
      [pause 0.5s] Put that clock on a fast train, and someone on the platform sees the light trace a longer,
      slanted path. [pause 0.4s] In nineteen oh five, Einstein took the speed of light to be the same for every
      observer, and a longer path at the same speed takes more time. [pause 0.4s] So the moving clock ticks more
      slowly.
    pause_after_s: 0.8
    visual:
      description: >
        L3, one open stage (frame 08). Left "at rest": two mirrors (C.frame), a photon (C.light, glow) bouncing
        vertically. Right "moving": the same clock on a train outline moving right; the photon traces a zig-zag (C.dilation). On "speed
        of light" both photons get the same speed tag "c". On "longer" one zig is pulled out into a right triangle:
        legs c·Δt (vertical), v·Δt′ (horizontal), hypotenuse c·Δt′. Tick counts under each clock diverge.
      reveal_sequence:
        - {at_word: light, action: rest clock draws; photon bounces}
        - {at_word: tick, action: tick counter starts}
        - {at_word: train, action: moving clock on a train}
        - {at_word: slanted, action: zig-zag trail}
        - {at_word: Einstein, action: 'name tag: Albert Einstein · 1905; both photons tagged c'}
        - {at_word: longer path, action: one zig becomes a right triangle}
        - {at_word: slowly, action: tick counters diverge}
      equations: []
      camera: "2D, one stage"
      layout: L3
      layers: [bg_solid, clocks_manim, photon_glow, triangle, name_tag]
    engines: {primary: manim, secondary: [moderngl]}
    engine_reason: "Exact geometry and counters in Manim; photon glow as an fx layer."
    retention_device: "human example; pays loop L2"
    interrupt: visual
    transition_out: "The triangle slides into the right column; the train fades."
    sfx_music: "A tick per bounce; the moving clock's ticks fall behind."

  - id: c06_s02
    chapter: c06
    title: "Gamma"
    arc_step: equation
    duration_s: 21.23
    duration_source: audio
    goal: "The triangle gives the formula; the gamma curve; muons as real evidence."
    narration: |
      The triangle gives the exact amount. [pause 0.4s] At everyday speeds the effect is far too small to notice,
      but close to the speed of light it grows without limit. [pause 0.6s] Muons, particles created high in the
      atmosphere, should decay long before they reach the ground, and they only make it because their clocks run
      slow.
    pause_after_s: 0.8
    visual:
      description: >
        L2. Right column: Pythagoras on the triangle (c Δt′)² = (c Δt)² + (v Δt′)² transforms (TransformMatchingTex) into
        Δt′ = Δt / √(1 − v²/c²) with the denominator tagged "how much slower". Stage: γ against v/c, flat at 1 then a
        wall at 1 (C.dilation, glow on the wall). Dots on the curve: car, jet, ISS (computed, all at ≈ 1), then 0.9c,
        0.99c. On "muons" 2.5D: a column of atmosphere; muons (C.dilation points) start at 15 km; a ghost path ends at
        0.66 km "without", the real ones reach the ground "with" (γ ≈ 10 at 0.995c, computed).
      reveal_sequence:
        - {at_word: triangle, action: Pythagoras → formula}
        - {at_word: everyday, action: γ curve draws; everyday dots at 1}
        - {at_word: without limit, action: curve rises to the wall; glow}
        - {at_word: Muons, action: atmosphere column; muons fall}
        - {at_word: decay, action: ghost path stops at 0.66 km}
        - {at_word: make it, action: real muons reach the ground}
      equations: ['(c\,\Delta t'')^2=(c\,\Delta t)^2+(v\,\Delta t'')^2', '\Delta t''=\frac{\Delta t}{\sqrt{1-v^2/c^2}}']
      camera: "2D equation + curve; 2.5D tilt into the atmosphere column"
      layout: L2
      layers: [bg_solid, equation_column, gamma_axes_manim, muon_points]
    engines: {primary: manim, secondary: [moderngl]}
    engine_reason: "Algebra morph and the curve are Manim; muon swarm as a PointsLayer."
    retention_device: "derivation in one move; real evidence"
    interrupt: equation
    transition_out: "Camera rises out of the atmosphere to see the whole Earth with satellites."
    sfx_music: "Quiet; a soft rush as the muons fall."

  - id: c06_s03
    chapter: c06
    title: "GPS"
    arc_step: payoff
    duration_s: 32.43
    duration_source: audio
    goal: "GPS needs both relativity corrections (links back to chapter two); bridge to learning."
    narration: |
      GPS depends on this. [pause 0.4s] The satellites move fast, so their clocks lose about seven millionths of a
      second a day. [pause 0.4s] But they also sit higher in Earth's gravity, where Einstein's field equations say
      time runs faster, by about forty five millionths. [pause 0.6s] Without correcting for both, a GPS position
      would drift by more than ten kilometres every day. [pause 0.8s] The phones that rely on those satellites also
      predict the next word you will type, a skill learned by walking downhill.
    pause_after_s: 2.0
    visual:
      description: >
        3D: a lit Earth (pyvista sphere, simple land/sea texture from a public-domain map or a stylised graticule,
        terminator lighting) with six GPS orbital planes (C.dilation thin rings) and satellites. Camera orbits. A tally
        floats in the right column: "speed −7.2 μs/day" (C.dilation), "gravity +45.7 μs/day" (C.einstein: the chapter-two hue returns),
        "net +38.5" glows. On "drift" a map pin on a street map slides away and a 11.5 km ruler grows. On "where you
        are" the pin returns; on "next word" a phone keyboard suggestion bar appears; on "downhill" the street map's
        contour lines rise into a 3D landscape.
      reveal_sequence:
        - {at_word: GPS, action: Earth and orbits; camera orbit}
        - {at_word: seven, action: speed tally −7.2}
        - {at_word: gravity, action: gravity tally +45.7 in the Einstein hue}
        - {at_word: forty five, action: net +38.5 glows}
        - {at_word: drift, action: pin slides; ruler grows to 11.5 km}
        - {at_word: next word, action: pin snaps back; keyboard suggestion bar}
        - {at_word: downhill, action: map contours rise into a 3D landscape}
      equations: ['-7.2 + 45.7 = +38.5\ \mu\mathrm{s}/\mathrm{day}']
      camera: "3D Earth orbit; 2.5D map; 3D rise"
      layout: L2
      layers: [pyvista_earth_orbits, tally_column_manim, map_skia, landscape_transition]
    engines: {primary: pyvista, secondary: [manim, skia-python]}
    engine_reason: "Lit sphere with orbits is a pyvista render; tallies and labels in Manim."
    retention_device: "callback to chapter two; everyday stakes (your location)"
    interrupt: camera
    transition_out: "Bridge: the map's contours become a foggy 3D hill."
    sfx_music: "A soft satellite ping."

# ======================================================================== C07 GRADIENT DESCENT
  - id: c07_s01
    chapter: c07
    title: "Foggy hill"
    arc_step: hook
    duration_s: 22.08
    duration_source: audio
    goal: "Human example (walking down a hill in fog); the update rule in words."
    narration: |
      Suppose you are standing on a hillside in thick fog, trying to reach the valley. [pause 0.4s] You can't see
      the bottom, but you can feel which way the ground slopes under your feet, so you take a small step downhill,
      and then feel again. [pause 0.6s] That is gradient descent, and Augustin-Louis Cauchy described it in eighteen
      forty seven.
    pause_after_s: 0.8
    visual:
      description: >
        3D: a smooth loss surface (two valleys, computed) in Manim Surface with C.descent shading by height; fog = a
        radial alpha mask around a small walker (glowing dot) so only nearby ground shows. On "slopes" a gradient
        arrow (C.descent) appears at the walker's feet, pointing uphill; a second arrow flips to point downhill. Steps
        trace a path (exact iterates of θ ← θ − η∇L). On "gradient descent" the fog lifts to reveal the valley; the
        right column shows θ ← θ − η∇L(θ) with tags "position", "step size", "slope". Name tag: Augustin-Louis Cauchy · 1847.
      reveal_sequence:
        - {at_word: fog, action: foggy surface; walker}
        - {at_word: slopes, action: 'gradient arrow, then the downhill arrow'}
        - {at_word: step, action: steps trace a path}
        - {at_word: gradient descent, action: fog lifts; equation writes with tags}
        - {at_word: Cauchy, action: name tag}
      equations: ['\theta \leftarrow \theta - \eta\,\nabla L(\theta)']
      camera: "3D: low over the walker's shoulder, then crane up as the fog lifts"
      layout: L2
      layers: [manim3d_surface, fog_mask_shader, walker_glow, path, equation_column]
    engines: {primary: manim, secondary: [moderngl]}
    engine_reason: "Surface, path and arrows are Manim ThreeD; the fog is a radial matte layer."
    retention_device: "human example"
    interrupt: camera
    transition_out: "The surface flattens into a 1D valley on the left; a scatter plot fades in on the right of the same stage."
    sfx_music: "Footsteps on soft ground; the fog lifting as a breath."

  - id: c07_s02
    chapter: c07
    title: "Step size"
    arc_step: equation
    duration_s: 22.75
    duration_source: audio
    goal: "Step size matters; the hill is the computer's error; a line learns."
    narration: |
      The size of each step matters. [pause 0.3s] Too small, and progress is painfully slow, and too large, and you
      leap right past the valley. [pause 0.6s] For a computer, the hill is its own error. [pause 0.4s] Take a line
      that should fit some points, and every step downhill turns and shifts it a little, until the error is as small
      as it can be.
    pause_after_s: 0.8
    visual:
      description: >
        L3, one open stage. Left: a 1D parabola valley with three balls (C.descent tints: dim, mid, bright) running the same
        rule with η = 0.05, 0.4, 1.05 (computed iterates): crawl, settle, bounce out. Right: scatter points (C.data
        seeded) with a line (C.descent) starting flat; beneath, the error landscape over (slope, intercept) as a
        contour map with a path; each step updates the line and drops the error bar.
      reveal_sequence:
        - {at_word: size, action: three balls appear}
        - {at_word: slow, action: small-step ball inches}
        - {at_word: leap, action: large-step ball overshoots and diverges}
        - {at_word: error, action: 'right: scatter + flat line + contour map'}
        - {at_word: fit, action: path starts on the contour map}
        - {at_word: as small, action: line settles; error bar low; glow on the fitted line}
      equations: ['L(m,b)=\frac1n\sum_i (y_i - m x_i - b)^2']
      camera: "2D, one stage"
      layout: L3
      layers: [bg_solid, balls_manim, scatter_line_manim, contour_field]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Exact iterates and contour maps from numpy, drawn in Manim."
    retention_device: "three-way comparison; a model learning in front of you"
    interrupt: visual
    transition_out: "The contour map lifts into a huge 3D landscape."
    sfx_music: "A boing for the overshoot."

