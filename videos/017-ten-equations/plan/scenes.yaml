# ======================================================================== C09 BAYES
  - id: c09_s01
    chapter: c09
    title: "The test"
    arc_step: hook
    duration_s: 31.75
    duration_source: audio
    goal: "Human example (a medical test) that shows base rates with 1,000 dots."
    narration: |
      Suppose a disease affects one person in a hundred, and a test catches nine in ten cases, but also flags nine
      in a hundred healthy people. [pause 0.6s] If you test positive, how worried should you be? [pause 0.8s] Think
      of a thousand people. [pause 0.3s] Ten of them are ill, and nine of those test positive. [pause 0.4s] Of the
      nine hundred and ninety who are healthy, about eighty nine test positive as well. [pause 0.6s] So among all
      the positives, only about one in eleven is really ill.
    pause_after_s: 0.8
    visual:
      description: >
        2D: a 40 x 25 grid of 1,000 dots (C.muted). On "one person in a hundred" 10 dots turn C.bad. On "You test
        positive" a single dot with a + badge. On "thousand people" the grid re-forms. Ten ill dots gather left; nine
        get a + ring (C.bayes). The 990 healthy gather right; 89 get a + ring (seeded choice). On "among everyone" all
        98 + dots fly together into one block: 9 ill among 98, tag "≈ 9 %", "1 in 11". Held.
      reveal_sequence:
        - {at_word: one person in a hundred, action: 10 dots turn red}
        - {at_word: nine in ten, action: test icon; 9 of 10 marked}
        - {at_word: flags, action: 89 healthy get + rings}
        - {at_word: positive, action: your dot with a + badge}
        - {at_word: thousand, action: 'grid re-forms, all neutral'}
        - {at_word: Ten of them, action: ill group left}
        - {at_word: nine of those, action: 9 ill get + rings}
        - {at_word: eighty nine, action: healthy group right; 89 + rings}
        - {at_word: among, action: the 98 positives gather into one block}
        - {at_word: one in eleven, action: 98 positives gather; 9 of them ill; tag 9 %}
      equations: ['\frac{9}{9+89}\approx 9\%']
      camera: "2D, gentle 2.5D push on the final block"
      layout: L1
      layers: [bg_solid, dots_points, labels_manim]
    engines: {primary: moderngl, secondary: [manim]}
    engine_reason: "1,000 dots fly as GPU points (pure function of t); counts and tags in Manim."
    retention_device: "human example with a surprising answer"
    interrupt: question
    transition_out: "The dot blocks reshape into a square split into areas."
    sfx_music: "Soft pops as dots get + rings."

  - id: c09_s02
    chapter: c09
    title: "The rule"
    arc_step: equation
    duration_s: 22.71
    duration_source: audio
    goal: "Bayes' rule read from the area picture, with a line of history."
    narration: |
      Thomas Bayes, an English minister, worked out how to reason this way, and his essay was published after his
      death, in seventeen sixty three. [pause 0.5s] His rule tells you how to update a belief. [pause 0.3s] You
      start with how likely something was before, weigh it by how well it explains the new evidence, and then
      compare that against every way the evidence could have come about.
    pause_after_s: 0.8
    visual:
      description: >
        L2. Stage: a unit square split vertically by the prior (ill 1 % strip, widened ×8 and tagged "not to scale"),
        each column split horizontally by test result; positive areas lit C.bayes. Right column: P(A|B) = P(B|A)P(A)/P(B).
        "P(A)" lights with the ill strip (tag "before", C.prior); "P(B|A)" with its positive part (tag "explains");
        "P(B)" with both positive areas together (tag "all positives"); "P(A|B)" lights in C.posterior (tag
        "after"). Name tag: Thomas Bayes · 1763 (names only, no portrait).
      reveal_sequence:
        - {at_word: Bayes, action: name tag; area square draws}
        - {at_word: update, action: equation writes}
        - {at_word: before, action: P(A) lights with the prior strip}
        - {at_word: explains, action: P(B|A) lights}
        - {at_word: every way, action: P(B) lights with both positive areas; P(A|B) lights}
      equations: ['P(A\mid B)=\frac{P(B\mid A)\,P(A)}{P(B)}']
      camera: "2D"
      layout: L2
      layers: [bg_solid, area_square_manim, equation_column]
    engines: {primary: manim, secondary: []}
    engine_reason: "Area diagrams and term matching are Manim."
    retention_device: "the dots become the formula (continuity)"
    interrupt: equation
    transition_out: "The posterior area lifts into a curve that will sharpen."
    sfx_music: "Quiet."

  - id: c09_s03
    chapter: c09
    title: "Updating"
    arc_step: payoff
    duration_s: 22.67
    duration_source: audio
    goal: "Belief sharpening with evidence; uses (spam, cars, Air France 447); bridge to markets."
    narration: |
      Each new clue sharpens the belief a little further. [pause 0.5s] Spam filters work this way, and so do
      self-driving cars. [pause 0.4s] In twenty eleven, searchers used it to locate the wreck of Air France flight
      four four seven, within a week of starting a new search. [pause 0.8s] And few things are as uncertain as the
      future price of a share.
    pause_after_s: 2.0
    visual:
      description: >
        3D ribbon: a belief curve (Beta distribution, computed) starts flat (C.prior) and, clue by clue, a new curve
        is added one step deeper in z, each sharper, ending in a tall narrow peak (C.posterior, glow). Camera orbits
        the ribbon. On "Spam" and "cars" two tiny icons slide in. On "Air France" 2.5D: an ocean search grid
        (FieldLayer heat map, C.bayes) where searched cells darken and the probability flows to the unsearched
        cells; the wreck marker appears in the brightest cell. On "price" the narrow peak widens and slides into a
        price chart axis.
      reveal_sequence:
        - {at_word: clue, action: 'ribbon curves step in depth, sharpening'}
        - {at_word: Spam, action: spam icon}
        - {at_word: self-driving, action: car icon}
        - {at_word: Air France, action: search heat map; searched cells dim}
        - {at_word: week, action: wreck marker in the brightest cell}
        - {at_word: uncertain, action: peak widens}
        - {at_word: price, action: curve slides onto a price axis}
      equations: []
      camera: "3D orbit on the ribbon; 2.5D top-down on the map"
      layout: L1
      layers: [manim3d_ribbon, icons_skia, search_field, price_axis]
    engines: {primary: manim, secondary: [moderngl, numpy]}
    engine_reason: "The curve ribbon is Manim ThreeD; the search map is a FieldLayer."
    retention_device: "a real rescue story; bridge"
    interrupt: camera
    transition_out: "Bridge: the belief curve becomes the starting point of many price paths."
    sfx_music: "Sonar ping on the wreck."

# ======================================================================== C10 BLACK-SCHOLES
  - id: c10_s01
    chapter: c10
    title: "A promise"
    arc_step: hook
    duration_s: 23.57
    duration_source: audio
    goal: "Human example: the right to buy later; the payoff; why pricing it is hard."
    narration: |
      Suppose you buy the right, but not the obligation, to buy a share for one hundred dollars a year from now.
      [pause 0.5s] If the price climbs to one fifty, that right is worth fifty, and if it falls, you simply walk
      away. [pause 0.6s] A contract like this is called an option, and the question is what it should cost today,
      when nobody knows where the price will go.
    pause_after_s: 0.8
    visual:
      description: >
        2D: payoff axes (price at expiry vs value). A price slider (C.path) moves; at 150 the value bar shows 50; below
        100 the bar is 0. The hockey-stick payoff max(S − 100, 0) traces (C.payoff). On "today" the slider resets and
        many faint price paths (geometric Brownian motion, seeded) start from today's price toward the payoff axis.
      reveal_sequence:
        - {at_word: right, action: a paper-ticket outline 'right to buy at 100'}
        - {at_word: one fifty, action: slider to 150; value 50}
        - {at_word: falls, action: slider below 100; value 0}
        - {at_word: option, action: hockey stick traces; tag 'option'}
        - {at_word: today, action: paths start fanning toward expiry}
      equations: ['\max(S-K,\,0)']
      camera: "2D"
      layout: L1
      layers: [bg_solid, payoff_axes_manim, slider, paths_preview]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Axes, slider and payoff are exact Manim graphics."
    retention_device: "human example; a priced question"
    interrupt: question
    transition_out: "Paths multiply into thousands."
    sfx_music: "A soft cash-register-free click (no money sounds)."

  - id: c10_s02
    chapter: c10
    title: "Cancel the randomness"
    arc_step: equation
    duration_s: 28.86
    duration_source: audio
    goal: "Random walk, hedging, the PDE; it becomes the heat equation from the opening (pays loop L4)."
    narration: |
      In nineteen seventy three, Fischer Black, Myron Scholes and Robert Merton found an answer. [pause 0.4s] They
      treated the price as a random walk, and then built a mix of the share and cash that moves exactly like the
      option, so that the randomness cancels out. [pause 0.6s] What remains is an equation for the option's value as
      time runs out. [pause 0.4s] With a change of variables, it becomes the heat equation, the very one Fourier
      wrote for his bar of hot metal.
    pause_after_s: 0.8
    visual:
      description: >
        L2. Stage: 2,000 GBM paths (seeded, σ 20 %, r 3 %) fan out from 100 (C.path, thin, additive); at expiry a
        histogram builds into a log-normal bell. On "mix" two arrows (share, cash) combine into a hedge line that
        tracks the option; the wiggle on both cancels (a jitter trace flattens). Floating above the paths: the PDE with terms tagged
        "time", "wobble", "drift", "interest". On "heat equation" the PDE morphs into ∂u/∂τ = ∂²u/∂x² and the stage
        becomes a Heat2D bar (aion Heat2D, C.bs → white) spreading warmth; the Fourier hue rules the heat term briefly
        (callback).
      reveal_sequence:
        - {at_word: Black, action: 'name tag: Black · Scholes · Merton · 1973 (names only)'}
        - {at_word: random walk, action: '2,000 paths fan; bell builds'}
        - {at_word: mix, action: hedge arrows; jitter cancels}
        - {at_word: equation, action: PDE writes with term tags}
        - {at_word: heat equation, action: PDE morphs into the heat equation}
        - {at_word: bar of hot metal, action: the opening's glowing bar returns under the equation (Heat2D)}
      equations: ['\frac{\partial V}{\partial t}+\tfrac12\sigma^2S^2\frac{\partial^2V}{\partial S^2}+rS\frac{\partial V}{\partial S}-rV=0', '\frac{\partial u}{\partial \tau}=\frac{\partial^2 u}{\partial x^2}']
      camera: "2D; 2.5D push into the heat bar"
      layout: L2
      layers: [bg_solid, gbm_paths, histogram, equation_float, heat2d_field]
    engines: {primary: moderngl, secondary: [numpy, taichi, manim]}
    engine_reason: "Thousands of paths as GPU line/point layers; heat via aion's Taichi Heat2D."
    retention_device: "callback to the opening: Fourier's heat equation (pays loop L4)"
    interrupt: equation
    transition_out: "The heat bar rises into a 3D value surface."
    sfx_music: "A soft rising texture; warmth."

  - id: c10_s03
    chapter: c10
    title: "A map, not the world"
    arc_step: payoff
    duration_s: 21.87
    duration_source: audio
    goal: "Its impact (a global market, a Nobel), its limits (crashes jump); the closing moral."
    narration: |
      It helped build a huge global market, and it won Scholes and Merton a Nobel Prize in nineteen ninety seven.
      [pause 0.6s] But it assumes that prices wander calmly, and in real crashes they jump, which cost the traders
      who forgot it a great deal. [pause 0.6s] An equation is a map of the world, not the world itself.
    pause_after_s: 2.0
    visual:
      description: >
        3D: the call value surface V(S, t) from the closed form (computed, C.bs shading, grid lines), camera orbiting;
        it bends into the hockey stick at expiry. On "Nobel" tag "Nobel · 1997" in small caps. On "calmly" a smooth
        path rides the surface; on "jump" a sudden gap (a jump path, C.bad) leaves the surface and the surface
        flickers. On "map" the surface flattens into a map-like contour plot that pulls back toward a tiny tile T10 on
        the wall, as the other nine tiles slide in from the dark.
      reveal_sequence:
        - {at_word: market, action: value surface; camera orbit}
        - {at_word: Nobel, action: Nobel tag}
        - {at_word: calmly, action: a smooth path rides the surface}
        - {at_word: jump, action: jump path breaks away; flicker}
        - {at_word: map, action: surface flattens to contours; pulls back into tile T10}
      equations: []
      camera: "3D orbit, then a long 2.5D pull-back onto the wall"
      layout: L1
      layers: [pyvista_value_surface, paths, contour_map, wall_return]
    engines: {primary: pyvista, secondary: [manim, moderngl]}
    engine_reason: "A shaded 3D surface; the pull-back composites the ten tile precomps."
    retention_device: "honest caution; sets up the outro"
    interrupt: camera
    transition_out: "The camera keeps pulling back as the ten tiles lift into 3D."
    sfx_music: "A short low hit on the jump; calm after."

# ======================================================================== OUTRO
  - id: out_s01
    chapter: outro
    title: "One web"
    arc_step: recap
    duration_s: 30.79
    duration_source: audio
    goal: "Pay loop L1: the chain of bridges, light to markets, as a 3D web of the ten tiles."
    narration: |
      Looking back, each equation handed something to the next. [pause 0.4s] Light led us to gravity, and gravity
      down to the atom. [pause 0.3s] Waves led to water, water to frequencies, and frequencies to clocks.
      [pause 0.3s] Clocks led to learning machines, learning to noisy wires, noise to evidence, and evidence to
      markets. [pause 0.8s] Ten equations, written over more than two hundred years, mostly by people who simply
      wanted to understand one thing.
    pause_after_s: 0.8
    visual:
      description: >
        3D: the ten live tiles float as cards in a loose helix around the centre, each still running its simulation.
        As the narration names each link, a lit arc (glow, in the destination tile's hue) draws from one card to the
        next: T1→T2→…→T10. The camera orbits slowly, then rises to see the whole chain. On "Ten equations" each
        card's equation fades in beneath it and each name appears in small caps under its hue rule; "Ten equations ·
        1763 – 1973" settles in the still centre of the ring (frame 13). The progress rail fades out.
      reveal_sequence:
        - {at_word: handed, action: ten cards lift into a 3D helix}
        - {at_word: gravity, action: arc T1 → T2}
        - {at_word: atom, action: arc T2 → T3}
        - {at_word: water, action: arc T3 → T4}
        - {at_word: frequencies, action: arc T4 → T5}
        - {at_word: clocks, action: arc T5 → T6}
        - {at_word: learning, action: arc T6 → T7}
        - {at_word: noisy wires, action: arc T7 → T8}
        - {at_word: evidence, action: arc T8 → T9}
        - {at_word: markets, action: arc T9 → T10; camera rises}
        - {at_word: Ten equations, action: equations and names appear; the closing line settles in the centre}
      equations: ['all ten']
      camera: "3D: slow orbit, then crane up over the helix"
      layout: L4
      layers: [tile_cards_3d, arcs_glow, equations_manim, name_labels, centre_line]
    engines: {primary: moderngl, secondary: [manim]}
    engine_reason: "Ten precomps as textured cards with camera projection; arcs and text in Manim."
    retention_device: "pays loop L1; recap as one picture"
    interrupt: camera
    transition_out: "Camera settles on a front view of the web; the arcs dim."
    sfx_music: "The ten tile tones from the intro, in order."

