# plan/scenes.yaml: the source of truth for video 018 (What Logarithms Actually Are).
#
# Edit narration and visuals here, then regenerate everything that derives from it:
#   uv run python videos/018-logarithms/scripts/build_script.py
# That rewrites voiceover.md, script/narration_full.md, plan/scene_plan.md, storyboard.md and fills duration_s
# (estimate). After voicing, scripts/timing.py replaces duration_s with the real value (duration_source: audio).
#
# Narration marks: [pause 0.8s] = extra silence inserted after the audio is generated (free to change);
# *word* = emphasis (a note for the read; stripped before TTS). Numbers are written as spoken.
# The narration never reads symbols aloud: each equation is said as a plain sentence while its terms light.
# reveal_sequence[].at_word must appear in the scene's narration, in order (checked by build_script.py).
# Every spoken or plotted figure is computed and asserted in logdata.py (verify()).
# Colours are theme roles (C.<role>), one per math object for the whole video:
#   base (the multiplier, amber) · steps (the count / the logarithm, cyan) · value (the result, magenta)
#   natural (e and ln, green) · area (the region under 1/x, teal) · ruler (engraved scales, ivory) · paper (Napier's page)
#   cell · sound · star · quake · acid · planet (in-chapter roles); one hue per chapter for the progress rail.
# Layouts: L1 full-bleed stage, L2 staircase + open column, L3 graph plane, L4 ruler band. No boards, boxes, panels
# or n/N counters; text never glows; the progress rail sits bottom-left. See design/design_sheet.md.
# Camera: 2D flat · 2.5D (s.camera push/pan/tilt + parallax depth layers) · 3D (Manim ThreeD, pyvista).

video:
  slug: 018-logarithms
  title: "What Logarithms Actually Are"
  alt_titles:
    - "Logarithms Aren't What You Were Taught"
    - "Logarithms, Finally Visualized"
  mode: tutorial and concept overview (build the idea from counting, derive every rule from one picture)
  audience: anyone curious; no maths assumed beyond multiplication
  target_runtime_s: {min: 600, goal: 720, max: 780}
  master_format: "1920x1080, 60 fps, SDR Rec.709 (4K on request)"
  spine: >-
    A logarithm counts multiplications. One motif carries the whole video: the multiplication staircase, where each
    step up multiplies by the base and the height counts the steps. Each chapter turns that staircase a new way:
    counting (the cell that divides), Napier's trick (climbs add, so products become sums), the slide rule (the
    staircase laid flat as a ruler), the curve (the exponential seen in a mirror), the area under 1/x (why the
    natural base is e), and the scales of the world (sound, starlight, earthquakes, acidity, planets, atom to
    galaxy). The intro opens on Napier's 1614 tables and previews all six pictures; the outro rebuilds the staircase
    one last time and lights one lesson per step.

datasets:
  - name: staircase
    what: >-
      The motif, one Manim group built in kit.py: steps of width 0.9 u and height 0.5 u, each tread labelled with
      its value (C.value) and each riser with its step count (C.steps); the base shown as a small ×b on each riser
      (C.base). Supports base 2 and 10, fractional fill (log₂6 = 2.585), a smooth ramp limit, end-to-end stacking
      (product rule) and descending walks (quotient rule).
    used_in: [in_s02, in_s03, c01_s02, c01_s03, c02_s01, c02_s02, out_s01]
  - name: numbers
    what: >-
      logdata.py: 2^10 = 1024; log2 6 = 2.585; 8·32 = 2^(3+5) = 256; log10 2 = 0.301 (Gunter's 2 nearly a third
      of the way); 2·3 = 6 on the slide rule; log10 1e6 = 6, 1e9 = 9; change of base log2 x = log10 x / log10 2
      (factor 3.32); areas under 1/x: A(1,2) + A(1,3) = A(1,6) = 1.792; A(1,e) = 1 by brentq → 2.718281828;
      (1+1/n)^n for n = 1…10^6; dB: +10 dB = 10× power; Pogson 5 mag = 100× (2.512 per magnitude); quake +1 = 10^1.5
      = 31.6× energy; pH lemon 2 vs water 7 → 10^5; Kepler a (AU) and T (yr) for six planets, fitted slope 1.500;
      atom 1.06e-10 m to Milky Way 9.5e20 m → 31 powers of ten.
    used_in: [c01, c02, c03, c04, c05, c06]
  - name: sims
    what: >-
      Seeded, baked: cell division (Taichi soft-body discs that push apart after each split, seed 1801, 1024 cells,
      baked to PointsLayer); sound field from a point source (GLSL analytic wave, amplitude a pure function of t);
      seismic ripple on a terrain patch (pyvista off-screen, a decaying Rayleigh-like ring, 180 frames, seed 1806);
      Napier's page and Gunter's ruler textures (skia-python, procedural paper fibre noise from opensimplex, seed 1614).
    used_in: [in_s01, c01_s01, c03_s01, c03_s02, c06_s01, c06_s02]

layouts:
  - {id: L1, name: Full-bleed stage, use: "The picture owns the frame and runs to the edges (Napier's page, the dividing cells, the sound field, the atom-to-galaxy zoom). Text floats in open black space, on a feathered shade only where the raster behind is busy."}
  - {id: L2, name: Staircase + open column, use: "The staircase climbs from the lower left through the left two thirds; the equation floats in the open right column (x 2.75 to 6.40), its terms coloured by role (base amber, steps cyan, value magenta) and lit as the narration says them."}
  - {id: L3, name: Graph plane, use: "The Classic blue grid fills the frame with white axes; the curve owns the picture and the equation floats top-right inside the safe box. Used for the mirror, the slow climb, the bases and the hyperbola."}
  - {id: L4, name: Ruler band, use: "A long engraved ruler (or two) runs across the middle of the frame in slight 2.5D perspective; numbers sit on the ticks and one result reads out below in CM. Gunter, the slide rule, octaves and the shared scales of chapter 6."}

boards:
  - {name: "The multiplication staircase · the motif, kit.staircase()", pinned_in: c01_s02, recalled_in: [in_s02, in_s03, c01_s03, c02_s01, c02_s02, c03_s01, out_s01], wiped_at: "never for long; it returns as the ruler (laid flat), the curve (smoothed) and the outro"}
  - {name: "Progress rail · bottom-left, six segments sized by chapter length, chapter title in small caps above, head moves with audio time", pinned_in: in_s03 (draws in on 'how many times'), recalled_in: [all chapters], wiped_at: out_s01}
  - {name: "Name tag · top-left hue rule over small caps 'Name · year', first appearance only", pinned_in: each person's first mention, recalled_in: [], wiped_at: "fades after ~4 s"}

chapters:
  - id: intro
    title: Intro
    target_s: 80
  - id: c01
    title: "Counting Multiplications"
    target_s: 90
    lens: "A logarithm answers: how many times did we multiply?"
    takeaway: "log_b y is the number of ×b steps from 1 to y; fractional steps fill in every positive number."
    concepts:
      - {concept: repeated doubling, graphic: "one cell dividing into 1024", equation: '2^{10}=1024', animation: "Taichi division bake, step tags"}
      - {concept: the logarithm as a count, graphic: "the multiplication staircase", equation: '2^{10}=1024\iff\log_2 1024=10', animation: "steps climb, the equation turns around"}
      - {concept: base and fractional steps, graphic: "base-10 staircase; 6 between the steps; the ramp", equation: '\log_2 6\approx 2.585', animation: "re-skin to base 10, a partial step fills, steps smooth into a curve"}
  - id: c02
    title: "Multiplication Becomes Addition"
    target_s: 100
    lens: "Climbs add, so products become sums."
    takeaway: "log(ab) = log a + log b; the quotient and power rules are the same picture; the power rule counts the digits of 2^100."
    concepts:
      - {concept: Napier's trick, graphic: "a row of powers of two over a row of step counts", equation: '8\cdot 32=2^3\cdot 2^5=2^{3+5}=256', animation: "lookup arrows, 3 + 5, read across"}
      - {concept: the rules, graphic: "two staircases stacked end to end; a walk down; a climb repeated", equation: '\log(ab)=\log a+\log b', animation: "stack, descend, repeat"}
      - {concept: using the rules, graphic: "a row of a hundred 2s folding into 100·log 2; a 10^30…10^31 ruler", equation: '\log_{10}2^{100}=100\log_{10}2\approx30.1', animation: "row folds, marker lands, 31 digits type out"}
  - id: c03
    title: "The Slide Rule"
    target_s: 90
    lens: "Lay the staircase flat and it becomes a ruler that multiplies."
    takeaway: "On a log scale, distance is the logarithm, so adding lengths multiplies numbers and equal ratios take equal steps."
    concepts:
      - {concept: the log scale, graphic: "Gunter's ruler engraved tick by tick", equation: 'x=\log_{10} n', animation: "each tick drops to its log distance"}
      - {concept: the slide rule, graphic: "two scales sliding", equation: '\log 2+\log 3=\log 6', animation: "slide, read off 6"}
      - {concept: equal ratios, graphic: "decades and piano octaves on one ruler", equation: null, animation: "equal brackets over 1→10→100→1000; keys light per octave"}
  - id: c04
    title: "The Curve"
    target_s: 95
    lens: "The logarithm is the exponential seen in a mirror."
    takeaway: "y = log_b x reflects y = bˣ across y = x; it climbs forever but slowly; all bases are scaled copies."
    concepts:
      - {concept: inverse function, graphic: "2ˣ reflected across the diagonal", equation: 'y=2^x\ \leftrightarrow\ y=\log_2 x', animation: "points swap coordinates with light trails"}
      - {concept: slow growth, graphic: "the x-axis zooms out to a billion", equation: '\log_{10}10^9=9', animation: "camera zoom, the curve barely rises"}
      - {concept: change of base and solving, graphic: "log₂, log₁₀, ln as stretched copies; 2ˣ = 10 on the graph", equation: '2^x=10\Rightarrow x=1/\log_{10}2\approx3.32', animation: "a slider stretches one curve into another; a drop line finds x"}
  - id: c05
    title: "Why e"
    target_s: 120
    lens: "Area under 1/x is a logarithm, and its natural base is e."
    takeaway: "ln x is the area under 1/t from 1 to x; the area reaches 1 at x = e; the slope of ln x is 1/x."
    concepts:
      - {concept: area under the hyperbola, graphic: "teal region under 1/x from 1", equation: 'A(1,2)+A(1,3)=A(1,6)', animation: "areas fill and add"}
      - {concept: stretch invariance, graphic: "a region stretched ×3 sideways and squashed ×1/3", equation: 'A(1,2)=A(3,6)', animation: "strips stretch, height drops, area counter holds"}
      - {concept: e and ln, graphic: "edge slides until the area is 1", equation: '\ln x=\int_1^x\frac{dt}{t},\quad \ln e=1,\quad \frac{d}{dx}\ln x=\frac1x', animation: "edge slides, counter hits 1.000, tangent slope tracks 1/x"}
      - {concept: doubling time, graphic: "growth curve meeting the doubling line", equation: 't=\ln 2/r\approx0.693/0.07\approx9.9', animation: "crossing found, drops to the axis; rule of seventy"}
  - id: c06
    title: "A World in Logarithms"
    target_s: 100
    lens: "We sense and measure the world in ratios."
    takeaway: "Decibels, magnitudes, earthquakes and pH are log scales; power laws become straight lines; atom to galaxy fits one ruler."
    concepts:
      - {concept: perception, graphic: "a sound field getting louder, a decibel ruler in even steps; stars by magnitude", equation: 'L=10\log_{10}\frac{P}{P_0}', animation: "rings brighten ×10 per step"}
      - {concept: earth and water, graphic: "seismic ripple, a pH ruler", equation: '\mathrm{pH}=-\log_{10}[\mathrm{H^+}]', animation: "ripple grows ×31.6 per step, liquids slide onto the ruler"}
      - {concept: power laws, graphic: "Kepler's planets on linear then log-log axes; atom to galaxy", equation: 'T^2\propto a^3\Rightarrow \log T=\tfrac32\log a+c', animation: "axes re-scale, points fall onto a line, zoom across powers of ten"}
  - id: outro
    title: Outro
    target_s: 60

loops:
  - {id: L1, promise: "Why would anyone spend twenty years computing tables of numbers?", planted_in: [in_s01], paid_in: [c02_s01, c02_s03]}
  - {id: L2, promise: "Where does the odd number e come from?", planted_in: [c04_s03], paid_in: [c05_s03]}
  - {id: L3, promise: "Why do our ears hear on a logarithmic scale?", planted_in: [c03_s03], paid_in: [c06_s01]}
  - {id: L4, promise: "Napier's page: does his idea still do its work?", planted_in: [in_s01], paid_in: [out_s02]}

scenes:
# ======================================================================== INTRO
  - id: in_s01
    chapter: intro
    title: "Napier's tables"
    arc_step: hook
    duration_s: 22.98
    duration_source: audio
    goal: "One short line of history: tables that turned multiplication into addition. Then straight to the idea."
    narration: |
      In sixteen fourteen, John Napier published a book of tables that took him about twenty years to compute by
      hand. [pause 0.6s] They rested on one idea, and that idea let astronomers turn every long multiplication into
      an addition, which is far quicker and far harder to get wrong. [pause 0.6s] He called the numbers in those
      tables logarithms.
    pause_after_s: 0.8
    visual:
      description: >
        L1. Black, then a slow 2.5D push-in over an old printed page (skia-python: warm paper with opensimplex fibre
        noise, C.paper, feathered into black at its edges; columns of seven-figure numbers in CM old-style figures,
        never readable as body text). 1614 writes in small caps, then becomes the name tag "John Napier · 1614"
        beside his public-domain portrait (duotone, feathered). On "long multiplication" two nine-digit factors appear
        in CM and a long-multiplication grid unrolls beneath them. On "into an addition" the grid collapses: the two
        factors drop onto two short numbers (their logs, C.steps) that add with a single +, and the sum climbs back
        up into the product (C.value). Accent glow only on the + as it lands. On "logarithms" the word log writes in CM.
      reveal_sequence:
        - {at_word: "sixteen fourteen", action: "1614 writes on black; the page fades up in depth"}
        - {at_word: "John Napier", action: "portrait and name tag"}
        - {at_word: "twenty years", action: "the camera drifts across a three-page parallax stack"}
        - {at_word: "long multiplication", action: "two nine-digit factors; the multiplication grid unrolls"}
        - {at_word: "into an addition", action: "grid collapses into log + log; the sum climbs back into the product"}
        - {at_word: "logarithms", action: "log writes in CM"}
      equations: ['a\times b\ \longrightarrow\ \log a+\log b']
      camera: "2.5D: slow push-in over a three-page parallax stack, then flat for the equation"
      layout: L1
      layers: [bg_solid, napier_pages_skia, portrait_duotone, name_tag, long_mult_manim, glow_plus]
    engines: {primary: skia-python, secondary: [manim, moderngl]}
    engine_reason: "Printed pages and paper texture are skia rasters; numbers and the collapse are Manim; the 2.5D push is s.camera."
    retention_device: "a short story with a cost (twenty years) and a promise (multiplication becomes addition); plants L1 and L4"
    interrupt: visual
    transition_out: "The + stays lit while the page dissolves; the camera pulls back into the first preview picture."
    sfx_music: "Room tone, a quiet paper rustle on the page turns."

  - id: in_s02
    chapter: intro
    title: "Preview"
    arc_step: promise
    duration_s: 28.46
    duration_source: audio
    goal: "Preview the six pictures the video builds, as a quick, calm montage."
    narration: |
      That idea turned out to be much larger than a shortcut for astronomers. [pause 0.5s]
      It counts how many times you multiply, it turns a ruler into a calculator, and its graph is the mirror image
      of exponential growth. [pause 0.6s] It hides in the area under a simple curve, which is where the number e
      comes from, and it is the scale our ears use to hear the world. [pause 0.5s] It even lets us draw an atom and a
      galaxy on the same page.
    pause_after_s: 0.8
    visual:
      description: >
        A montage of precomps taken from the chapters (each a reused Comp, about 3 s, crossfaded through black on the
        cue words). (1) The staircase climbs from 1 to 1024 with its step counts lighting cyan (c01). (2) Two
        engraved rulers slide and a 6 lights under a 3 (c03). (3) The curve 2ˣ swings across the diagonal into log₂x
        (c04). (4) The teal area under 1/x fills until its counter reads 1, and e glows green (c05). (5) Concentric
        sound rings with a decibel ruler (c06). (6) The atom-to-galaxy zoom: a log ruler of powers of ten with an
        atom, a person, the Earth and a spiral galaxy sitting at equal steps. No text beyond each picture's own
        symbols; the logarithm sign log writes once at the start in CM and stays faint in the upper-left.
      reveal_sequence:
        - {at_word: "That idea", action: "log moves to the upper-left, faint"}
        - {at_word: "how many times", action: "preview 1: staircase climbs"}
        - {at_word: "ruler", action: "preview 2: rulers slide"}
        - {at_word: "mirror image", action: "preview 3: the curve reflects"}
        - {at_word: "area", action: "preview 4: area under 1/x fills"}
        - {at_word: "number e", action: "the counter hits 1 and e glows"}
        - {at_word: "ears", action: "preview 5: sound rings and decibel ruler"}
        - {at_word: "atom", action: "preview 6: atom-to-galaxy ruler"}
      equations: ['\log']
      camera: "each precomp keeps its own camera; cuts are crossfades through black"
      layout: L1
      layers: [bg_solid, precomp_staircase, precomp_ruler, precomp_mirror, precomp_area, precomp_sound, precomp_scales]
    engines: {primary: manim, secondary: [moderngl, skia-python, taichi]}
    engine_reason: "The montage reuses each chapter's own layers as precomps, so the preview is the real picture."
    retention_device: "curiosity montage: six pictures shown, none explained yet"
    interrupt: visual
    transition_out: "The last picture's ruler shrinks to a single short line in the centre."
    sfx_music: "A soft low pulse under each cut."

  - id: in_s03
    chapter: intro
    title: "One question"
    arc_step: promise
    duration_s: 20.72
    duration_source: audio
    goal: "Reframe logarithms from a calculator button to a count, and pose the one question of the video."
    narration: |
      You may have met logarithms as a button on a calculator, or as rules to memorize before an exam.
      [pause 0.5s] In this video we will build them step by step, work through examples together, and see where
      every rule comes from.
      [pause 0.6s] And we will start with a single question: how many times do you have to multiply?
    pause_after_s: 1.5
    visual:
      description: >
        A calculator key labelled log (thin CM sans line drawing, C.muted) sits alone; on "rules" three log rules
        flicker in around it in dim C.muted like half-remembered notes, then fall away. On "step by step" a single dot
        at 1 sits on the floor line and the first three steps of the staircase draw in (amber ×2 on each riser,
        magenta values 2, 4, 8, cyan counts 1, 2, 3). On "how many times" the staircase collapses into the single
        line log₂ 8 = 3, each part in its role colour, and the progress rail draws in bottom-left.
      reveal_sequence:
        - {at_word: "button", action: "the log key"}
        - {at_word: "rules", action: "dim rules flicker in and fall away"}
        - {at_word: "step by step", action: "a dot at 1; three steps draw in"}
        - {at_word: "how many times", action: "staircase collapses into log₂ 8 = 3; progress rail draws in"}
      equations: ['\log_2 8 = 3']
      camera: "2D"
      layout: L2
      layers: [bg_solid, log_key, dim_rules, staircase, title_equation, progress_rail]
    engines: {primary: manim}
    engine_reason: "Line art, the staircase and the equation are Manim."
    retention_device: "reframe (a button → a count) and one clear question to carry into chapter 1"
    interrupt: equation
    transition_out: "The 3 in log₂ 8 = 3 stays; everything else fades; chapter card."
    sfx_music: "Silence under the question, then a soft tone on the card."

# ======================================================================== C01 COUNTING
  - id: c01_s01
    chapter: c01
    title: "One cell"
    arc_step: hook
    duration_s: 30.40
    duration_source: audio
    goal: "A human-scale example of repeated doubling, then turn the question around."
    narration: |
      Take a single cell and let it divide. [pause 0.4s] After one division there are two cells, after another
      there are four, then eight, then sixteen. [pause 0.6s] Each division doubles the count, so after only ten divisions there are one thousand and twenty four cells. [pause 0.6s] Now turn
      the question around. [pause 0.3s] If a dish holds one thousand and twenty four cells, how many divisions made them? [pause 0.6s] The answer is ten, and that number is a logarithm.
    pause_after_s: 0.8
    visual:
      description: >
        L1. A Taichi soft-body bake (seed 1801): one translucent disc (C.cell, a thin bright membrane rim and a soft
        interior) divides by pinching into two, and daughters push each other apart on a dark dish. Divisions are
        synchronised to the words (the bake runs 10 generations; the layer's time is remapped so generation k lands
        on its beat). A small cyan tally of divisions (1, 2, 3 …) and a magenta count (2, 4, 8 …) float top-right.
        After "ten divisions" the colony of 1024 fills the frame (PointsLayer, instanced discs). On "turn the
        question around" time runs backwards: the colony recombines down to one cell while the cyan tally counts
        up to 10 in the open column. "10" stays, with the word log beside it in CM.
      reveal_sequence:
        - {at_word: "divide", action: "first division"}
        - {at_word: "two cells", action: "tally 1 · count 2"}
        - {at_word: "four", action: "tally 2 · count 4"}
        - {at_word: "eight", action: "tally 3 · count 8"}
        - {at_word: "sixteen", action: "tally 4 · count 16"}
        - {at_word: "ten divisions", action: "fast run to 1024; the dish fills the frame"}
        - {at_word: "turn", action: "time runs backwards; the colony recombines"}
        - {at_word: "how many divisions", action: "cyan tally counts 1 … 10"}
        - {at_word: "answer is ten", action: "10 lights"}
        - {at_word: "logarithm", action: "10 stays, with log beside it"}
      equations: ['2^{10}=1024']
      camera: "2.5D: slow pull-back as the colony grows, push back in as it recombines"
      layout: L1
      layers: [bg_solid, cell_points_taichi, tally_manim, count_manim]
    engines: {primary: taichi, secondary: [manim]}
    engine_reason: "Cell packing is a baked Taichi soft-body sim (deterministic); counters are Manim."
    retention_device: "human example (a dish of cells); turning the question around is the reveal"
    interrupt: visual
    transition_out: "The cells line up into a column of ten and become the first ten steps."
    sfx_music: "A soft tick on each division."

  - id: c01_s02
    chapter: c01
    title: "The staircase"
    arc_step: picture
    duration_s: 26.07
    duration_source: audio
    goal: "Introduce the motif and write the definition both ways."
    narration: |
      We can draw this as a staircase. [pause 0.4s] Each step up is one more multiplication by two, so the height of
      the staircase counts the steps. [pause 0.5s] Ten twos multiplied
      together give one thousand and twenty four, and we write that the logarithm, base two, of one thousand and
      twenty four is ten. [pause 0.6s] Both lines state the same fact, one read from the number of steps and the other from
      the result.
    pause_after_s: 0.8
    visual:
      description: >
        L2. The staircase (kit.staircase, base 2) climbs from the lower left: each riser carries ×2 (C.base), each
        tread its value (C.value) and a cyan step count sits at the left of each level. Values beyond 64 shrink so
        the stairs stay inside the left two thirds (camera tilt-up follows the climb). In the open column the
        exponential form writes 2^{10} = 1024 (2 amber, 10 cyan, 1024 magenta); on "logarithm" the same three
        coloured parts slide (TransformMatchingTex) into log₂ 1024 = 10 below it. On "both lines" a two-way arrow ⇔
        joins them. On "starts from the number of steps" an arrow sweeps up the staircase; on "starts from the
        result" it sweeps back down.
      reveal_sequence:
        - {at_word: "staircase", action: "steps draw in from 1"}
        - {at_word: "multiplication by two", action: "×2 lights on each riser in turn"}
        - {at_word: "height", action: "cyan counts light up the left edge"}
        - {at_word: "Ten twos", action: "2^10 = 1024 writes in the column"}
        - {at_word: "logarithm", action: "parts slide into log₂ 1024 = 10"}
        - {at_word: "same fact", action: "⇔ joins the two lines"}
        - {at_word: "number of steps", action: "arrow sweeps up the stairs"}
        - {at_word: "from the result", action: "arrow sweeps down"}
      equations: ['2^{10}=1024', '\log_2 1024=10']
      camera: "2D with a slow tilt up the staircase"
      layout: L2
      layers: [bg_solid, staircase, equation_column, sweep_arrows, progress_rail]
    engines: {primary: manim}
    engine_reason: "Exact geometry and colour-matched TeX transforms are Manim."
    retention_device: "one picture, two sentences that mean the same thing"
    interrupt: equation
    transition_out: "The ×2 labels flip to ×10."
    sfx_music: "None."

  - id: c01_s03
    chapter: c01
    title: "Other bases, in-between steps"
    arc_step: equation
    duration_s: 50.76
    duration_source: audio
    goal: "The base is the step size; a try-it-yourself in base three; logs of non-powers sit between steps; the curve."
    narration: |
      The base is the size of each step. [pause 0.4s] With base ten, each step multiplies by ten, so ten, one
      hundred and one thousand sit one, two and three steps up, and the logarithm counts the zeros. [pause 0.6s] Try
      one yourself. [pause 0.4s] How many threes do you multiply together to reach eighty one? [pause 1.5s] Three
      times three is nine, then twenty seven, then eighty one, so it takes four threes, and the logarithm, base three,
      of eighty one is four. [pause 0.6s] The staircase also has room between its steps. [pause 0.4s] Six lies
      between four and eight, so its logarithm, base two, lies between two and three, at about two point five eight.
      [pause 0.6s] Fill in every number like this, and the staircase smooths into a curve.
    pause_after_s: 2.0
    visual:
      description: >
