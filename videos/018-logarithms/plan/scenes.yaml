        counts 0 … 10 (C.steps). On "eight by thirty two" 8 and 32 light; thin arrows drop to 3 and 5. On "Add" the
        3 and 5 lift into the column as 3 + 5 = 8, the 8 slides back along the steps row and an arrow rises to 256,
        which glows briefly (graphic glow, not text: a ring behind it). Then the staircase reappears below: a climb
        of 3 (amber ×2 ×3) followed by a climb of 5 is the same as one climb of 8; the full identity writes in the
        column with matching colours.
      reveal_sequence:
        - {at_word: "powers of two", action: "values row writes in"}
        - {at_word: "steps", action: "steps row writes in under it"}
        - {at_word: "eight by thirty two", action: "8 and 32 light; arrows to 3 and 5"}
        - {at_word: "Add them", action: "3 + 5 = 8 in the column"}
        - {at_word: "read across", action: "8 → 256, a ring lights behind it"}
        - {at_word: "climbing three steps", action: "climb of 3 then 5 on a staircase below"}
        - {at_word: "addition", action: "identity 8·32 = 2³·2⁵ = 2⁸ = 256 writes"}
      equations: ['8\cdot 32=2^3\cdot 2^5=2^{3+5}=256']
      camera: "2D"
