    arc_step: equation
    duration_s: 29.39
    duration_source: audio
    goal: "Product, quotient and power rules as stacking, descending and repeating climbs."
    narration: |
      That is the main rule: the logarithm of a product is the sum of the logarithms. [pause 0.6s] The other rules follow from the same picture. [pause 0.4s] Dividing walks back
      down the staircase, so the logarithm of a quotient is a difference. [pause 0.5s] Raising a number to a power
      repeats the same climb several times, so the logarithm of a power is that many copies of the climb.
      [pause 0.6s] Every rule you may have memorized is the staircase seen from a different side.
