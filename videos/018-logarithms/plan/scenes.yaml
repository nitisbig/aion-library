  - id: c04_s03
    chapter: c04
    title: "One shape, many bases"
    arc_step: equation
    duration_s: 47.92
    duration_source: audio
    goal: "All log curves are stretches of one another; change of base; solve 2^x = 10; plant L2."
    narration: |
      Logarithms with different bases all share one shape. [pause 0.4s] The curve for base two is the curve for base
      ten stretched upward, by the same factor at every point. [pause 0.6s] So to change base, you divide by a single
      number, the logarithm of the new base. [pause 0.6s] This is how you solve for an unknown exponent. [pause 0.4s]
      Which power of two gives ten? [pause 1.2s] The answer is the logarithm of ten, base two, which is one divided by
      the logarithm of two, about three point three two, the same stretch we just saw. [pause 0.6s] Mathematicians
      prefer one base above all the others. [pause 0.4s] It is a number close to two point seven one eight, called e. [pause 0.4s] To see where it comes from, we need a piece of geometry.
    pause_after_s: 2.0
    visual:
      description: >
        L3. Three curves: log₁₀ x (C.muted), ln x (C.natural) and log₂ x (C.steps). On "stretched upward" a vertical
        stretch slider (a thin rule with a dot, C.base) drags log₁₀ x up by the factor 3.32 (computed) until it lands
        on log₂ x, with vertical arrows at x = 2, 4, 8 showing the same ratio. The change-of-base formula writes
        top-right. On "unknown exponent" the question 2ˣ = 10 writes; on "Which power" a horizontal dashed line at
        height 10 meets y = 2ˣ (drawn faintly) and a vertical drop marks x = ?; during the pause the ? pulses. The
        solution steps write: x = log₂ 10 = 1 / log₁₀ 2 ≈ 3.32, and the drop lands at 3.32 on the x-axis. On "one base"
        the other curves dim and ln x stays; on "called e" a green e appears at the point (e, 1) on ln x. On "piece of
        geometry" the hyperbola y = 1/x fades in faintly under everything.
      reveal_sequence:
