  - id: c06_s03
    chapter: c06
    title: "Straight lines and the scale of everything"
    arc_step: payoff
    duration_s: 36.48
    duration_source: audio
    goal: "Power laws become straight lines (Kepler's third law); atom to galaxy on one ruler."
    narration: |
      Logarithms also reveal hidden laws. [pause 0.4s] Johannes Kepler found a
      rule linking each planet's distance from the Sun to the time it takes to go around. [pause 0.5s] Plotted
      plainly, the planets lie on a bending curve, but take the logarithm of both quantities and they fall on a
      straight line, rising three steps for every two. [pause 0.6s] That straight line is the mark of a power law. [pause 0.6s] And with logarithmic steps, an atom, a
      person, the Earth and a whole galaxy can share one ruler, about thirty one powers of ten from end to end.
    pause_after_s: 2.0
    visual:
      description: >
        L3. Linear axes: distance from the Sun (AU) vs period (years); six planets Mercury…Saturn as dots in
        C.planet (real values, logdata). Small tag "Kepler · 1619". On "bending curve" a fitted curve
        T = a^1.5 draws through them. On "take the logarithm" both axes animate to log scales (each tick moves to its
        log position, m.redraw per frame) and the points glide onto a straight line of slope 1.500 (fitted, shown
        as a rise/run triangle 3 over 2 in value/steps). Column: T² ∝ a³ ⇒ log T = 3/2 log a + c. On "atom" the
        plot dissolves into one long horizontal log ruler from 10⁻¹⁰ m to 10²¹ m; the camera pans along it (2.5D
        parallax) past an atom (line orbitals), a person silhouette, the Earth (pyvista-lit sphere), and a spiral
        galaxy (seeded points, PointsLayer), each sitting at its power of ten. The span reads 31 powers of ten.
      reveal_sequence:
        - {at_word: "Kepler", action: "planets on linear axes; small tag"}
        - {at_word: "bending curve", action: "T = a^1.5 draws through them"}
        - {at_word: "take the logarithm", action: "axes become log scales; points glide onto a line"}
        - {at_word: "three steps for every two", action: "rise/run triangle 3 over 2"}
        - {at_word: "power law", action: "log T = 3/2 log a + c writes"}
        - {at_word: "atom", action: "plot dissolves into the atom-to-galaxy ruler; pan begins"}
        - {at_word: "galaxy", action: "galaxy at 10²¹ m"}
        - {at_word: "thirty one powers", action: "span bracket, hold"}
      equations: ['T^2\propto a^3', '\log T=\tfrac32\log a+c']
      camera: "2D for the plot, then a 2.5D parallax pan along the ruler"
      layout: L3
      layers: [bg_solid, axes_rescaling, planet_points, fit_curve, slope_triangle, equation_float, scale_ruler, scale_objects, galaxy_points, earth_pyvista, progress_rail]
    engines: {primary: manim, secondary: [pyvista, moderngl]}
    engine_reason: "Axis rescaling and the fit are Manim; Earth is a pyvista raster; galaxy is a PointsLayer."
    retention_device: "two payoffs: a hidden law becomes a line, and everything fits one ruler"
    interrupt: visual
    transition_out: "The ruler folds up into a staircase of six steps. Rail completes."
    sfx_music: "A slow wide pad during the pan."

# ======================================================================== OUTRO
  - id: out_s01
    chapter: outro
    title: "What we covered"
    arc_step: recap
    duration_s: 35.79
    duration_source: audio
    goal: "Recap every chapter as one lit step of the staircase."
    narration: |
      So a logarithm is a count of multiplications, the number of steps up a staircase. [pause 0.6s] Because steps
      add when numbers multiply, products become sums, unknown exponents can be solved, and a slide rule can
      multiply. [pause 0.6s] Its graph is the exponential seen in a mirror. [pause 0.5s] The area under one over x
      gives the natural logarithm, and the point where that area reaches one is e. [pause 0.6s] And because we sense
      the world in ratios, logarithms measure sound, starlight and earthquakes, from atoms to galaxies.
    pause_after_s: 0.8
    visual:
      description: >
        L2. A six-step staircase climbs diagonally across the frame. Each step lights in its chapter hue as its
        lesson is spoken, with a tiny live thumbnail of that chapter's picture resting on the tread (precomps, no
        frame, feathered) and one key word in CM sans beneath: count · add · ruler · mirror · e · scales. Each
        step's equation fades in beside its thumbnail and out again (log₂ 8 = 3, log(ab) = log a + log b, log 2 +
        log 3 = log 6, y = log₂ x, ln e = 1, log T = 3/2 log a + c). The progress rail fills to the end and fades.
      reveal_sequence:
        - {at_word: "count of multiplications", action: "step 1 lights: staircase thumbnail, count"}
        - {at_word: "products become sums", action: "step 2: add"}
        - {at_word: "slide rule", action: "step 3: ruler"}
        - {at_word: "mirror", action: "step 4: mirror"}
        - {at_word: "is e", action: "step 5: e"}
        - {at_word: "galaxies", action: "step 6: scales; rail completes and fades"}
      equations: ['\log_2 8=3', '\log(ab)=\log a+\log b', '\ln e=1']
      camera: "2.5D: slow climb along the staircase"
      layout: L2
      layers: [bg_solid, staircase_six, chapter_thumbnails, keywords, equations_transient, progress_rail]
    engines: {primary: manim, secondary: [moderngl]}
    engine_reason: "Staircase and TeX are Manim; thumbnails are precomps composited by the GPU."
    retention_device: "summary as a single climbing picture; each lesson tied to its image"
    interrupt: visual
    transition_out: "The camera rises above the staircase; Napier's page fades in beneath it."
    sfx_music: "A soft rising tone per step."

