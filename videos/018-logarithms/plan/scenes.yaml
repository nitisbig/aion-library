    goal: "Multiply 8 × 32 by adding step counts; pay L1 (why the tables)."
    narration: |
      Napier's trick comes straight out of the staircase. [pause 0.4s] Write the powers of two in one row, and the
      number of steps for each of them underneath. [pause 0.5s] To multiply eight by thirty two, look up their
      steps, three and five. [pause 0.4s] Add them to get eight, and read across the table: eight steps up is two
      hundred and fifty six, which is the product. [pause 0.6s] Climbing three steps and then five is the same as climbing eight, so the multiplication has become an addition.
    pause_after_s: 0.8
