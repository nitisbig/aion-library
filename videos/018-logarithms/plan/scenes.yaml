# ======================================================================== C05 WHY E
  - id: c05_s01
    chapter: c05
    title: "The area under 1/x"
    arc_step: hook
    duration_s: 34.50
    duration_source: audio
    goal: "Introduce the hyperbola area and check with numbers that areas add when endpoints multiply."
    narration: |
      Take the curve whose height at each point is one over x, and shade the area beneath it, starting from one.
      [pause 0.5s] In the sixteen forties, mathematicians studying this curve noticed something about those areas.
      [pause 0.5s] The area from one to two, added to the area from one to three, gives the area from one to six.
      [pause 0.6s] Check the numbers: about zero point six nine and one point one zero, which together make one point
      seven nine. [pause 0.6s] Areas that add when their endpoints multiply behave exactly like logarithms.
    pause_after_s: 0.8
    visual:
      description: >
        L3. y = 1/x in white over the grid (first quadrant). The area from 1 to a fills in teal (a GLSL fill shader:
        a soft vertical gradient in linear light with a crisp bright edge along the curve, accent glow on the edge
        only) as a slider at a moves. A small tag "Saint-Vincent · de Sarasa · 1647–49" fades in and out. On "one to
        two" the region [1, 2] fills; on "one to three" a second region [1, 3] fills in a lighter teal; on "one to
        six" the two areas fly and stack into the region [1, 6], which fills exactly. On "Check the numbers" cyan
        readouts 0.693, 1.099 and their sum 1.792 write beside each region (computed). Column: A(1,2) + A(1,3) =
        A(1,6), then next to it log 2 + log 3 = log 6 from chapter 3.
      reveal_sequence:
        - {at_word: "one over x", action: "y = 1/x draws"}
        - {at_word: "shade the area", action: "area from 1 fills as a slider moves"}
        - {at_word: "sixteen forties", action: "small history tag"}
        - {at_word: "one to two", action: "region [1,2]"}
        - {at_word: "one to three", action: "region [1,3]"}
        - {at_word: "one to six", action: "the two areas stack into [1,6]"}
        - {at_word: "Check the numbers", action: "readouts 0.693 + 1.099 = 1.792"}
        - {at_word: "behave exactly like logarithms", action: "log 2 + log 3 = log 6 lights next to the area rule"}
      equations: ['A(1,2)+A(1,3)=A(1,6)', '0.693+1.099=1.792']
      camera: "2D"
      layout: L3
      layers: [bg_solid, grid, hyperbola, area_fill_shader, name_tag, readouts, equation_float, progress_rail]
    engines: {primary: manim, secondary: [moderngl]}
    engine_reason: "Curve and TeX are Manim; the area fill and edge glow are a GLSL shader driven by a Track."
    retention_device: "a coincidence checked with real numbers; begins paying L2"
    interrupt: visual
    transition_out: "The [1,2] region lifts off to be stretched."
    sfx_music: "A soft fill swell."

  - id: c05_s02
    chapter: c05
    title: "Stretch and squash"
    arc_step: insight
    duration_s: 32.01
    duration_source: audio
    goal: "Explain why with stretch invariance."
    narration: |
      There is a simple reason for this. [pause 0.4s] Take the region from one to two and stretch it sideways by a
      factor of three, so it now runs from three to six. [pause 0.5s] It becomes three times wider, but out there the
      curve is three times lower, so the area does not change. [pause 0.6s] So the area from three to six matches the area from one to two, and together with one to three it makes one to six.
      [pause 0.6s] The area under this curve is a logarithm, and the curve itself chooses its base.
    pause_after_s: 0.8
    visual:
      description: >
        L3. The region [1, 2] is cut into eight thin teal strips (Riemann strips that tile it exactly). On "stretch"
        every strip widens ×3 (amber ×3 arrow on the x-axis) and slides to [3, 6], while its height drops ×1/3 to
        meet the curve (magenta ÷3 arrow); an area readout stays fixed at 0.693 throughout. On "area from one to six"
        the [1, 3] region and the moved [3, 6] region join, totalling 1.792. Column: A(3,6) = A(1,2), then the
        general rule A(1,ab) = A(1,a) + A(1,b). On "chooses its base" a question mark sits on the x-axis to the
        right of 2.
      reveal_sequence:
        - {at_word: "simple reason", action: "region [1,2] cut into strips"}
        - {at_word: "stretch it sideways", action: "strips widen ×3 and slide to [3,6]"}
        - {at_word: "three times lower", action: "heights drop ×1/3; readout holds at 0.693"}
        - {at_word: "three to six", action: "A(3,6) = A(1,2) writes"}
        - {at_word: "makes one to six", action: "[1,3] + [3,6] = [1,6]; general rule writes"}
        - {at_word: "chooses its base", action: "a ? on the x-axis"}
      equations: ['A(3,6)=A(1,2)', 'A(1,ab)=A(1,a)+A(1,b)']
      camera: "2D"
      layout: L3
      layers: [bg_solid, grid, hyperbola, area_strips, scale_arrows, readout, equation_float, progress_rail]
    engines: {primary: manim}
    engine_reason: "Exact strip geometry under 1/x is Manim (each strip a pure function of the stretch Track)."
    retention_device: "the 'why' is a single visual move the viewer can repeat"
    interrupt: visual
    transition_out: "The strips merge back into one region starting at 1."
    sfx_music: "None."

  - id: c05_s03
    chapter: c05
    title: "e, and doubling time"
    arc_step: payoff
    duration_s: 49.87
    duration_source: audio
    goal: "Find e as the point where the area is 1; define ln and its slope; worked example: doubling time. Pays L2."
    narration: |
      To find that base, slide the right edge outward until the area is exactly one. [pause 0.5s] The edge stops at
      two point seven one eight two eight and so on, the number e. [pause 0.6s] This area is the natural logarithm,
      written l n, and its slope at every point is the height of the first curve. [pause 0.5s] That is why e appears
      wherever something grows at a rate set by its own size. [pause 0.6s] Suppose an amount grows continuously by
      seven percent a year. [pause 0.4s] How long until it doubles? [pause 1.2s] It doubles once the rate times the
      time reaches the natural logarithm of two, about zero point six nine. [pause 0.4s] So the doubling time is
      zero point six nine divided by zero point zero seven, close to ten years, and that is where the rule of seventy
      comes from.
    pause_after_s: 2.0
    visual:
      description: >
        L3. A right edge slides out from 1; the teal area and a big cyan readout climb (0.500, 0.800, 0.950 …) and the
        edge eases to a stop where the readout reads 1.000 at x = 2.71828 (computed with brentq; a spring ease so it
        lands exactly). The point glows green: e (C.natural, accent glow on the mark, not the letter). On "natural
        logarithm" ln x = ∫₁ˣ dt/t writes; on "slope" y = ln x appears above the hyperbola with a tangent sliding
        along it, its slope readout tracking the hyperbola's height at the same x (a vertical dashed link); d/dx ln x
        = 1/x writes. On "seven percent" the frame clears to a growth curve A(t) = e^{0.07t} (C.natural) with a
        dashed line at twice the start; on "How long" the crossing point pulses with a ? during the pause. The
        solution writes step by step: e^{0.07t} = 2 → 0.07t = ln 2 ≈ 0.693 → t ≈ 9.9 years; the crossing drops to
        t ≈ 9.9 on the axis. On "rule of seventy" 70 / 7 = 10 writes beside it in C.muted.
      reveal_sequence:
        - {at_word: "slide the right edge", action: "edge slides; readout climbs"}
        - {at_word: "exactly one", action: "readout 1.000"}
        - {at_word: "two point seven one eight two eight", action: "edge stops at e; green glow on the point"}
        - {at_word: "natural logarithm", action: "ln x = ∫₁ˣ dt/t writes"}
        - {at_word: "slope", action: "y = ln x with a sliding tangent linked to 1/x"}
        - {at_word: "seven percent", action: "growth curve e^{0.07t} and a doubling line"}
        - {at_word: "How long", action: "crossing pulses with ?"}
        - {at_word: "natural logarithm of two", action: "0.07t = ln 2 ≈ 0.693"}
        - {at_word: "close to ten years", action: "t ≈ 9.9 years; the crossing drops to the axis"}
        - {at_word: "rule of seventy", action: "70 / 7 = 10"}
      equations: ['\ln x=\int_1^x\frac{dt}{t}', '\ln e=1', '\frac{d}{dx}\ln x=\frac1x', 'e^{0.07t}=2\ \Rightarrow\ t=\frac{\ln 2}{0.07}\approx9.9']
      camera: "2D; the frame stacks two plots (ln x above 1/x) with no divider, then clears for the growth curve"
      layout: L3
      layers: [bg_solid, grid, hyperbola, area_fill_shader, readout, e_glow, ln_curve, tangent, growth_curve, equation_float, progress_rail]
    engines: {primary: manim, secondary: [moderngl]}
    engine_reason: "Curves, tangent and solving steps are Manim; the area fill and e glow are GL layers."
    retention_device: "pays L2; then a worked example (doubling time) with a pause to guess"
    interrupt: question
    transition_out: "The growth curve dissolves into rings spreading from a point. Chapter card."
    sfx_music: "A soft chime as the readout reaches 1.000."

# ======================================================================== C06 WORLD
  - id: c06_s01
    chapter: c06
    title: "Senses"
    arc_step: application
    duration_s: 38.25
    duration_source: audio
    goal: "Perception is logarithmic; worked example: concert vs conversation in decibels. Pays L3."
    narration: |
      Our senses work the same way. [pause 0.4s] We notice changes in proportion, so a sound must grow by a fixed
      factor before it seems one step louder. [pause 0.6s] That is why loudness is measured in decibels, where every
      ten decibels means ten times the power. [pause 0.6s] So how much more powerful is a ninety decibel concert than
      a sixty decibel conversation? [pause 1.2s] The difference is thirty decibels, which is three steps of ten, so
      the concert carries a thousand times the power. [pause 0.6s] Star brightness works the same way, where five
      magnitudes mean a hundred times the light.
    pause_after_s: 0.8
    visual:
      description: >
        L1. A sound field from a point source fills the frame (GLSL analytic expanding rings, C.sound, amplitude a
        pure function of t). On "decibels" a vertical decibel ruler (C.ruler) at the right rises in even 10 dB steps
        while the ring brightness multiplies ×10 per step (the shader's power uniform follows 10^(L/10), tone-mapped
        so the frame never clips). Column: L = 10 log₁₀(P/P₀). On "ninety decibel concert" two markers sit on the
        ruler: a speech icon at 60 and a speaker-stack line drawing at 90; the ? pulses during the pause. On "three
        steps" three ×10 brackets climb from 60 to 90 and 10 × 10 × 10 = 1000 writes. On "Star brightness" the rings
        fade into a seeded star field (C.star, sizes by magnitude 1–6) and a magnitude ruler lights, 2.512⁵ ≈ 100
        beside it.
      reveal_sequence:
        - {at_word: "senses", action: "sound rings start"}
        - {at_word: "fixed factor", action: "ring power ×10; a dB step ticks"}
        - {at_word: "decibels", action: "dB ruler in even steps; equation writes"}
        - {at_word: "ninety decibel concert", action: "markers at 60 and 90; ? pulses"}
        - {at_word: "three steps of ten", action: "three ×10 brackets"}
        - {at_word: "thousand times", action: "10 × 10 × 10 = 1000"}
        - {at_word: "Star brightness", action: "rings fade into a star field; magnitude ruler"}
        - {at_word: "hundred times", action: "2.512⁵ ≈ 100"}
      equations: ['L=10\log_{10}\frac{P}{P_0}\ \mathrm{dB}', '90-60=30\ \mathrm{dB}\ \Rightarrow\ 10^{3}=1000\times', '2.512^{5}\approx100']
      camera: "2.5D: slow push into the rings, then a drift across the star field"
      layout: L1
      layers: [bg_solid, sound_shader, db_ruler, markers, starfield_points, mag_ruler, equation_float, progress_rail]
    engines: {primary: moderngl, secondary: [manim]}
    engine_reason: "Sound rings are a per-pixel shader; the star field is a PointsLayer; rulers and TeX are Manim."
    retention_device: "pays L3 (our ears); worked example (concert vs conversation) with a pause to guess"
    interrupt: question
    transition_out: "The stars sink into the ground; the ground begins to ripple."
    sfx_music: "A tone getting louder in three even steps."

  - id: c06_s02
