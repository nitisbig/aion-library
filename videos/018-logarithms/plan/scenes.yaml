        adding: log(ab) = log a + log b; (2) a climb of a then a walk down of b, the descent drawn as a magenta ÷
        on each riser: log(a/b) = log a − log b; (3) one climb copied n times, the copies stacking like a ladder:
        log(aⁿ) = n log a. On "different side" the three rules light together and the staircase rotates in 2.5D,
        showing a different face for each rule.
