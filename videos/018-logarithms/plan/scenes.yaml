        value pulse cyan, one per step. On "Try one yourself" the staircase resets to base 3 with its values hidden;
        the question log₃ 81 = ? writes in the column with a slow thin countdown ring (graphic only) during the
        1.5 s pause. On "Three times three" the treads reveal 3, 9, 27, 81 one by one with cyan counts 1–4, and the ?
        turns into a 4. Then back to base 2 for steps 0–4: on "Six" a magenta 6 drops between the 4 and 8 treads,
        and a partial step fills to height 2.585 (computed, logdata) with a cyan readout. On "Fill in" in-between
        points rain onto the risers and the stepped path morphs into the smooth curve y = log₂ x, tilted in 2.5D.
      reveal_sequence:
        - {at_word: "size of each step", action: "×2 flips to ×10"}
        - {at_word: "one thousand", action: "treads 10, 100, 1000"}
        - {at_word: "counts the zeros", action: "zeros pulse cyan per step"}
        - {at_word: "Try", action: "base-3 staircase with hidden values; log₃ 81 = ? and a countdown ring"}
        - {at_word: "Three times three", action: "treads reveal 3, 9, 27, 81; counts 1–4"}
        - {at_word: "is four", action: "? becomes 4"}
        - {at_word: "room between", action: "back to base 2; gaps between steps highlight"}
        - {at_word: "Six", action: "6 drops between 4 and 8"}
        - {at_word: "two point five eight", action: "partial step fills to 2.585"}
        - {at_word: "smooths into a curve", action: "steps morph into y = log₂ x; 2.5D tilt"}
      equations: ['\log_{10}1000=3', '\log_3 81=4', '\log_2 6\approx 2.585']
      camera: "2D, then a 2.5D tilt to show the ramp"
      layout: L2
      layers: [bg_solid, staircase, quiz_ring, partial_step, curve_morph, equation_column, progress_rail]
