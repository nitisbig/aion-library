    title: "So, what is a circle?"
    arc_step: recap
    duration_s: 31.59
    duration_source: audio
    goal: "Recap in six one-line lenses as the ring turns once more; the payoff image, six arcs into one circle."
    narration: |
      So, what is a circle? [pause 0.6s] It's a rule about distance. [pause 0.3s] It's a length that no fraction
      can name. [pause 0.3s] It's every turn at once. [pause 0.3s] It's a loop that survives any stretch.
      [pause 0.3s] It's an area that grows at the rate of its own edge. [pause 0.3s] And it's what a floor full
      of random sticks was hiding. [pause 1.2s] Math isn't a pile of separate subjects. [pause 0.4s] It's one
      connected landscape, and every branch is a way into it.
