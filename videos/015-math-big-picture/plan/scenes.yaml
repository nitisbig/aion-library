  - id: ch7_s02
    chapter: connects
    title: "One short line"
    arc_step: payoff
    duration_s: 30.83
    duration_source: audio
    goal: "Pay off loop L2: a half turn gives minus one, Euler's identity, each symbol from a different branch."
    narration: |
      Back in the chapter on structure, we promised that e, i and pi would meet. [pause 0.6s] Turn by pi, a half
      turn, and you land on minus one. [pause 0.8s] Written as an equation, that's Euler's identity.
      [pause 1.2s] The e comes from change. [pause 0.3s] The i comes from turning. [pause 0.3s] Pi comes from the
      circle, and one and zero are where counting starts. [pause 1.0s] One short line, touching almost
      every part of the map.
    pause_after_s: 1.2
    visual:
      description: >
        The glyphs e, i and pi leave their corner tracker. On the unit circle the point sweeps a half turn from 1
        to -1 (C.structure arc). Euler's identity assembles with each symbol in its pillar color: e C.change,
        i C.structure, pi C.quantity, 1 and 0 C.foundations. Each symbol then flies along a chord to its node, and
        the chord S-C ('growth meets turning') draws.
      reveal_sequence:
        - {at_word: "promised", action: "the three glyphs leave the tracker"}
        - {at_word: "half turn", action: "the point sweeps from 1 to -1"}
        - {at_word: "Euler's identity", action: "e^{i pi} + 1 = 0 assembles in pillar colors"}
        - {at_word: "change", action: "e flies to the Change node"}
        - {at_word: "turning", action: "i flies to Structure"}
        - {at_word: "Pi", action: "pi flies to Quantity; 1 and 0 to Foundations"}
        - {at_word: "every part", action: "chord S-C draws; the identity glows once in place"}
      equations: ['e^{i\pi}=-1', 'e^{i\pi}+1=0']
      camera: "push into the unit circle, then back out to the map, 1.5 s each"
      layers: [bg_solid, manim_unit_circle, manim_equations, manim_map_ring, manim_loop_tracker]
    engines: {primary: manim}
    engine_reason: "Glyph flights along chords are Manim paths; TeX parts colored by role."
    retention_device: "pays off loop L2 (R7); the biggest single payoff (R13)"
    interrupt: "camera: push in and out"
    transition_out: "The map shrinks around a small floor of sticks at its center."
    map_update: {lights: [], edges: [[structure, change]]}
    sfx_music: "A low soft tone under the identity."

  - id: ch7_s03
    chapter: connects
    title: "The sticks, retold"
    arc_step: payoff
    duration_s: 31.37
    duration_source: audio
    goal: "Final payoff of loop L1: Buffon's answer used every branch."
    narration: |
      And the sticks on the floor needed all of it. [pause 0.6s] Definitions said exactly what counts as a
      crossing. [pause 0.4s] Symmetry said every angle is equally likely. [pause 0.4s] Geometry turned each
      throw into a dot in a rectangle. [pause 0.4s] Calculus measured the area under the arch. [pause 0.4s]
      Probability turned that area into a share of throws. [pause 0.4s] And out came pi, a number no fraction can
      reach. [pause 1.2s] No single branch could have found it alone.
    pause_after_s: 1.2
    visual:
      description: >
        A small floor of sticks sits inside the ring. Each line draws one piece in its pillar color and lights the
        chord from the floor to that node: the crossing condition as a set (C.foundations); directions spinning
        evenly (C.structure, and chord S-U draws); the rectangle (C.space); the arch area (C.change); the share
        (C.uncertainty); pi (C.quantity). On the last line all six nodes pulse together.
      reveal_sequence:
        - {at_word: "all of it", action: "the floor of sticks at the ring's center"}
        - {at_word: "Definitions", action: "crossing condition as a set, C.foundations"}
        - {at_word: "Symmetry", action: "directions spin evenly; chord S-U draws"}
        - {at_word: "Geometry", action: "the rectangle, C.space"}
        - {at_word: "Calculus", action: "the arch area, C.change"}
        - {at_word: "Probability", action: "the share, C.uncertainty"}
        - {at_word: "out came pi", action: "pi in C.quantity"}
        - {at_word: "alone", action: "all six nodes pulse together"}
      equations: ['\{(\theta,x):x\le\sin\theta\}', 'P=\frac{2}{\pi}']
      camera: "static"
      layers: [bg_solid, skia_needles, manim_map_ring, manim_pieces]
    engines: {primary: manim, secondary: [skia]}
    engine_reason: "Map and pieces in Manim; the floor reuses the seeded skia needle layer."
    retention_device: "keeps the intro's promise (R7, R13); visual callback (R8)"
    interrupt: "callback montage, one change per line"
    transition_out: "The floor fades; equations from other fields drift in."
    map_update: {lights: [], edges: [[structure, uncertainty]]}
    sfx_music: "None."

  - id: ch7_s04
    chapter: connects
    title: "Every lens"
    arc_step: takeaway
    duration_s: 21.37
    duration_source: audio
    goal: "Human example of connections at work (Wiles 1994) and the chapter's takeaway."
    narration: |
      Mathematicians lean on these connections all the time. [pause 0.4s] In nineteen ninety-four, Andrew Wiles
      settled a question about whole numbers that had stood open for more than three hundred and fifty years,
      using tools from geometry and algebra. [pause 1.0s] Every lens saw something true, and each needed the
      others.
    pause_after_s: 2.0
    visual:
      description: >
        Fermat's equation with 'no whole-number solutions for n > 2' (C.quantity). An elliptic curve (C.space)
        and a symmetry glyph (C.structure) link to it with lit chords. Lower third 'A. Wiles · 1994'. Then the
        full map with all fifteen chords lit holds for the takeaway.
      reveal_sequence:
        - {at_word: "connections", action: "Fermat's equation fades in"}
        - {at_word: "Wiles", action: "lower third"}
        - {at_word: "geometry", action: "an elliptic curve and a symmetry glyph link to the equation"}
        - {at_word: "Every lens", action: "the full map, all fifteen chords lit"}
      equations: ['x^n+y^n=z^n', 'y^2=x^3-x']
      camera: "pull back to the full map on the takeaway"
      layers: [bg_solid, manim_equations, manim_curve, manim_lower_third, manim_map_ring]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "The elliptic curve's real points computed in numpy and drawn as a crisp curve."
    retention_device: "human example (R10); takeaway (R13)"
    interrupt: "new objects: Fermat and an elliptic curve"
    transition_out: "The full map holds as the outro begins."
    sfx_music: "None."

