  - id: ch6_s02
    chapter: uncertainty
    title: "Many coin flips"
    arc_step: intuition
    duration_s: 29.62
    duration_source: audio
    goal: "Law of large numbers: the share of heads settles to one half (Bernoulli 1713)."
    narration: |
      Flip a coin again and again, and keep track of the share of heads. [pause 0.6s] Early on, it jumps
      around. [pause 0.4s] After a thousand flips it hugs one half, and the longer it runs, the closer it stays.
      [pause 1.0s] Jacob Bernoulli proved this in a book published in seventeen thirteen: averages of many
      random events settle down. [pause 0.6s] One flip tells you nothing. [pause 0.3s] A million flips land
      within a whisker of one half.
    pause_after_s: 1.0
    visual:
      description: >
        A running share of heads against flips on a log axis from 1 to a million (seeded), drawn in
        C.uncertainty, with a dashed one-half line (C.muted). A band of plus or minus one over two root N narrows
        around it. A flip counter in tabular figures. Lower third 'J. Bernoulli · 1713'.
      reveal_sequence:
        - {at_word: "share of heads", action: "axes and the dashed one-half line"}
        - {at_word: "jumps", action: "the running share zigzags over the first 50 flips"}
        - {at_word: "thousand", action: "counter passes 1,000; the line hugs one half"}
        - {at_word: "closer", action: "the band narrows"}
        - {at_word: "Bernoulli", action: "lower third"}
        - {at_word: "million", action: "counter reaches 1,000,000; the line sits inside a hairline band"}
      equations: ['\frac{\text{heads}}{\text{flips}}\to\frac12']
      camera: "static"
      layers: [bg_solid, manim_axes, manim_running_share, manim_band, manim_counter, manim_lower_third]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "A million seeded flips summarized by numpy cumsum; Manim draws the curve and the band."
    retention_device: "human example, coin flips (R10); wrong intuition, chance means chaos (R4)"
    interrupt: "mode: a chart"
    transition_out: "The chart slides away; one stick is enlarged for measuring."
    sfx_music: "None."

  - id: ch6_s03
    chapter: uncertainty
    title: "Each throw is a dot"
    arc_step: formalization
    duration_s: 31.50
    duration_source: audio
    goal: "Geometric probability: each throw is a dot (angle, distance) in a rectangle; crossing means under the sine arch."
    narration: |
      Make the sticks exactly as long as the boards are wide. [pause 0.4s] Then describe each throw with two
      numbers: how far
      the middle of the stick lands from the nearest crack, and the angle it makes with the boards. [pause 0.8s]
      Every throw becomes a dot in a rectangle of possibilities, and every dot is equally likely. [pause 0.6s]
      The stick crosses a crack exactly when its dot falls under this curve, one arch of a sine wave.
      [pause 0.8s] So what share of throws should cross? [pause 2.0s]
    pause_after_s: 0.5
    visual:
      description: >
        One stick enlarged over two cracks; its length matches the board width (a tick). The distance from its
        middle to the nearest crack and its angle with the boards are drawn and tagged. A rectangle (C.space)
        appears, angle 0 to pi across, distance 0 to 1 up (in half-board widths). Throws on the floor drop as
        dots into the rectangle; the sine arch (C.change) draws; dots under it light C.uncertainty, the rest
        dim. Predict beat: dots keep arriving, no readout.
      reveal_sequence:
        - {at_word: "as long as", action: "one stick enlarged; length matches the board width"}
        - {at_word: "how far", action: "distance from the middle to the nearest crack, tagged x"}
        - {at_word: "angle", action: "angle with the boards, tagged theta"}
        - {at_word: "rectangle", action: "rectangle of possibilities; throws drop in as dots"}
        - {at_word: "crosses", action: "sine arch draws; dots under it light, others dim"}
        - {at_word: "what share", action: "predict beat: dots keep arriving, no readout"}
      equations: ['x\le\sin\theta', '0\le\theta\le\pi,\quad 0\le x\le1']
      camera: "push from the floor into the single stick, then pan to the rectangle"
      layers: [bg_solid, manim_boards, skia_needles, manim_rectangle, manim_dots, manim_curve]
    engines: {primary: manim, secondary: [numpy, skia]}
    engine_reason: "Each throw's (theta, x) comes from the same seeded samples as the floor, so the dots are the real throws."
    retention_device: "pause and predict, 2 s (R12); colors carry the links: rectangle = space, arch = change (R11)"
    interrupt: "mode: a floor becomes a diagram"
    transition_out: "The region under the arch fills."
    sfx_music: "None."

  - id: ch6_s04
    chapter: uncertainty
    title: "Where the circle was hiding"
    arc_step: worked_example
    duration_s: 33.36
    duration_source: audio
    goal: "Pay off loop L1: P = (area under the arch) / (rectangle) = 2/pi; the circle hides in the angle."
    narration: |
      The share of sticks that cross is the share of the rectangle under the arch. [pause 0.5s] Calculus gives
      the area under one arch of a sine wave: exactly two. [pause 0.6s] The rectangle is a half turn wide, so its
      area is pi. [pause 1.0s] So the crossing share is two over pi, about sixty-four percent. [pause 1.0s]
      And that's where the circle was hiding: in the angle. [pause 0.4s] Every direction a stick can point lies
      on a circle, and pi is what it takes to go halfway around.
    pause_after_s: 1.5
    visual:
      description: >
        The region under the arch fills C.change at 30 percent and its integral writes. The rectangle's width
        tick turns gold (pi, C.quantity). P = 2/pi assembles; the live crossing share of the dots converges on
        0.6366. Then every stick on the floor slides to the center keeping its angle, as their tips trace the circle; the
        tips trace the circle and the half-turn arc of directions glows gold.
      reveal_sequence:
        - {at_word: "share", action: "region under the arch fills"}
        - {at_word: "exactly two", action: "integral of sin from 0 to pi = 2"}
        - {at_word: "half turn", action: "width tick becomes pi; rectangle area pi"}
        - {at_word: "two over pi", action: "P = 2/pi = 0.6366; live share converges"}
        - {at_word: "hiding", action: "sticks slide to the center keeping their angles; tips trace the circle"}
        - {at_word: "halfway", action: "the half-turn arc of directions glows gold; pi = 2 x throws / crossings"}
      equations: ['\int_0^{\pi}\sin\theta\,d\theta=2', 'P=\frac{2}{\pi}\approx0.6366', '\pi\approx\frac{2\times\text{throws}}{\text{crossings}}']
      camera: "pull back from the rectangle to the floor on 'hiding'"
      layers: [bg_solid, manim_rectangle, manim_curve, manim_equations, skia_needles, manim_circle]
    engines: {primary: manim, secondary: [skia, numpy]}
    engine_reason: "Areas and the converging share from the same seeded throws; the needle slide reuses the seeded skia layer."
    retention_device: "pays off loop L1 (R7); big visual callback to the intro's floor (R8, R13)"
    interrupt: "callback: the needle floor, now explained"
    transition_out: "The circle holds; history cards slide in."
    sfx_music: "A soft hiss under the slide, then silence."

  - id: ch6_s05
    chapter: uncertainty
    title: "Buffon, and a lucky result"
    arc_step: history
    duration_s: 30.44
    duration_source: audio
    goal: "Buffon (1777); estimates improve as 1 over root N; Lazzarini's 1901 result was too good (exactly 355/113)."
    narration: |
      The French naturalist Buffon worked this out in the seventeen hundreds. [pause 0.6s] In nineteen-oh-one,
      Mario Lazzarini reported three thousand four hundred and eight throws that gave pi to six decimal places.
      [pause 0.8s] That's suspiciously good. [pause 0.4s] A random estimate improves slowly: each extra correct
      digit takes about a hundred times more throws. [pause 0.6s] His answer was exactly Zu Chongzhi's fraction,
      and his numbers suggest he chose when to stop.
    pause_after_s: 1.0
    visual:
      description: >
        Lower thirds 'G.-L. Leclerc, Comte de Buffon · 1777' and 'M. Lazzarini · 1901'. A log-log plot of
        estimate error against throws: thirty seeded honest runs (faint C.uncertainty) inside a band with slope
        minus one half. Lazzarini's point (3,408 throws, error 0.0000003) sits far below the band, tagged 'too
        lucky'. His 5,680 / 1,808 reduces to 355/113, and the gold 355/113 tick from Chapter 2 flies in to match.
      reveal_sequence:
        - {at_word: "Buffon", action: "lower third"}
        - {at_word: "Lazzarini", action: "lower third"}
        - {at_word: "suspiciously", action: "his point drops far below the honest band"}
        - {at_word: "slowly", action: "the 1/sqrt N slope line; 'x100 throws per digit' tag"}
        - {at_word: "Zu Chongzhi's", action: "5680/1808 = 355/113; the Chapter 2 tick flies in"}
      equations: ['\text{error}\sim\frac{1}{\sqrt N}', '\frac{5680}{1808}=\frac{355}{113}']
      camera: "static"
      layers: [bg_solid, manim_loglog, manim_runs, manim_lower_third, manim_callback_tick]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Thirty seeded Buffon runs simulated in numpy; Manim draws the log-log plot."
    retention_device: "history as a small story (R14); callback to Ch2 (R8)"
    interrupt: "mode: a log-log plot"
    transition_out: "The honest runs become rays of light."
    sfx_music: "None."

  - id: ch6_s06
    chapter: uncertainty
    title: "Randomness at work"
    arc_step: sighting
    duration_s: 25.33
    duration_source: audio
    goal: "Sightings: Monte Carlo (1940s); film lighting by random light paths; medical trials and luck."
    narration: |
      Measuring things with random samples is now a standard tool, called the *Monte Carlo* method, named in the
      nineteen forties after the famous casino. [pause 0.8s] The animated films you watch are lit this way: a
      computer follows millions of random paths of light and averages them. [pause 0.8s] And when a medical trial
      reports that a treatment works, statistics is what tells us whether the result could just be luck.
    pause_after_s: 1.0
    visual:
      description: >
        Key words 'Monte Carlo · 1940s'. A simple line-art scene, a ball on a floor under a lamp, lit by random
        light paths (thin C.uncertainty rays, skia); its shading goes from noisy to smooth as samples grow
        (counter 1, 16, 256, 4096 per pixel). Then two groups of dots (treatment, control) and a histogram of
        differences that chance alone would give; the observed difference lands outside it, tagged 'not luck'.
      reveal_sequence:
        - {at_word: "Monte Carlo", action: "key words 'Monte Carlo · 1940s'"}
        - {at_word: "films", action: "lamp, ball and floor in line art"}
        - {at_word: "random paths", action: "rays trace; shading goes from noisy to smooth"}
        - {at_word: "medical trial", action: "two groups of dots"}
        - {at_word: "luck", action: "chance histogram; observed difference lands outside, 'not luck'"}
      equations: []
      camera: "static"
      layers: [bg_solid, skia_rays, numpy_shading_frames, manim_trial_chart]
    engines: {primary: skia, secondary: [numpy, manim]}
    engine_reason: "A toy 2D path tracer in numpy (seeded) and thousands of ray segments drawn by skia; the chart in Manim."
    retention_device: "real-world sightings (R10); fast change (R5)"
    interrupt: "new objects: light paths"
    transition_out: "The dots gather back into the rectangle under the arch."
    sfx_music: "None."

  - id: ch6_s07
    chapter: uncertainty
    title: "Numbers you can trust"
    arc_step: takeaway
    duration_s: 16.58
    duration_source: audio
    goal: "One-line takeaway; the sixth node lights; the ring makes its sixth turn and is back at the start."
    narration: |
      Many random events add up to numbers you can trust, and sometimes those numbers are old friends, like pi.
      [pause 0.8s] And to get there, the sticks needed every branch we've seen. [pause 0.5s] So let's see how the
      branches fit together.
    pause_after_s: 3.0
    visual:
