    sfx_music: "None."

  - id: ch5_s06
    chapter: change
    title: "Adding up the rings"
    arc_step: formalization
    duration_s: 32.58
    duration_source: audio
    goal: "Integration: peel the disk into rings and stack them into a triangle whose area is pi r squared."
    narration: |
      Calculus also runs the other way. [pause 0.4s] Peel a whole disk into thin rings, unroll each one, and
      stack them, smallest on top. [pause 1.0s] They make a triangle as tall as the radius, with the
      circumference as its base. [pause 0.6s] Its area works out to exactly the area of the circle.
      [pause 0.8s] Adding up infinitely many thin pieces is called *integration*, and it undoes the derivative.
      [pause 0.6s] Archimedes proved the circle matches this triangle more than two thousand years ago.
    pause_after_s: 1.0
    visual:
      description: >
        The disk peels into 12 rings (alternating two tints of C.change); each unrolls and stacks into a
        stepped triangle. The rings double to 24, then 48, and the steps smooth into a triangle with base
        2 pi r and height r. The area formula writes, then the integral. Lower third 'Archimedes · c. 250 BC'.
      reveal_sequence:
        - {at_word: "other way", action: "the disk splits into 12 rings"}
        - {at_word: "unroll", action: "rings unroll and stack, smallest on top, 60 ms stagger"}
        - {at_word: "triangle", action: "steps smooth as rings double to 24, then 48"}
        - {at_word: "area", action: "1/2 x 2 pi r x r = pi r^2"}
        - {at_word: "integration", action: "the integral writes beside it"}
        - {at_word: "Archimedes", action: "lower third"}
      equations: ['\tfrac12\cdot2\pi r\cdot r=\pi r^2', '\int_0^r2\pi s\,ds=\pi r^2']
      camera: "static"
      layers: [bg_solid, manim_rings, manim_triangle, manim_equations, manim_lower_third]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Ring-to-strip maps computed in numpy; the stack is exact at each ring count."
    retention_device: "small payoff: the familiar formula earned (R13)"
    interrupt: "motion: rings peel and stack"
    transition_out: "The triangle folds back into the disk; a weather grid fades in."
    sfx_music: "None."

