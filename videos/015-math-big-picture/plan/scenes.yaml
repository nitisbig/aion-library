# plan/scenes.yaml: the source of truth for video 015 (Phase 1).
#
# Edit narration and visuals here, then regenerate everything that derives from it:
#   uv run python videos/015-math-big-picture/scripts/build_script.py
# That rewrites voiceover.md, script/narration_full.md, plan/scene_plan.md and fills duration_s (estimate).
# After voicing, scripts/timing.py replaces duration_s with the real value (duration_source: audio).
#
# Narration marks: [pause 0.8s] = extra silence inserted after the audio is generated (free to change);
# *word* = emphasis (a note for the read; stripped before TTS). Numbers and symbols are written as spoken.
# pause_after_s = silent beat after the scene (the picture carries it); chapter-final scenes hold for the map turn.
# reveal_sequence[].at_word must appear in the scene's narration, in order (checked by scripts/check_plan.py).
# Colors are theme roles (C.<role>): foundations, quantity, structure, space, change, uncertainty, circle, map_off,
# alert. Retention rule IDs (R1..R15) refer to plan/research_digest.md.

video:
  slug: 015-math-big-picture
  title: "Fundamentals of Math: The Big Picture"
  alt_titles:
    - "Math Explained From the Ground Up"
    - "What Math Really Is"
    - "Six Key Math Concepts and How They Connect"
  mode: concept overview with tutorial moments (intuition first, one worked example per chapter)
  audience: undergrads and curious learners; high-school algebra assumed, nothing more
  target_runtime_s: {min: 1320, goal: 1500, max: 1680}
  master_format: "3840x2160, 60 fps, SDR Rec.709 (draft 1920x1080, 30 fps); see plan/decisions.md D14"
  spine: >-
    One circle, seen through each branch of math in turn. A Map of Math (a ring of six nodes around the circle)
    turns 60 degrees at every chapter boundary and lights one node per chapter. The intro's promise (how do
    sticks on a floor know about pi?) is answered only when every branch has been seen.

pillars:   # ring_deg: position on the Map of Math ring at the start (Foundations at the bottom, then clockwise)
  - {id: foundations, name: Foundations, fields: logic and sets, color: foundations, glyph: '\in', ring_deg: 270}
  - {id: quantity, name: Quantity, fields: arithmetic and number theory, color: quantity, glyph: '\pi', ring_deg: 210}
  - {id: structure, name: Structure, fields: algebra, color: structure, glyph: 'e^{i\theta}', ring_deg: 150}
  - {id: space, name: Space, fields: geometry and topology, color: space, glyph: '\chi', ring_deg: 90}
  - {id: change, name: Change, fields: calculus and analysis, color: change, glyph: '\tfrac{d}{dr}', ring_deg: 30}
  - {id: uncertainty, name: Uncertainty, fields: probability and statistics, color: uncertainty, glyph: 'P', ring_deg: -30}

chapters:
  - id: cold
    title: Cold open
    target_s: 25
  - id: intro
    title: Intro
    target_s: 155
  - id: foundations
    title: Foundations
    pillar: foundations
    target_s: 180
    lens: "A circle is a set: every point one leash length from a post."
    takeaway: "Underneath all of math sit definitions: rules that say exactly what is in and what is out."
    concepts:
      - {concept: set, graphic: "sample points lit in or out by a rule", equation: '\{(x,y) : x^2+y^2=r^2\}', animation: "a scan line deciding membership"}
      - {concept: if and only if, graphic: "two arrows between 'on the circle' and 'passes the test'", equation: '\iff', animation: "each arrow lights in turn"}
      - {concept: converse, graphic: "a Reuleaux triangle under a level board", equation: '\text{constant width}\not\Rightarrow\text{circle}', animation: "rolling under the board"}
      - {concept: intersection and union, graphic: "two overlapping disks", equation: 'A\cap B,\ A\cup B', animation: "overlap, then everything, shading in"}
  - id: quantity
    title: Quantity
    pillar: quantity
    target_s: 180
    lens: "Measure the circle and a number appears that no fraction can name: pi."
    takeaway: "Numbers come in kinds, and even a simple circle holds lengths that no fraction can name."
    concepts:
      - {concept: pi, graphic: "a wheel one unit across rolled out on a number line", equation: '\pi=3.14159\ldots', animation: "one full roll"}
      - {concept: rational approximations, graphic: "fraction ticks closing in on pi", equation: '\tfrac{223}{71}<\pi<\tfrac{22}{7},\ \tfrac{355}{113}', animation: "log zooms"}
      - {concept: density of fractions, graphic: "ticks filling every stretch", equation: '\frac{p+q}{2}', animation: "midpoints dropping in"}
      - {concept: irrationality, graphic: "a square inside the unit circle", equation: 'p^2=2q^2', animation: "a derivation with old lines dimmed"}
  - id: structure
    title: Structure
    pillar: structure
    target_s: 195
    lens: "Turning a circle is an algebra: the turns form a group, and the turns are numbers."
    takeaway: "For a circle, the moves are turns, and the turns are numbers."
    concepts:
      - {concept: symmetry, graphic: "circle and square turning over their ghosts", equation: "", animation: "ghosts matching at every angle vs quarter turns"}
      - {concept: group, graphic: "a lock dial", equation: '30^\circ+45^\circ=75^\circ', animation: "arcs combining and undoing"}
      - {concept: i, graphic: "an arrow turning off the number line", equation: 'i^2=-1', animation: "two quarter turns make a half turn"}
      - {concept: e to the i theta, graphic: "a point on the unit circle", equation: 'e^{i\theta}=\cos\theta+i\sin\theta', animation: "the point sweeping the circle"}
      - {concept: multiplying adds angles, graphic: "60 and 30 degree arcs", equation: 'e^{i\pi/3}e^{i\pi/6}=e^{i\pi/2}=i', animation: "the expansion cancelling to i"}
  - id: space
    title: Space
    pillar: space
    target_s: 195
    lens: "Stretch the circle without tearing: to a topologist, a circle and a square are the same."
    takeaway: "A circle and a square disagree on every measurement, and agree on everything that survives a stretch."
    concepts:
      - {concept: topological equivalence, graphic: "circle morphing to square, triangle, loop", equation: "", animation: "continuous morphs; a pinch refused"}
      - {concept: holes, graphic: "loops on a circle, a disk and a torus", equation: "", animation: "loops shrinking or snagging"}
      - {concept: Euler characteristic, graphic: "polygon, cube and torus meshes", equation: '\chi=V-E+F', animation: "counters ticking as parts light"}
  - id: change
    title: Change
    pillar: change
    target_s: 195
    lens: "Grow the radius: the rate at which the area grows is the circumference."
    takeaway: "For a circle, the rate at which its area grows is its own edge."
    concepts:
      - {concept: derivative, graphic: "a curve straightening under zoom", equation: '\frac{dy}{dx}', animation: "zoom x100 to a tangent"}
      - {concept: e, graphic: "the exponential curve with tangents", equation: '\frac{d}{dx}e^x=e^x', animation: "slope tags equal to heights"}
      - {concept: area rate, graphic: "a thin ring unrolled", equation: 'dA\approx2\pi r\,dr', animation: "the ring unrolling"}
      - {concept: integration, graphic: "rings stacked into a triangle", equation: '\tfrac12\cdot2\pi r\cdot r=\pi r^2', animation: "peeling and stacking"}
  - id: uncertainty
    title: Uncertainty
    pillar: uncertainty
    target_s: 195
    lens: "Drop needles at random and recover pi from chance (Buffon's needle)."
    takeaway: "Many events add up to numbers you can trust, and sometimes those numbers are old friends, like pi."
    concepts:
      - {concept: law of large numbers, graphic: "running share of heads", equation: '\tfrac{\text{heads}}{\text{flips}}\to\tfrac12', animation: "the curve settling"}
      - {concept: geometric probability, graphic: "the angle-distance rectangle", equation: 'x\le\sin\theta', animation: "throws as dots under a sine arch"}
      - {concept: Buffon's needle, graphic: "the area under the sine arch", equation: 'P=\frac{1}{\pi}\int_0^{\pi}\sin\theta\,d\theta=\frac{2}{\pi}', animation: "the region shading"}
      - {concept: convergence, graphic: "estimate vs number of throws", equation: '\text{error}\sim1/\sqrt N', animation: "the band narrowing"}
  - id: connects
    title: How it connects
    target_s: 120
    takeaway: "Every lens saw something true, and each needed the others."
  - id: outro
    title: Outro
    target_s: 60

loops:   # R7: plant before paying; scripts/check_plan.py checks the order
  - id: L1
    promise: "Sticks on a floor give pi: why, and where is the circle?"
    planted_in: [in_s05, ch4_s01]
    paid_in: [ch6_s03, ch6_s04, ch6_s05, ch7_s03]
  - id: L2
    promise: "e, i and pi will meet in one line."
    planted_in: [ch3_s05]
    paid_in: [ch7_s02]
  - id: L3
    promise: "The map turns by the same amount every time we move on."
    planted_in: [in_s05]
    paid_in: [ch3_s03, ch7_s01]

map_edges:   # chords of the Map of Math; lit_in = the scene whose map update lights it
  - {a: foundations, b: quantity, idea: "proof by contradiction", lit_in: ch2_s06}
  - {a: foundations, b: structure, idea: "a group is a set with rules", lit_in: ch3_s07}
  - {a: quantity, b: structure, idea: "numbers that turn", lit_in: ch3_s07}
  - {a: structure, b: space, idea: "symmetry", lit_in: ch4_s07}
  - {a: quantity, b: space, idea: "counting holes", lit_in: ch4_s07}
  - {a: space, b: change, idea: "area and edge", lit_in: ch5_s07}
  - {a: quantity, b: change, idea: "limits", lit_in: ch5_s07}
  - {a: change, b: uncertainty, idea: "area under a curve", lit_in: ch6_s07}
  - {a: space, b: uncertainty, idea: "geometry of chance", lit_in: ch6_s07}
  - {a: quantity, b: uncertainty, idea: "pi from counting", lit_in: ch6_s07}
  - {a: foundations, b: space, idea: "definitions under everything", lit_in: ch7_s01}
  - {a: foundations, b: change, idea: "definitions under everything", lit_in: ch7_s01}
  - {a: foundations, b: uncertainty, idea: "definitions under everything", lit_in: ch7_s01}
  - {a: change, b: structure, idea: "growth meets turning", lit_in: ch7_s02}
  - {a: structure, b: uncertainty, idea: "every angle equally likely", lit_in: ch7_s03}

scenes:

# ======================================================================== COLD OPEN
# ======================================================================== COLD OPEN
  - id: co_s01
    chapter: cold
    title: "Sticks on a floor"
    arc_step: hook
    duration_s: 21.48
    duration_source: audio
    goal: "Pose the video's question in seconds: random sticks produce pi, and no circle is in sight."
    narration: |
      Throw a stick onto a wooden floor. [pause 0.5s] Then another, and another. [pause 1.0s]
      Count how often one lands across a crack between the boards, and from that count alone,
      you can work out *pi*. [pause 2.0s] There is no circle anywhere on this floor. [pause 0.6s]
      So where is it hiding?
    pause_after_s: 2.5
    cut_offset: 0.9          # the cold open keeps most of the pause: the circle draws and holds
    visual:
      description: >
        A wooden floor of boards across the frame. Needles (C.uncertainty) fall and settle, a few at first, then
        thousands as the rate ramps. A small readout (CM sans, tabular figures, HUD) tracks the estimate 2N/H,
        wobbling and then settling. The estimate locks and turns gold (C.quantity) as pi. On the last line every
        needle slides to the center keeping its angle; their tips trace THE circle (prism ring).
      reveal_sequence:
        - {at_word: "stick", action: "first needle falls and settles, 0.5s smooth"}
        - {at_word: "another", action: "two more needles land 0.3s apart"}
        - {at_word: "Count", action: "crossing needles brighten; readout 'throws / crossings' appears"}
        - {at_word: "work out", action: "rate ramps; estimate streams and narrows"}
        - {at_word: "pi", action: "estimate locks at 3.1416 and turns C.quantity"}
        - {at_word: "no circle", action: "camera pulls back 8%; floor dims to 40%"}
        - {at_word: "hiding", action: "needles slide to center keeping their angles, tips trace the circle"}
      equations: []
      camera: "static; pull-back 8% at 'no circle'"
      layers: [bg_solid, skia_floor, skia_needles, manim_hud_readout, manim_circle]
    engines: {primary: skia, secondary: [numpy, manim]}
    engine_reason: "Thousands of independent segments per frame: numpy samples them (seeded) and skia draws them."
    retention_device: "question first and the payoff shown unexplained (R1, R2); opens loop L1 (R7)"
    interrupt: question
    transition_out: "The circle stays where it formed; the intro opens on the worksheets."
    sfx_music: "Soft wooden tick per landing for the first needles, thinning into a quiet hiss; silence on 'hiding'."

# ======================================================================== INTRO
  - id: in_s01
    chapter: intro
    title: "Patterns, not chores"
    arc_step: hook
    duration_s: 27.35
    duration_source: audio
    goal: "Replace 'math = arithmetic drills' with 'math = the study of patterns', anchored on the circle."
    narration: |
      Most of us met math as a list of chores. [pause 0.4s] Add these. [pause 0.2s] Solve for x. [pause 0.2s]
      Show your work. [pause 1.0s] Mathematicians mean something else by the word. [pause 0.4s] They mean the
      study of patterns. [pause 0.4s] A ripple on a pond, the rim of a wheel and the face of a clock all share one
      shape. [pause 0.3s] Math studies that shape stripped down, until only the pattern is left.
    pause_after_s: 2.0
    visual:
      description: >
        The video's first frame. Worksheets of sums (CM roman, C.muted) hang at several depths (2.5D parallax) and
        the camera drifts through them while answers write themselves in. On 'something else' the sheets blow
        apart and their figures settle into a sunflower spiral of points (phyllotaxis, golden angle) on
        'patterns'. Three detailed objects then arrive side by side: a pond ripple (Taichi wave equation, crisp
        contours), a spoked wheel rolling on a scrolling road while a rim point traces a cycloid, and a clock face
        with ticking hands. On 'one shape' the circle in each is picked out in warm white; on 'stripped' the three
        circles fly to the centre and merge into THE circle while the objects dissolve. Title lockup in the pause.
      reveal_sequence:
        - {at_word: "chores", action: "worksheets at three depths fade in; the camera drifts through them"}
        - {at_word: "Solve", action: "answers write themselves in across the sheets, 0.25s apart"}
        - {at_word: "something else", action: "the sheets blow apart (parallax), their figures scatter as points"}
        - {at_word: "patterns", action: "the points settle into a sunflower spiral (golden angle)"}
        - {at_word: "ripple", action: "pond tile: wave-equation ripple spreading from a drop (FieldLayer, contours)"}
        - {at_word: "wheel", action: "wheel tile: spoked wheel rolls, road scrolls, a rim point traces a cycloid"}
        - {at_word: "clock", action: "clock tile: dial, numerals, ticking hands"}
        - {at_word: "one shape", action: "the circle in each object is drawn over it in C.circle"}
        - {at_word: "stripped", action: "the three circles fly to the centre and merge into THE circle; objects dissolve, 1.4s"}
      equations: []
      camera: "slow push-in 5% across the scene"
      layers: [bg_solid, manim_sheets_x3_parallax, points_spiral, field_ripple, manim_wheel, manim_clock, manim_circle, manim_title]
    engines: {primary: manim, secondary: [taichi, points]}
    engine_reason: "Type, line art and the merge in Manim; the ripple is the real damped wave equation (Taichi Wave2D) shown as a contoured field; the spiral is a points layer (R15)."
    retention_device: "wrong idea of math first, then the reframe (R4); three objects become one circle (R8)"
    interrupt: "new objects: ripple, wheel, clock"
    transition_out: "Title lockup fades on the silent beat; the circle stays."
    sfx_music: "Quiet. Optional low pad, 28 dB under the voice, under the title lockup only."

  - id: in_s02
    chapter: intro
    title: "Pieces without the map"
    arc_step: intuition
    duration_s: 30.06
    duration_source: audio
    goal: "Name the problem the video solves: people only ever see isolated pieces."
    narration: |
      In school, math arrives one piece at a time. [pause 0.3s] A year of algebra, a year of geometry, a little
      statistics near the end. [pause 0.8s] Each piece makes sense on its own, but nobody shows how they fit
      together. [pause 0.6s] It's like learning a city one street at a time, without ever seeing the map.
      [pause 0.8s] With the map, a new idea stops being a stray fact. [pause 0.3s] It becomes a place you can
      find again, next to things you already know.
    pause_after_s: 1.2
    visual:
      description: >
        Small isolated fragments appear around the circle, each in its pillar color: the quadratic formula, a
        triangle with angles, a derivative, a bell curve, a pair of overlapping sets, a list of primes. They
        drift apart with dark space between them. A thin line tries to join two of them and retracts. The
        fragments shrink into street segments of a city grid; the camera pulls back and the streets turn out
        to be the faint chords of the Map of Math ring around the circle.
      reveal_sequence:
        - {at_word: "one piece", action: "fragments pop in one by one, stagger 120ms"}
        - {at_word: "makes sense", action: "fragments drift apart"}
        - {at_word: "fit together", action: "a thin line reaches between two fragments and retracts"}
        - {at_word: "city", action: "fragments shrink into street segments"}
        - {at_word: "map", action: "camera pulls back 20%, 2.0s easy_ease: the streets are the dim map's chords"}
        - {at_word: "stray fact", action: "one fragment (the derivative) slides onto its street and settles there"}
      equations: ['x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}', '\frac{d}{dx}x^2=2x']
      camera: "pull-back 20% on 'map'"
      layers: [bg_solid, manim_fragments, manim_streets, manim_circle, manim_map_ghost]
    engines: {primary: manim}
    engine_reason: "TeX fragments and line-art streets morphing into graph edges (R15)."
    retention_device: "concrete analogy, a city learned street by street (R10); first glimpse of the map (R2)"
    interrupt: "scale: pull-back from fragments to the whole map"
    transition_out: "The dim map stays; the camera holds the wide view."
    sfx_music: "None; a faint air movement on the pull-back."

  - id: in_s03
    chapter: intro
    title: "Math at work"
    arc_step: sighting
    duration_s: 23.94
    duration_source: audio
    goal: "Four 3-5 second glimpses of the pillars at work, so the map feels worth learning."
    narration: |
      And the map is worth seeing, because its pieces are everywhere. [pause 0.4s] Your phone finds you where
      circles of distance around several satellites meet. [pause 0.6s] A spam filter weighs the odds that a
      message is junk. [pause 0.6s] Every secure payment leans on the arithmetic of whole numbers. [pause 0.6s]
      And spacecraft reach other planets because calculus tells us where to aim.
    pause_after_s: 1.0
    visual:
      description: >
        Four crisp vignettes, each about four seconds, each pushed out of the node it belongs to. Satellites
        with distance circles that grow and meet at one point (tag 'geometry', C.space). A scatter of two kinds
        of messages with a boundary line sweeping into place over soft probability shading (tags 'probability',
        'linear algebra'). A seventeen-hour clock dial with powers of three hopping around it (tag 'number
        theory', C.quantity). A transfer ellipse between two circular orbits with a tangent velocity arrow (tag
        'calculus', C.change).
      reveal_sequence:
        - {at_word: "phone", action: "GPS vignette: circles grow and meet at one point"}
        - {at_word: "spam", action: "boundary line sweeps into place over the scatter"}
        - {at_word: "secure", action: "powers of 3 mod 17 hop around the dial"}
        - {at_word: "spacecraft", action: "transfer ellipse draws, velocity arrow rides it"}
      equations: ['3^k \bmod 17']
      camera: "four quick push-ins (0.6s) toward each vignette's node"
      layers: [bg_solid, manim_glimpses, manim_tags_hud]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Small diagrams computed with numpy (circle intersections, a fitted boundary, modular powers, a Hohmann ellipse), drawn crisply in Manim."
    retention_device: "rapid change every ~4 s (R5); real uses before any theory (R10)"
    interrupt: "pace: four short vignettes"
    transition_out: "The last vignette shrinks into its node; the dim map returns."
    sfx_music: "A light tick on each cut."

  - id: in_s04
    chapter: intro
    title: "The plan"
    arc_step: preview
    duration_s: 21.00
    duration_source: audio
    goal: "Preview the chapters as the Map of Math assembling, in one spoken sentence."
    narration: |
      So, the plan. [pause 0.3s] We'll take one circle and look at it through each major branch of math
      in turn: what it is, how big it is, how it turns, what shape it really has, how it grows, and what it has
      to do with chance. [pause 1.2s] Each look lights up one part of the map.
    pause_after_s: 1.5
    visual:
      description: >
        The circle brightens at the center. Six nodes appear on a ring around it, each on its clause: a small
        circle outline in its pillar color with its glyph inside and its name in small caps outside.
        Foundations sits at the bottom, then clockwise Quantity, Structure, Space, Change, Uncertainty. On the
        last line all six pulse once and settle to unlit outlines (C.map_off fill).
      reveal_sequence:
        - {at_word: "one circle", action: "circle brightens"}
        - {at_word: "what it is", action: "Foundations node (glyph in) appears at the bottom"}
        - {at_word: "how big", action: "Quantity node (pi)"}
        - {at_word: "how it turns", action: "Structure node (e^{i theta})"}
        - {at_word: "what shape", action: "Space node (chi)"}
        - {at_word: "how it grows", action: "Change node (d/dr)"}
        - {at_word: "chance", action: "Uncertainty node (P)"}
        - {at_word: "lights up", action: "all six pulse once, settle unlit"}
      equations: []
      camera: "static, centered on the ring"
      layers: [bg_solid, manim_map_ring, manim_circle]
    engines: {primary: manim}
    engine_reason: "A six-node graph with type; graph layout belongs to Manim (ST); the Classic look has no glow, so no shader is needed."
    retention_device: "the whole map in one sentence (R3); the map becomes the progress indicator (R6)"
    interrupt: "new object: the Map of Math"
    transition_out: "Hold on the ring."
    sfx_music: "Six soft ticks, one per node."

  - id: in_s05
    chapter: intro
    title: "A promise, and the first turn"
    arc_step: map_turn
    duration_s: 31.51
    duration_source: audio
    goal: "Plant the open loops (the sticks, the turning map) and ask the first chapter's question."
    narration: |
      Before we start, a promise. [pause 0.4s] By the end, you'll see exactly why those sticks on the floor
      found pi, and why the answer needs every part of this map at once. [pause 0.8s] And one small thing to
      watch for. [pause 0.3s] Each time we move on, the whole map will turn by the same amount. [pause 0.4s]
      That turning is math too, and we'll come back to it. [pause 1.2s] We start where all of math starts:
      with a definition. [pause 0.5s] What, exactly, is a circle?
    pause_after_s: 1.5
    visual:
      description: >
        A miniature of the needle floor flickers inside the Uncertainty node. On 'every part' faint chords flash
        between all the nodes and fade. On 'turn' the ring makes the signature move: it turns 60 degrees and
        back (preview). On 'definition' the Foundations node, already at the bottom, expands into the chapter
        card: 'Foundations' in small caps (80 px), 'logic and sets' in CM sans, glyph in C.foundations. On the
        question the card shrinks away and the circle is alone again.
      reveal_sequence:
        - {at_word: "sticks", action: "mini needle floor flickers in the Uncertainty node"}
        - {at_word: "every part", action: "all chords flash faintly, then fade"}
        - {at_word: "turn", action: "ring turns 60 degrees and back, 1.2s easy_ease each way"}
        - {at_word: "come back", action: "a small C.structure arc marks the turn angle, fades"}
        - {at_word: "definition", action: "camera pushes into Foundations; node opens into the chapter card"}
        - {at_word: "circle", action: "card shrinks away; the circle alone, centered"}
      equations: []
      camera: "static; push-in 1.2x into the Foundations node on 'definition', 1.5s easy_ease"
      layers: [bg_solid, manim_map_ring, skia_mini_needles, manim_chapter_card, manim_circle]
    engines: {primary: manim, secondary: [skia]}
    engine_reason: "Map and card in Manim; the needle floor is the seeded skia layer (kit)."
    retention_device: "opens L1 and L3 as tracked promises (R7); chapter question first (R1)"
    interrupt: "motion: first turn of the ring; chapter card"
    transition_out: "Signature chapter transition: the Foundations node opens into Chapter 1."
    map_update: {lights: [], edges: [], card: foundations}
    sfx_music: "A soft tone under the chapter card."

# ======================================================================== CH1 FOUNDATIONS
  - id: ch1_s01
    chapter: foundations
    title: "The tight leash"
    arc_step: hook
    duration_s: 26.93
    duration_source: audio
    goal: "Turn 'a round shape' into 'a rule you can check' with a human example."
    narration: |
      Picture a dog tied to a post. [pause 0.4s] When it pulls the leash tight, it can stand in lots of places,
      but not just anywhere. [pause 0.6s] Every spot it can reach with the leash tight is exactly one leash
      length from the post. [pause 1.0s] Gather up all of those spots, and they make a circle. [pause 0.8s] That
      shift, from a shape we recognize to a rule we can check, is the first idea of *foundations*.
    pause_after_s: 1.0
    visual:
      description: >
        A small cross marks the post at the center. A dot (C.foundations, tagged 'dog' in CM sans) sits at the
