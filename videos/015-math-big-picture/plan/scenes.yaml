# ======================================================================== CH5 CHANGE
  - id: ch5_s01
    chapter: change
    title: "A ripple"
    arc_step: hook
    duration_s: 28.90
    duration_source: audio
    goal: "Wrong intuition first: the radius grows steadily, the area does not. Calculus asks how fast, at an instant."
    narration: |
      Drop a stone into still water. [pause 1.0s] The ripple spreads as a circle, and its radius grows at a
      steady pace. [pause 0.6s] You'd expect the area inside to grow steadily too. [pause 1.0s] It doesn't.
      [pause 0.3s] Every second, the ripple sweeps over more new water than the second before. [pause 0.8s]
      Asking how fast something is changing, at a single instant, is the question behind *calculus*.
    pause_after_s: 1.0
    visual:
      description: >
        The Change card shrinks away. A Taichi Wave2D height field, drawn as crisp contour lines (no glow): a
        stone drops at the center and a ring spreads. The leading crest is traced by the circle (C.circle). A
        radius readout ticks evenly; beside it, bars of 'new water each second' grow 1, 3, 5, 7 (times pi,
        C.change), so the area's growth visibly speeds up.
      reveal_sequence:
        - {at_word: "stone", action: "the stone drops; first ring"}
        - {at_word: "circle", action: "the leading crest is traced by the circle"}
        - {at_word: "steady", action: "radius readout ticks evenly"}
        - {at_word: "expect", action: "a straight dashed guess line for the area"}
        - {at_word: "doesn't", action: "bars 1, 3, 5, 7 pi grow and leave the guess line behind"}
        - {at_word: "calculus", action: "key word 'calculus' in small caps"}
      equations: ['A=\pi r^2', '\Delta A=\pi(2t+1)']
      camera: "static, slightly top-down feel from contour spacing only"
      layers: [bg_solid, taichi_wave_field, manim_circle, manim_readouts, manim_bars]
    engines: {primary: taichi, secondary: [manim]}
    engine_reason: "A real wave on water is a PDE: Taichi Wave2D baked once, drawn as a FieldLayer with contours; readouts in Manim (R15)."
    retention_device: "wrong intuition first (R4); new engine and texture (R9)"
    interrupt: "new engine: a simulated wave"
    transition_out: "The water stills; one contour becomes a road on a time axis."
    sfx_music: "One soft water drop at the start; nothing after."

  - id: ch5_s02
    chapter: change
    title: "Zoom until it's straight"
    arc_step: intuition
    duration_s: 28.57
    duration_source: audio
    goal: "The derivative: zoom into a smooth curve until it is straight; its steepness is the rate right now (speedometer)."
    narration: |
      A car's speedometer answers that kind of question. [pause 0.4s] It doesn't show your average over the
      trip, but how fast you're going right now. [pause 0.8s] To make right now precise, zoom in on a smooth
      curve until it looks like a straight line. [pause 0.6s] The steepness of that line is the *derivative*:
      the rate of change at a single point. [pause 1.0s] Isaac Newton and Gottfried Leibniz built calculus on
      this idea in the late sixteen hundreds.
    pause_after_s: 1.0
    visual:
      description: >
        A distance-time curve of a short drive (C.change) with a speedometer dial (face C.circle, needle C.change)
        tied to a point moving along it. An average-speed chord appears and is set aside. The camera zooms x10,
        then x100 at one point; the curve straightens onto its tangent. A rise-over-run triangle reads the slope,
        matching the dial. Lower third 'I. Newton · G. W. Leibniz · 1680s'.
      reveal_sequence:
        - {at_word: "speedometer", action: "the drive curve and the dial, point moving"}
        - {at_word: "average", action: "average chord across the trip, then dimmed"}
        - {at_word: "zoom", action: "zoom x10, then x100 at one point"}
        - {at_word: "straight", action: "curve and tangent overlap"}
        - {at_word: "derivative", action: "rise-over-run triangle; slope equals the dial reading"}
        - {at_word: "Newton", action: "lower third"}
      equations: ['\frac{dy}{dx}=\lim_{h\to0}\frac{y(x+h)-y(x)}{h}']
      camera: "log zoom x100 into one point, 2.5 s easy_ease"
      layers: [bg_solid, manim_axes, manim_curve, manim_dial, manim_lower_third]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "The curve is re-drawn per frame at the zoom (m.redraw) so it stays crisp at x100; slopes computed in numpy."
    retention_device: "human example, a speedometer (R10); scale change (R5)"
    interrupt: "scale: x100 zoom"
    transition_out: "Zoom back out; the curve is replaced by the exponential."
    sfx_music: "None."

  - id: ch5_s03
    chapter: change
    title: "The curve that is its own slope"
    arc_step: intuition
    duration_s: 25.79
    duration_source: audio
    goal: "Meet e: the curve whose steepness equals its height; compound interest as the human example."
    narration: |
      One curve has a special property: at every point, its steepness matches its height. [pause 0.8s] It grows
      the way savings do when interest keeps compounding: the more there is, the faster it grows. [pause 0.6s]
      Its heights are powers of one particular number, about two point seven one eight, called *e*. [pause 1.0s] This is
      the same e that Euler used to describe turns.
    pause_after_s: 1.0
    visual:
      description: >
        y = e^x (C.change) on Classic axes. At x = 0, 1, 1.5 a tangent segment and a height bar appear side by
        side with equal tags (1.00, 2.72, 4.48). A small savings card compounds one year at 100 percent:
        yearly 2.00, monthly 2.61, daily 2.71, continuous 2.71828. The glyph e flies to the e, i, pi tracker.
      reveal_sequence:
        - {at_word: "steepness", action: "tangent and height bar pairs with equal tags"}
        - {at_word: "savings", action: "savings card compounds: yearly, monthly, daily"}
        - {at_word: "two point seven", action: "continuous: 2.71828..."}
        - {at_word: "e", action: "e^x labels the curve"}
        - {at_word: "Euler", action: "glyph e flies to the e, i, pi tracker"}
      equations: ['\frac{d}{dx}e^x=e^x', '\left(1+\tfrac1n\right)^n\to e=2.71828\ldots']
      camera: "static"
      layers: [bg_solid, manim_axes, manim_curve, manim_tangents, manim_savings_card, manim_loop_tracker]
    engines: {primary: manim}
    engine_reason: "Exact tangents and compound values computed and set as TeX."
    retention_device: "callback to Ch3 and loop L2 (R7); human example (R10)"
    interrupt: "new object: the exponential curve"
    transition_out: "The axes fade; the circle returns at the center."
    sfx_music: "None."

  - id: ch5_s04
    chapter: change
    title: "Growing the radius"
    arc_step: formalization
    duration_s: 24.41
    duration_source: audio
    goal: "dA is a thin ring about circumference times dr, so the derivative of the area is the circumference."
    narration: |
      Back to the circle. [pause 0.3s] Grow its radius by a tiny amount, and the new area is a thin ring around
      the edge. [pause 0.6s] Cut the ring and unroll it, and it's almost a rectangle: as long as the
      circumference, and as thick as the nudge. [pause 1.0s] So the area grows at a rate equal to the length of
      the edge. [pause 0.6s] The derivative of the circle's area is its circumference.
    pause_after_s: 1.0
    visual:
      description: >
        The circle with a radius tick r. It grows by dr; the new thin ring fills C.change. The ring is cut at the
        top and unrolls into a strip of length 2 pi r and height dr (computed; a slight trapezoid is visible).
        The approximation writes, then the derivative statement.
      reveal_sequence:
        - {at_word: "circle", action: "the circle with a radius tick"}
        - {at_word: "Grow", action: "radius grows by dr; thin ring fills"}
        - {at_word: "unroll", action: "ring cut and unrolled into a strip"}
        - {at_word: "circumference", action: "strip tagged 2 pi r by dr"}
        - {at_word: "rate", action: "dA = 2 pi r dr writes"}
        - {at_word: "derivative", action: "d/dr of pi r^2 = 2 pi r"}
      equations: ['dA\approx2\pi r\,dr', '\frac{d}{dr}\left(\pi r^2\right)=2\pi r']
      camera: "static"
      layers: [bg_solid, manim_circle, manim_ring, manim_strip, manim_equations]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "The unrolling ring is an exact annulus-to-trapezoid map computed per frame (m.redraw)."
    retention_device: "continuity: the same circle (R8); picture before symbol (R10)"
    interrupt: "motion: a ring unrolls"
    transition_out: "The circle becomes a pizza."
    sfx_music: "None."

  - id: ch5_s05
    chapter: change
    title: "A slightly bigger pizza"
    arc_step: worked_example
    duration_s: 31.16
    duration_source: audio
    goal: "Worked example: r 10 to 10.1 cm; edge times nudge 6.28 vs exact 6.31 cm squared; the error shrinks as the nudge squared."
    narration: |
      Try it on a pizza ten centimeters in radius. [pause 0.3s] Stretch the dough until the radius grows by one
      millimeter. [pause 0.3s] How much more pizza is that? [pause 1.5s] The edge times the nudge says about six
      point two eight square centimeters. [pause 0.6s] Working it out exactly gives six point three one.
      [pause 0.8s] The small difference is there because the ring's outer edge is a little longer than its inner
      edge. [pause 0.5s] Make the nudge ten times smaller, and the difference gets a hundred times smaller.
    pause_after_s: 1.0
    visual:
      description: >
        A flat pizza disk (crust ring in C.change, no photo) with a radius tick '10 cm'. The 1 mm ring is drawn
        exaggerated, tagged 'not to scale'. The estimate and the exact value write as two rows; their difference
        appears as a third. A two-row table compares nudges of 0.1 cm and 0.01 cm: estimate, exact, difference.
      reveal_sequence:
        - {at_word: "pizza", action: "pizza disk, radius tick 10 cm"}
        - {at_word: "millimeter", action: "exaggerated ring, tag 'not to scale'"}
        - {at_word: "How much", action: "predict beat"}
        - {at_word: "edge times", action: "estimate row: 2 pi x 10 x 0.1 = 6.28"}
        - {at_word: "exactly", action: "exact row: pi (10.1^2 - 10^2) = 6.31"}
        - {at_word: "outer edge", action: "outer and inner edges highlight; difference pi (0.1)^2 = 0.03"}
        - {at_word: "ten times smaller", action: "second table row for 0.01 cm: difference 0.0003"}
      equations: ['2\pi\cdot10\cdot0.1\approx6.28', '\pi\left(10.1^2-10^2\right)\approx6.31', '\pi\,(dr)^2']
      camera: "static"
      layers: [bg_solid, manim_pizza, manim_ring, manim_table]
    engines: {primary: manim}
