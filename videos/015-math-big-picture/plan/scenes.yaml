  - id: ch1_s02
    chapter: foundations
    title: "A set is a rule"
    arc_step: intuition
    duration_s: 26.35
    duration_source: audio
    goal: "A set is everything a rule lets in; change the rule, change the set."
    narration: |
      Mathematicians call a collection like this a *set*. [pause 0.4s] A set is defined by a rule, and the rule
      decides, for every possible point, whether it's in or out. [pause 0.8s] There's no partly in. [pause 0.6s]
      Change the rule, and you change the set. [pause 0.3s] Let the leash go slack, and the set fills in to a
      whole disk. [pause 1.0s] The circle is only the points that are *exactly* one leash length away.
    pause_after_s: 1.0
    visual:
      description: >
        Braces close around the circle's points in C.foundations. A scan line sweeps the plane through a seeded
        grid of sample points; each flashes C.foundations (in) or dims (out). An inset zoom shows a point right
        at the edge snapping to one side. The leash goes slack, the dog roams inside, and the disk fills at 20%
        C.foundations. On 'exactly' the fill drains, leaving only the ring of points.
      reveal_sequence:
        - {at_word: "set", action: "braces close around the circle's points"}
        - {at_word: "every possible", action: "scan line sweeps; points light in or dim out"}
        - {at_word: "partly", action: "inset zoom: an edge point snaps in or out"}
        - {at_word: "slack", action: "leash slackens; disk fills at 20%"}
        - {at_word: "exactly", action: "fill drains; only the circle's points remain"}
      equations: []
      camera: "static"
      layers: [bg_solid, manim_points, manim_disk_fill, manim_circle, manim_braces]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "A seeded grid of sample points tested with numpy, drawn as Manim dots."
    retention_device: "one color means 'in the set' for the whole video (R11)"
    interrupt: "color: membership lights"
    transition_out: "A coordinate grid fades in under the circle."
    sfx_music: "None."

  - id: ch1_s03
    chapter: foundations
    title: "From rule to equation"
    arc_step: formalization
    duration_s: 37.11
    duration_source: audio
    goal: "Pythagoras turns 'one leash length away' into a test on coordinates; the circle as a set; if and only if."
    narration: |
      To make the rule exact, put the post at the center of a grid. [pause 0.4s] Every point on the circle is
      the corner of a right triangle whose longest side is the leash. [pause 0.3s] Pythagoras turns *one leash length
      away* into a test you can run on any point's coordinates. [pause 1.2s] Wrap that test in braces, and the
      circle is written as a set. [pause 0.5s] Georg Cantor started the study of sets in the eighteen seventies,
      and sets became the ground floor of mathematics. [pause 0.6s] A point belongs to this one *if and only if*
      it passes the test. [pause 0.4s] The promise runs in both directions.
    pause_after_s: 1.2
    visual:
      description: >
        The Classic grid fades in with the post at the origin. A right triangle drops from a point on the
        circle: the legs run along and up, the hypotenuse is the leash. The test writes term by term, each term
        colored like its side. It slides inside braces (C.foundations). Lower third: 'G. Cantor · 1874' in small
        caps. Two arrows between the key words 'on the circle' and 'passes the test' light in turn.
      reveal_sequence:
        - {at_word: "grid", action: "Classic grid fades in, post at the origin"}
        - {at_word: "right triangle", action: "triangle drops from a point on the circle"}
        - {at_word: "Pythagoras", action: "x^2 + y^2 = r^2 writes term by term"}
        - {at_word: "braces", action: "equation slides into set-builder braces"}
        - {at_word: "Cantor", action: "lower third 'G. Cantor · 1874'"}
        - {at_word: "if and only if", action: "right arrow lights"}
        - {at_word: "both directions", action: "left arrow lights"}
      equations: ['x^2+y^2=r^2', '\{(x,y)\ :\ x^2+y^2=r^2\}', '\text{on the circle}\iff x^2+y^2=r^2']
      camera: "slow push-in 5%"
      layers: [bg_solid, manim_grid, manim_triangle, manim_equations, manim_lower_third]
    engines: {primary: manim}
    engine_reason: "Gradual TeX reveal colored to match the triangle's sides (TransformMatchingTex)."
    retention_device: "picture before symbol (R10); terms colored like their sides (R11)"
    interrupt: "mode: picture becomes an equation"
    transition_out: "Equation dims to the corner; the radius becomes 5 for the worked example."
    sfx_music: "None."

  - id: ch1_s04
    chapter: foundations
    title: "Is it on the circle?"
    arc_step: worked_example
    duration_s: 29.93
    duration_source: audio
    goal: "Run the test on three points and see one rule split the plane into three sets."
    narration: |
      Try it with a leash five units long. [pause 0.3s] Which of these points can the dog reach with the leash
      tight? [pause 2.0s] The first passes the test exactly, so it sits on the circle. [pause 0.8s] The second
      comes up short, so it's inside. [pause 0.5s] The third overshoots: outside. [pause 1.0s] One test sorts every point in the plane into
      exactly one of three sets, with nothing left over and nothing counted twice.
    pause_after_s: 1.2
    visual:
      description: >
        Circle of radius 5 on the grid. Three points with coordinate labels: (3,4), (2,4), (4,4), white. During
        the 2 s predict beat nothing else moves. Each test computes beside its point and the point takes its
        verdict: on the circle (C.foundations), inside, outside. Then the plane splits into three regions with
        key words 'inside', 'on', 'outside'; they pulse in turn.
      reveal_sequence:
        - {at_word: "five units", action: "radius 5 circle, radius tick '5'"}
        - {at_word: "Which", action: "three labelled points appear; predict beat"}
        - {at_word: "first", action: "3^2+4^2=25 computes; point lands on the circle"}
        - {at_word: "second", action: "2^2+4^2=20<25; point marked inside"}
        - {at_word: "third", action: "4^2+4^2=32>25; point marked outside"}
        - {at_word: "sorts", action: "plane splits into inside / on / outside"}
        - {at_word: "left over", action: "the three regions pulse in turn"}
      equations: ['3^2+4^2=25', '2^2+4^2=20<25', '4^2+4^2=32>25']
      camera: "static"
      layers: [bg_solid, manim_grid, manim_points, manim_equations, manim_regions]
    engines: {primary: manim}
    engine_reason: "Exact arithmetic set as TeX beside each point."
    retention_device: "pause and predict, 2 s (R12); small payoff (R13)"
