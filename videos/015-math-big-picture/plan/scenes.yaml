    transition_out: "The camera moves into the center of the ring, onto the unit circle."
    map_update: {lights: [], edges: [[foundations, space], [foundations, change], [foundations, uncertainty]], pulse: [[change, uncertainty], [quantity, structure], [structure, space]]}
