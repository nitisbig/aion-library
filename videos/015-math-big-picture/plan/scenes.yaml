      repeating loop. [pause 0.8s] In practice, we never need them all. [pause 0.3s] Navigators at NASA use
      fifteen decimal places to steer spacecraft between planets. [pause 0.6s] Forty places would give the
      distance around the visible universe to within the width of an atom.
    pause_after_s: 1.0
    visual:
      description: >
        Lower third 'J. H. Lambert · 1761'. Pi's digits stream to the right in tabular CM roman, a scanning
        bracket finding no repeat. The first fifteen decimals highlight (C.quantity) beside a thin transfer
        orbit between two planet dots. The camera pulls back through scales (planet, solar system, a circle
        labelled 'visible universe'); forty digits ride along, and an inset shows a gap the size of an atom.
      reveal_sequence:
        - {at_word: "Lambert", action: "lower third; digits begin streaming"}
        - {at_word: "repeating", action: "a bracket scans for a repeat and finds none"}
        - {at_word: "fifteen", action: "first 15 decimals highlight; transfer orbit draws"}
        - {at_word: "Forty", action: "pull back to a 'visible universe' circle; 40 digits"}
        - {at_word: "atom", action: "inset: an atom-sized gap"}
      equations: ['\pi=3.141592653589793\ldots']
      camera: "pull-back across scales, 3.0 s easy_ease"
      layers: [bg_solid, manim_digits, manim_orbit, manim_scale_circles, manim_lower_third]
    engines: {primary: manim}
    engine_reason: "Typography and simple orbit lines; the scale pull-back is a camera move over crisp vectors."
    retention_device: "real-world sighting (R10); scale change (R5)"
    interrupt: "scale: pull-back to the visible universe"
    transition_out: "Everything shrinks back to the wheel and the square for the callback."
    sfx_music: "None."

  - id: ch2_s06
    chapter: quantity
    title: "Kinds of number, and how we knew"
    arc_step: takeaway
    duration_s: 18.62
    duration_source: audio
    goal: "One-line takeaway; proof by contradiction links Quantity to Foundations; second node lights."
    narration: |
      Numbers come in kinds, and even a simple circle holds lengths that no fraction can name. [pause 0.8s]
      And notice how we showed it: assume the opposite, follow the rules, and arrive at something impossible.
      [pause 0.5s] That move comes straight from foundations.
    pause_after_s: 3.0
    visual:
      description: >
        Hero callback: the rolling wheel and the square in the circle side by side, then both shrink into the
        Quantity node, which fills gold. The chord from Foundations to Quantity draws with the key word
        'contradiction' riding it for one second. In the silent beat the ring turns 60 degrees and Structure
        arrives at the bottom and opens into the Chapter 3 card.
      reveal_sequence:
        - {at_word: "kinds", action: "hero callback: wheel and inscribed square"}
        - {at_word: "assume", action: "the three proof steps flash as key words: assume, follow, impossible"}
        - {at_word: "foundations", action: "Quantity node fills; chord F-Q draws; ring turns in the silent beat"}
      equations: []
      camera: "pull back to the full map during the turn"
      layers: [bg_solid, manim_hero_callback, manim_map_ring]
    engines: {primary: manim}
    engine_reason: "Map node, chord and the ring turn in Manim."
    retention_device: "one-sentence takeaway over a visual callback (R13); progress (R6)"
    interrupt: "scale: back out to the map"
    transition_out: "Signature map turn: Structure opens into Chapter 3."
    map_update: {lights: [quantity], edges: [[foundations, quantity]], card: structure}
    sfx_music: "A soft tone as the node lights."

# ======================================================================== CH3 STRUCTURE
  - id: ch3_s01
    chapter: structure
    title: "What stays the same"
    arc_step: hook
    duration_s: 27.12
    duration_source: audio
    goal: "Symmetry is a move that leaves a shape looking the same: the square has four turns, the circle every angle."
    narration: |
      Turn a square a little, and you can tell it moved. [pause 0.5s] Turn it a quarter of the way around, and
      it looks exactly as it did before. [pause 0.8s] Now turn the circle. [pause 0.3s] Turn it by any amount at
      all, and nothing seems to change. [pause 1.0s] A move that leaves a shape looking the same is called a
      *symmetry*. [pause 0.4s] The square has four turning symmetries. [pause 0.3s] The circle has one for every
      angle.
    pause_after_s: 1.0
    visual:
      description: >
        The Structure card shrinks away. A square (C.structure) beside the circle (C.circle), each over a dashed
        ghost of its starting position (C.map_off). The square turns 20 degrees and visibly misses its ghost, then
        reaches 90 and snaps onto it (a small tick). The circle turns continuously, a rim dot proving it moves,
        and always matches its ghost. The square's four turns appear as four small arcs; the circle fills with a
        fan of arcs at every angle.
      reveal_sequence:
        - {at_word: "a little", action: "square turns 20 degrees; mismatch with its ghost"}
        - {at_word: "quarter", action: "square reaches 90 degrees and snaps onto its ghost"}
        - {at_word: "turn the circle", action: "circle turns continuously; rim dot moves; ghost always matches"}
        - {at_word: "symmetry", action: "key word 'symmetry' in small caps"}
        - {at_word: "four", action: "four quarter-turn arcs on the square"}
        - {at_word: "every", action: "a fan of arcs at every angle fills the circle"}
      equations: []
      camera: "static"
      layers: [bg_solid, manim_square, manim_circle, manim_ghosts, manim_arcs]
    engines: {primary: manim}
    engine_reason: "Rigid rotations of vector shapes, driven by Tracks."
    retention_device: "wrong intuition (symmetry as shape, not moves) set up for the next scene (R4)"
    interrupt: "new objects: ghosts and turning shapes"
    transition_out: "The circle becomes the dial of a combination lock (R8)."
    sfx_music: "A faint click when the square matches."

  - id: ch3_s02
    chapter: structure
    title: "Moves you can combine"
    arc_step: intuition
    duration_s: 29.72
    duration_source: audio
    goal: "A group is a set of moves you can combine and undo, including doing nothing (lock dial)."
    narration: |
      Mathematicians study the moves themselves. [pause 0.4s] Think of the dial on a combination lock.
      [pause 0.3s] Turn it thirty degrees, then forty-five more, and together that's one turn of seventy-five.
      [pause 0.6s] Any turn can be undone by turning back, and leaving the dial alone counts as a turn of zero.
      [pause 1.0s] Moves you can combine and undo, including the move that does nothing, form what's called a
      *group*. [pause 0.5s] Groups are one of the basic objects of *algebra*.
    pause_after_s: 1.0
    visual:
      description: >
        The circle gains forty ticks and a pointer: a lock dial. A 30 degree arc (C.structure) sweeps, then a
        45 degree arc; they merge into one 75 degree arc while the sum assembles. A reverse arc returns the
        pointer to zero; then the pointer rests with a '0' tag. Key words 'combine', 'undo', 'do nothing' line up
        and fold into the small-caps word 'group'.
      reveal_sequence:
        - {at_word: "lock", action: "the circle becomes a dial: forty ticks and a pointer"}
        - {at_word: "thirty", action: "30 degree arc sweeps"}
        - {at_word: "forty-five", action: "45 degree arc follows"}
        - {at_word: "seventy-five", action: "arcs merge into 75; equation assembles"}
        - {at_word: "undone", action: "reverse arc to zero"}
        - {at_word: "alone", action: "pointer rests, tag '0'"}
        - {at_word: "group", action: "the three key words fold into 'group'"}
      equations: ['30^\circ+45^\circ=75^\circ', '75^\circ+(-75^\circ)=0^\circ']
      camera: "static"
      layers: [bg_solid, manim_dial, manim_arcs, manim_equations, manim_tags]
    engines: {primary: manim}
    engine_reason: "Arcs and a pointer as pure functions of t; equation assembly with TransformMatchingTex."
    retention_device: "human example, a lock dial (R10); continuity: the circle becomes the dial (R8)"
    interrupt: "new object: the lock dial"
    transition_out: "Pull back to the map ring: its turns are moves too."
    sfx_music: "Dial clicks, one per tick passed, very quiet."

  - id: ch3_s03
    chapter: structure
    title: "Why the map turns"
    arc_step: payoff
    duration_s: 25.13
    duration_source: audio
    goal: "Pay off loop L3: the map's turns form the cyclic group of order six; plant 'all six by the end'."
    narration: |
      Remember how the map turns each time we move on? [pause 0.4s] It's always a sixth of a full circle, and six
      of those bring it back to the start. [pause 0.8s] Those six turns, counting the one that
      does nothing, form a group of their own, the *cyclic group of order six*. [pause 0.6s] A snowflake has the
      same six turns. [pause 0.6s] By the end of this video, the map will have made all six.
    pause_after_s: 1.0
    visual:
      description: >
        Pull back to the map ring with two lit nodes. A ghost replays the two turns made so far as 60 degree arcs
        (C.structure). Six arcs complete the circle with tags 0, 60, ..., 300 degrees, and the sum of six sixths
        returns to 0. Key word 'C6'. A hexagonal snowflake (line art, C.circle) turns by 60 degrees onto its
        ghost. A six-segment progress arc marks two turns done and four to come.
      reveal_sequence:
        - {at_word: "Remember", action: "pull back to the ring; ghost replays the two turns"}
        - {at_word: "sixth", action: "a 60 degree arc tags the turn"}
        - {at_word: "six of those", action: "six arcs complete the circle; 6 x 60 = 360"}
        - {at_word: "cyclic group", action: "key word 'C6' and its six turn arrows"}
        - {at_word: "snowflake", action: "snowflake turns 60 degrees onto its ghost"}
        - {at_word: "all six", action: "progress arc: two segments lit, four dim"}
      equations: ['6\times60^\circ=360^\circ', 'C_6']
      camera: "pull back 15% to the ring"
      layers: [bg_solid, manim_map_ring, manim_arcs, manim_snowflake, manim_progress]
    engines: {primary: manim}
    engine_reason: "The map is a Manim graph; the snowflake is a computed Koch-style polyline."
    retention_device: "pays off loop L3 and opens a small new promise (R7)"
    interrupt: "scale: back out to the map"
    transition_out: "The ring fades back; one arrow on the number line remains."
    sfx_music: "None."

  - id: ch3_s04
    chapter: structure
    title: "A quarter turn is a number"
    arc_step: formalization
    duration_s: 26.23
    duration_source: audio
    goal: "i is the quarter turn: two quarter turns make the half turn, multiplying by minus one."
    narration: |
      Turns can be numbers too. [pause 0.4s] Multiplying by minus one flips the number line around: a half turn.
      [pause 0.6s] So what would a quarter turn be? [pause 1.2s] Call it *i*. [pause 0.3s] Do it twice, and
      you've made a half turn, the same as multiplying by minus one. [pause 0.5s] That's all the square root of
      minus one means: a quarter turn, off the line and into the plane.
    pause_after_s: 1.0
    visual:
      description: >
        A number line (C.axis) with an arrow from 0 to 1 (C.structure). Multiplying by -1 swings the arrow
        through a half-turn arc to -1. Predict beat. The arrow swings a quarter turn up off the line; a vertical
        axis and the plane fade in; the tip is labelled i. Two quarter-turn arcs chain into the half turn and
        i times i equals -1 assembles.
      reveal_sequence:
        - {at_word: "minus one", action: "arrow swings 180 degrees to -1"}
        - {at_word: "quarter turn", action: "predict beat: a ghost arrow hesitates at 90 degrees"}
        - {at_word: "i", action: "the arrow lifts to i; the plane fades in"}
        - {at_word: "twice", action: "second quarter turn lands on -1; i i = -1 assembles"}
        - {at_word: "plane", action: "the plane's grid brightens to full"}
      equations: ['(-1)\cdot 1=-1', 'i\cdot i=i^2=-1']
      camera: "static"
      layers: [bg_solid, manim_number_line, manim_arrow, manim_plane, manim_equations]
    engines: {primary: manim}
    engine_reason: "Rotations of one arrow and a grid fade: Manim primitives."
    retention_device: "pause and predict (R12); one idea at a time (R10)"
    interrupt: "mode: a line becomes a plane"
    transition_out: "The arrow keeps turning past i and sweeps the unit circle (R8)."
    sfx_music: "None."

  - id: ch3_s05
    chapter: structure
    title: "Any turn at all"
    arc_step: formalization
    duration_s: 28.84
    duration_source: audio
    goal: "Euler's formula writes any turn as a power of e; plant loop L2 (e, i and pi will meet)."
    narration: |
      Leonhard Euler found a way to write *any* turn as a number. [pause 0.4s] Each one is a power of a single
      constant, the number e, which we'll meet properly in the chapter on change. [pause 1.0s] As the angle
      grows, the point sweeps around the circle, with cosine as its shadow along one axis and sine along the
      other. [pause 0.8s] Keep an eye on e, i and pi. [pause 0.4s] Before the end, all three will meet in one
      short line.
    pause_after_s: 1.0
    visual:
      description: >
        Unit circle in the plane; a point at angle theta (C.structure) sweeps around. Its shadows on the two axes
        slide in step (dashed), tracing cosine and sine graphs that unroll to the side. Euler's formula writes
        in with e in C.change and i in C.structure. Lower third 'L. Euler · 1748'. On the promise, the glyphs e,
        i and pi lift out, pulse once and park in a small tracker near the corner.
      reveal_sequence:
        - {at_word: "Euler", action: "lower third; the point appears at angle 0"}
        - {at_word: "power", action: "e^{i theta} writes, e colored C.change"}
        - {at_word: "sweeps", action: "the point sweeps; shadows slide on both axes"}
        - {at_word: "cosine", action: "cosine and sine graphs unroll; the full formula completes"}
        - {at_word: "Keep an eye", action: "glyphs e, i, pi lift out and pulse"}
        - {at_word: "one", action: "the glyphs park in a corner tracker"}
      equations: ['e^{i\theta}=\cos\theta+i\sin\theta']
      camera: "static"
      layers: [bg_solid, manim_plane, manim_unit_circle, manim_shadows, manim_equations, manim_loop_tracker]
    engines: {primary: manim}
    engine_reason: "A driven point with projections (m.drive) and TeX colored per role."
    retention_device: "opens loop L2 (R7); history in one line (R14)"
    interrupt: "new object: the sweeping point and its shadows"
    transition_out: "Two arcs split off the sweeping point for the worked example."
    sfx_music: "None."

  - id: ch3_s06
    chapter: structure
    title: "Multiplying adds angles"
    arc_step: worked_example
    duration_s: 27.76
    duration_source: audio
    goal: "Worked example: the 60 and 30 degree turns multiply to i; multiplying turns adds angles."
    narration: |
      Turns written this way are easy to combine. [pause 0.3s] Take a turn of sixty degrees and a turn of
      thirty. [pause 0.3s] What does multiplying them give? [pause 1.5s] Expanding the brackets, the
      pieces combine, and everything cancels except i: a turn of ninety degrees. [pause 0.8s] Multiplying turns
      adds their angles. [pause 0.5s] The angle formulas from school trigonometry are hiding inside that one
      line.
    pause_after_s: 1.0
    visual:
      description: >
        Two arcs, 60 and 30 degrees (C.structure), on the unit circle. The product writes in exponential form,
        then expands term by term in Cartesian form; the two real parts cancel (struck through in C.muted) and
        the imaginary parts sum to 1, leaving i. A 90 degree arc lands on i. The general rule writes below, and
        the cosine angle-addition formula fades in under it, dimmed.
      reveal_sequence:
        - {at_word: "sixty", action: "60 degree arc"}
        - {at_word: "thirty", action: "30 degree arc"}
        - {at_word: "multiplying", action: "predict beat; product writes in exponential form"}
        - {at_word: "Expanding", action: "Cartesian expansion term by term"}
        - {at_word: "cancels", action: "real parts struck; i remains; 90 degree arc lands on i"}
        - {at_word: "adds", action: "general rule e^{ia} e^{ib} = e^{i(a+b)}"}
        - {at_word: "trigonometry", action: "cos(a+b) formula fades in under it, dimmed"}
      equations: ['e^{i\pi/3}\,e^{i\pi/6}=\left(\tfrac12+\tfrac{\sqrt3}{2}i\right)\left(\tfrac{\sqrt3}{2}+\tfrac12 i\right)=i', 'e^{ia}e^{ib}=e^{i(a+b)}', '\cos(a+b)=\cos a\cos b-\sin a\sin b']
      camera: "static"
      layers: [bg_solid, manim_unit_circle, manim_arcs, manim_equations]
    engines: {primary: manim}
    engine_reason: "Exact algebra shown as TeX; arcs computed from the same angles."
    retention_device: "pause and predict (R12); small payoff (R13)"
    interrupt: question
    transition_out: "The circle tips into 3D as a ring of a gimbal."
    sfx_music: "None."

  - id: ch3_s07
    chapter: structure
    title: "Turning in three dimensions"
    arc_step: [sighting, takeaway]
    duration_s: 31.87
    duration_source: audio
    goal: "Sighting (quaternions in games and phones; Hamilton 1843), the takeaway, the third lit node."
    narration: |
      The same idea steers machines. [pause 0.3s] In eighteen forty-three, William Rowan Hamilton found numbers
      that do for turns in space what i does in the plane, and he carved the rule into a bridge in Dublin.
      [pause 0.6s] Today these numbers, called quaternions, turn the camera in video games and tell your phone
      which way is up. [pause 1.0s] For a circle, the moves are turns, and the turns are numbers. [pause 0.8s]
      Algebra is the study of moves like these.
    pause_after_s: 3.0
    visual:
      description: >
        Three gimbal rings (C.structure, projected 3D computed from quaternion rotations) turn a plain phone
        outline. Hamilton's rule appears in CM roman on a flat stone-grey card; lower third 'W. R. Hamilton ·
        1843'. A wireframe cube with an orbiting camera frustum. Takeaway: hero callback, the point sweeping the
        unit circle with its formula, shrinks into the Structure node, which fills violet; chords F-S ('a group
        is a set with rules') and Q-S ('numbers that turn') draw. Silent beat: the ring turns 60 degrees.
      reveal_sequence:
        - {at_word: "machines", action: "gimbal rings turn a phone outline"}
        - {at_word: "Hamilton", action: "lower third; the rule card"}
        - {at_word: "quaternions", action: "camera frustum orbits a wireframe cube"}
        - {at_word: "phone", action: "phone outline rights itself as it tilts"}
        - {at_word: "moves are turns", action: "hero callback: the sweeping point and its formula"}
        - {at_word: "Algebra", action: "Structure node fills; chords F-S and Q-S draw; ring turns in the silent beat"}
      equations: ['i^2=j^2=k^2=ijk=-1']
      camera: "slow orbit feel from rotating the projection (the 2.5D camera stays put)"
      layers: [bg_solid, manim_gimbal, manim_rule_card, manim_wireframe, manim_hero_callback, manim_map_ring]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Quaternion rotations computed in numpy and projected to 2D lines; a few rings do not need a 3D engine."
    retention_device: "real-world sighting (R10); takeaway over a callback (R13); progress (R6)"
    interrupt: "2D to 3D: gimbal rings"
    transition_out: "Signature map turn: Space opens into Chapter 4."
    map_update: {lights: [structure], edges: [[foundations, structure], [quantity, structure]], card: space}
    sfx_music: "A soft tone as the node lights."

# ======================================================================== CH4 SPACE
  - id: ch4_s01
    chapter: space
    title: "Halfway, and a rubber band"
    arc_step: hook
    duration_s: 28.93
    duration_source: audio
    goal: "Midpoint re-hook (we still owe the sticks); squash the circle into a square: to a topologist nothing happened."
    narration: |
      We're halfway around the map, and we still owe you the sticks on the floor. [pause 0.5s] We need a closer
      look at shape and at change first, and then we'll have everything. [pause 1.0s] So, shape. [pause 0.3s]
      Think of the circle as a rubber band, and squash it into a square. [pause 1.2s] To a geometer, everything
      just changed: the curve is gone, and corners appeared. [pause 0.6s] To a topologist, nothing happened at
      all.
    pause_after_s: 1.0
    visual:
      description: >
        The full map with three lit nodes; the Uncertainty node flickers the mini needle floor and a progress
        tag reads three of six. The Space card opens and shrinks away. The circle thickens into a rubber band
        (C.space) and squashes into a square by a continuous radial blend. Geometer's tags ('length', 'angle',
        'corners') pop onto the square; on the last line they fall away, leaving the word 'same'.
      reveal_sequence:
        - {at_word: "halfway", action: "full map; progress tag 3 / 6"}
        - {at_word: "sticks", action: "Uncertainty node flickers the mini needle floor"}
        - {at_word: "So, shape", action: "Space card opens and shrinks away"}
        - {at_word: "rubber band", action: "circle thickens into a band, slight elastic wobble"}
        - {at_word: "square", action: "band squashes into a square, 1.5 s easy_ease"}
        - {at_word: "geometer", action: "tags length, angle, corners pop on"}
        - {at_word: "topologist", action: "tags fall away; key word 'same'"}
      equations: []
      camera: "push from the map into the Space node, 1.5 s"
      layers: [bg_solid, manim_map_ring, skia_mini_needles, manim_band, manim_tags]
    engines: {primary: manim, secondary: [skia]}
    engine_reason: "The band is a parametric curve blended between shapes (m.redraw); the mini floor reuses the intro's seeded skia layer."
    retention_device: "midpoint re-hook, open loop L1 restated (R9, R7); surprise (R4)"
    interrupt: "re-hook: back to the full map"
    transition_out: "The square keeps morphing into other loops."
    sfx_music: "A faint elastic creak on the squash."

  - id: ch4_s02
    chapter: space
    title: "Stretch, don't tear"
    arc_step: intuition
    duration_s: 29.47
    duration_source: audio
    goal: "Topology allows stretching and bending, not cutting or gluing; every simple loop is the same circle."
    narration: |
      Topology is geometry with the measurements thrown away. [pause 0.4s] Stretching, bending and squashing are
      allowed, as much as you like. [pause 0.3s] Cutting and gluing are not. [pause 0.8s] So the rubber band can become a
      triangle, or a wobbly blob, or a star. [pause 0.6s] What it can't become is a figure eight, because that
      means pinching two points together. [pause 1.0s] To a topologist, every one of these loops is the same
      circle.
    pause_after_s: 1.0
    visual:
      description: >
        Key words 'stretch', 'bend', then 'cut' and 'glue' (dimmed, struck). The band morphs square, triangle,
        blob, star (radial functions, 1.2 s each). A figure-eight attempt: two points slide together, a dashed
        C.muted flash marks the forbidden pinch, and the band springs back. All the loops line up in a row and
        an equals sign joins them to the circle.
      reveal_sequence:
        - {at_word: "Stretching", action: "key words stretch, bend, squash"}
        - {at_word: "Cutting", action: "'cut' and 'glue' appear dimmed and struck"}
        - {at_word: "triangle", action: "band morphs to a triangle"}
        - {at_word: "blob", action: "to a blob"}
        - {at_word: "star", action: "to a star"}
        - {at_word: "figure eight", action: "pinch attempt, dashed flash, spring back"}
        - {at_word: "same", action: "all loops in a row, joined by '=' to the circle"}
      equations: []
      camera: "static"
      layers: [bg_solid, manim_band, manim_tags, manim_loop_row]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Shapes sampled as radial functions in numpy so every morph is continuous; drawn in Manim."
    retention_device: "rules shown as moves, not stated (R11); continuity of one band (R8)"
    interrupt: "motion: shape morphs"
    transition_out: "The row collapses to a disk and the band."
    sfx_music: "None."

  - id: ch4_s03
    chapter: space
    title: "Loops that snag"
    arc_step: formalization
    duration_s: 26.62
    duration_source: audio
    goal: "Holes survive stretching: loops shrink on a disk, snag on the band, snag two ways on a torus."
    narration: |
      So what does survive a stretch? [pause 0.6s] Holes. [pause 0.4s] Draw a loop on a flat disk, and it can
      always shrink down to a point. [pause 0.5s] Wrap a loop once around the rubber band, and it snags on
      the hole, however it's stretched. [pause 0.8s] On the surface of a donut, a loop can snag in two different
      ways. [pause 1.0s] Loops that can't be shrunk are one of the main ways topologists tell shapes apart.
    pause_after_s: 1.0
    visual:
      description: >
        A disk (C.space fill at 15 percent) with a loop that shrinks to a point. The band with a loop wrapped
        once around it: it tightens and stops against the hole. A shaded torus (PyVista, teal key light, crisp
        silhouette) turns slowly; one loop around the tube and one around the hole each try to shrink and snag.
      reveal_sequence:
        - {at_word: "Holes", action: "key word 'holes'"}
        - {at_word: "disk", action: "loop on the disk shrinks to a point"}
        - {at_word: "Wrap", action: "loop around the band tightens and snags"}
        - {at_word: "donut", action: "torus turns in; two loops draw"}
        - {at_word: "two different", action: "each loop tries to shrink and snags"}
        - {at_word: "tell shapes apart", action: "disk, band and torus line up with their snagging loops"}
      equations: []
      camera: "static; the torus layer rotates on its own"
      layers: [bg_solid, manim_disk, manim_band, pyvista_torus, manim_loops]
    engines: {primary: pyvista, secondary: [manim]}
    engine_reason: "A shaded torus with loops on its surface is a mesh job (PyVista off-screen to ArrayLayer); disk and band stay in Manim."
    retention_device: "2D to 3D switch (R9); one idea, holes (R10)"
    interrupt: "2D to 3D: the torus"
    transition_out: "The torus turns into a wireframe mesh for counting."
    sfx_music: "None."

  - id: ch4_s04
    chapter: space
    title: "Corners, edges, faces"
    arc_step: worked_example
    duration_s: 31.20
    duration_source: audio
    goal: "Worked example: Euler characteristic of a loop (0), a disk (1), a cube (2), a torus (0); it ignores re-cutting and stretching."
    narration: |
      Euler found an even simpler test. [pause 0.3s] Build a shape from corners, edges and faces, add up the
      corners and faces, and take away the edges. [pause 0.8s] Any loop comes out at zero. [pause 0.4s] Fill it
      in, and the face makes it one. [pause 0.5s] A cube comes out at two. [pause 0.6s] What about the donut?
      [pause 1.5s] Zero again. [pause 0.4s] Cut any of these into different pieces, or stretch them however you
      like, and the count never changes.
    pause_after_s: 1.2
    visual:
      description: >
        Header chi = V - E + F with V in C.circle, E and F in C.space. A 12-sided loop: counters tick V 12, E 12,
        F 0, chi 0. It fills: F 1, chi 1. A wireframe cube (projected): 8, 12, 6, chi 2. Predict beat. The torus
        becomes a 16 by 8 quad mesh: 128, 256, 128, chi 0. Finally one cube face splits into four; V, E and F roll
        to new values and chi stays 2.
      reveal_sequence:
