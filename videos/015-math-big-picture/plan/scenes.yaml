  - id: ch1_s05
    chapter: foundations
    title: "A shape that rolls like a circle"
    arc_step: [formalization, sighting]
    duration_s: 38.56
    duration_source: audio
    goal: "A statement and its converse differ: constant width does not imply circle (Reuleaux triangle)."
    narration: |
      That two-way promise matters. [pause 0.5s] Roll a
      circle under a flat board, and the board glides along at a constant height. [pause 0.6s] So you might
      guess the reverse: anything that rolls that smoothly must be a circle. [pause 1.2s] It doesn't have to
      be. [pause 0.5s] This rounded triangle, built from three arcs, keeps the board just as level.
      [pause 1.0s] The British fifty pence coin uses the same trick with seven sides, so vending machines can
      measure its width like a circle's. [pause 1.0s] A statement and its reverse are different claims, and
      logic is the habit of checking both.
    pause_after_s: 1.0
    visual:
      description: >
        A board rests on the circle; the circle rolls and the board slides along level (height tag 'constant
        width'). The logic arrow 'circle => constant width' flips into 'constant width => circle?'. A Reuleaux
        triangle (three arcs centered on an equilateral triangle's corners) slides in and rolls under the board;
        the height tick never changes (support function computed). A plain seven-sided curved coin outline (no
        imagery) rolls once. The reversed arrow is struck through (dashed, C.muted).
      reveal_sequence:
        - {at_word: "flat board", action: "board on the rolling circle, height tag"}
        - {at_word: "reverse", action: "logic arrow flips, question mark"}
        - {at_word: "doesn't have", action: "Reuleaux triangle slides in"}
        - {at_word: "rounded triangle", action: "it rolls under the board; height tick unchanged"}
        - {at_word: "fifty pence", action: "heptagonal coin outline rolls once"}
        - {at_word: "different claims", action: "reversed arrow struck through"}
      equations: ['\text{circle}\Rightarrow\text{constant width}', '\text{constant width}\not\Rightarrow\text{circle}']
      camera: "tracks sideways with the rolling, 3 units over 4s"
      layers: [bg_solid, manim_floor, manim_board, manim_shapes, manim_logic_arrows]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "The board height needs the shape's support function per angle (numpy) so the roll is exact; drawn in Manim."
    retention_device: "wrong intuition first, then a visual surprise (R4)"
    interrupt: "visual surprise: a non-circle that rolls"
    transition_out: "The rolling shapes leave; two overlapping disks slide in."
    sfx_music: "None."

  - id: ch1_s06
