  - id: ch2_s01
    chapter: quantity
    title: "One turn of a wheel"
    arc_step: hook
    duration_s: 30.27
    duration_source: audio
    goal: "Meet pi as a measured length: one turn of a wheel one unit across lands just past three."
    narration: |
      How big is a circle? [pause 0.4s] Take a wheel exactly one unit across, paint a dot on its rim, and roll it
      along a number line for one full turn. [pause 0.3s] Where will the dot touch down? [pause 2.0s] Just past
      three. [pause 0.6s] That length is the distance around the wheel, and it has a name: *pi*. [pause 0.8s]
      Every circle, from a coin to a Ferris wheel, measures pi times its own width all the way around.
    pause_after_s: 1.0
    visual:
      description: >
        The Quantity card shrinks away. The circle, now one unit across, stands on a number line (ticks 0 to 4,
        CM roman) with a dot on its rim at 0. On the question the wheel rolls one turn without slipping (center
        moves theta times r, computed); the dot traces a thin cycloid (C.quantity) and touches down at 3.14159.
        A gold tick and the glyph pi land there. A coin and a Ferris-wheel outline unroll their rims beside it,
        each tagged 'pi x width'.
      reveal_sequence:
        - {at_word: "wheel", action: "the circle stands on the number line; diameter tick '1'"}
        - {at_word: "dot", action: "a dot appears on the rim at 0"}
        - {at_word: "touch down", action: "predict beat: the wheel starts a slow roll (2.2 s smooth), landing on 'Just past'"}
        - {at_word: "Just past", action: "the dot touches down; cycloid complete"}
        - {at_word: "pi", action: "gold tick and glyph pi at 3.14159..."}
        - {at_word: "coin", action: "coin and Ferris-wheel outlines unroll their rims, tagged 'pi x width'"}
      equations: ['C=\pi d', '\pi=3.14159\ldots']
      camera: "static; slight pan right with the roll (1.5 units over 2.2 s)"
      layers: [bg_solid, manim_number_line, manim_wheel, manim_cycloid, manim_tags]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "A rolling wheel is a pure function of t (center = theta r; the dot on a cycloid computed in numpy), drawn crisp in Manim."
    retention_device: "pause and predict, 2 s (R12); measured before named (R10)"
    interrupt: question
    transition_out: "The number line stays; the camera dives toward pi for the fraction hunt (R8)."
    sfx_music: "A soft click when the dot touches down."

  - id: ch2_s02
    chapter: quantity
    title: "Hunting for the fraction"
    arc_step: intuition
    duration_s: 35.73
    duration_source: audio
    goal: "Wrong intuition first: some fraction must hit pi. The best ancient fractions come close and miss."
    narration: |
      So pi is a little more than three. [pause 0.3s] You'd expect some fraction to land on it exactly, if we
      just find the right one. [pause 0.8s] More than two thousand years ago, Archimedes trapped pi between two
      fractions by drawing polygons with ninety-six sides. [pause 0.5s] The upper one, twenty-two sevenths, is
      still used in schools. [pause 0.6s] Around the year four eighty, Zu Chongzhi in China found three hundred
      fifty-five over one hundred thirteen, right to six decimal places. [pause 0.8s] Zoom in on either one,
      and there is still a gap.
    pause_after_s: 1.0
    visual:
      description: >
        Ninety-six-sided polygons draw inside and outside the circle (C.quantity, thin); their perimeters
        become two ticks bracketing pi on the number line: 223/71 and 22/7. Lower third 'Archimedes · c. 250 BC'.
        The camera dives into the line by powers of ten (decimal readouts in tabular figures); 355/113 lands a
        hair from pi with lower third 'Zu Chongzhi · c. 480'. At the deepest zoom a gap remains between each
        fraction tick and pi, its width tagged.
      reveal_sequence:
        - {at_word: "fraction", action: "a fraction tick hovers near pi, ghosted"}
        - {at_word: "Archimedes", action: "96-gons draw inside and outside the circle; lower third"}
        - {at_word: "twenty-two sevenths", action: "the outer perimeter becomes the 22/7 tick; 223/71 below pi"}
        - {at_word: "four eighty", action: "zoom x1000; lower third 'Zu Chongzhi · c. 480'"}
        - {at_word: "three hundred", action: "355/113 tick lands; decimals 3.1415929 vs 3.1415926"}
        - {at_word: "gap", action: "deepest zoom: the gap between tick and pi glows its width tag"}
      equations: ['\tfrac{223}{71}<\pi<\tfrac{22}{7}', '\tfrac{355}{113}=3.1415929\ldots', '\pi=3.1415926\ldots']
      camera: "log zoom into pi: x10 per 0.8 s, three steps"
      layers: [bg_solid, manim_polygons, manim_number_line, manim_ticks, manim_lower_third]
    engines: {primary: manim, secondary: [numpy]}
    engine_reason: "Exact polygon perimeters and decimal expansions computed in numpy; log zoom by re-drawing the line per frame (m.redraw) keeps ticks crisp at any scale."
    retention_device: "wrong intuition first (R4); history in one line each (R14)"
    interrupt: "scale: log zoom into the number line"
    transition_out: "Zoom back out; the fraction ticks multiply across the line."
    sfx_music: "None."

  - id: ch2_s03
    chapter: quantity
    title: "Kinds of number"
    arc_step: formalization
    duration_s: 25.88
    duration_source: audio
    goal: "Number kinds answer needs (whole, negative, rational); fractions are dense, which suggests there is no room left."
    narration: |
      Each kind of number answers a need. [pause 0.3s] Counting gives the whole numbers. [pause 0.3s] Owing
      gives the negatives. [pause 0.3s] Sharing a pizza gives fractions, which mathematicians call *rational*
      numbers. [pause 0.8s] And fractions are packed tight: between any two sits another, halfway between, and
      another between those, without end. [pause 1.0s] It looks as if they leave no room for anything else.
    pause_after_s: 0.8
    visual:
      description: >
        The number line fills by kind. Dots at 1, 2, 3 (counting), mirrored to -1, -2, -3 (owing), then fraction
        ticks (a pizza cut into slices tags the first one). Nested labels appear in small caps above the line:
        N inside Z inside Q (C.quantity). The camera settles on the stretch 3 to 3.25; midpoints drop in
        recursively (depth 7, 60 ms stagger) until the stretch looks solid. A ghosted 'R ?' waits at the end.
      reveal_sequence:
        - {at_word: "Counting", action: "dots at 1, 2, 3; label N"}
        - {at_word: "Owing", action: "mirror dots at -1, -2, -3; label Z"}
        - {at_word: "pizza", action: "a pizza outline cut in slices; fraction ticks appear; label Q"}
        - {at_word: "packed", action: "camera settles on 3 to 3.25"}
        - {at_word: "halfway", action: "midpoints drop in, depth 1, 2, 3 ..."}
        - {at_word: "no room", action: "the stretch looks solid; ghost label 'R ?' fades in"}
      equations: ['\mathbb{N}\subset\mathbb{Z}\subset\mathbb{Q}', '\tfrac{p}{q}\ \text{and}\ \tfrac{r}{s}\ \Rightarrow\ \tfrac12\left(\tfrac{p}{q}+\tfrac{r}{s}\right)']
      camera: "push from the whole line to 3..3.25 over 2 s"
      layers: [bg_solid, manim_number_line, manim_ticks, manim_sets_labels]
    engines: {primary: manim}
    engine_reason: "Ticks and nested labels on a number line; recursion depth fixed so the frame stays legible."
    retention_device: "human examples: counting, owing, sharing a pizza (R10); sets up the surprise (R4)"
    interrupt: "new object: nested number kinds"
    transition_out: "The circle returns over the line for the square construction."
    sfx_music: "None."

  - id: ch2_s04
    chapter: quantity
    title: "The square inside the circle"
    arc_step: worked_example
    duration_s: 42.49
    duration_source: audio
    goal: "Worked example: the side of the square inscribed in the unit circle is the square root of two, and it is not a fraction."
    narration: |
      Fit a square inside a circle of radius one. [pause 0.4s] Its diagonal runs straight across the circle,
      so it's two units long, and Pythagoras makes each side the square root of two. [pause 0.8s] Is that length
      a fraction? [pause 1.5s] Suppose it is, in lowest terms. [pause 0.4s] Squaring gives an equation in whole
      numbers, and it forces the top number to be even. [pause 0.6s] Feed that back in, and the bottom number
      must be even too. [pause 0.8s] But a fraction in lowest terms can't have both numbers even. [pause 0.6s]
      The assumption fails, so the square root of two is not a fraction. [pause 0.5s] Numbers like this are
      called *irrational*.
    pause_after_s: 1.2
    visual:
      description: >
        Unit circle (C.circle) with an inscribed square (C.quantity). The diagonal draws (tag '2'); the side's
        right triangle shows s squared plus s squared equals 4, so s = sqrt 2. The derivation writes one line at
        a time on the right, older lines dimming to 40 percent. 'p even' and 'q even' ring their letters; the
        clash is struck through in C.alert, the video's one use of the alert color. Then the number line returns
        and sqrt 2 lands as a gold point between fraction ticks, touching none.
      reveal_sequence:
        - {at_word: "square", action: "inscribed square draws in the unit circle"}
        - {at_word: "diagonal", action: "diagonal draws, tag '2'"}
        - {at_word: "Pythagoras", action: "s^2 + s^2 = 2^2 resolves to s = sqrt 2"}
        - {at_word: "fraction", action: "predict beat; 'sqrt 2 = p/q ?' writes"}
        - {at_word: "lowest terms", action: "'lowest terms' key word under p/q"}
        - {at_word: "Squaring", action: "p^2 = 2q^2 writes; 'p even' rings p"}
        - {at_word: "Feed", action: "p = 2k substituted; q^2 = 2k^2; 'q even' rings q"}
        - {at_word: "both numbers even", action: "the clash is struck through in C.alert"}
        - {at_word: "irrational", action: "sqrt 2 lands on the number line between fraction ticks; key word 'irrational'"}
      equations: ['s^2+s^2=2^2\ \Rightarrow\ s=\sqrt2', '\sqrt2=\tfrac{p}{q}', 'p^2=2q^2', 'p=2k\ \Rightarrow\ q^2=2k^2']
      camera: "static; the derivation column has its own fixed frame (no camera move while lines write)"
      layers: [bg_solid, manim_circle, manim_square, manim_derivation, manim_number_line]
    engines: {primary: manim}
    engine_reason: "A TeX derivation revealed line by line with color-matched terms (TransformMatchingTex)."
    retention_device: "pause and predict (R12); a proof as a small payoff (R13)"
    interrupt: "mode: picture becomes a proof"
    transition_out: "The derivation dims; the number line slides to the center."
    sfx_music: "None; a single low tap on the contradiction."

