        it fills pink. Chords C-U ('area under a curve'), Sp-U ('geometry of chance') and Q-U ('pi from counting')
        draw. Silent beat: the ring makes its sixth turn; Foundations is back at the bottom, all six nodes lit.
      reveal_sequence:
        - {at_word: "random", action: "hero callback: dots filling the rectangle"}
        - {at_word: "every branch", action: "Uncertainty node fills; three chords; sixth ring turn in the silent beat"}
      equations: []
      camera: "pull back to the full map during the turn"
      layers: [bg_solid, manim_hero_callback, manim_map_ring]
    engines: {primary: manim}
    engine_reason: "Map node, chords and the ring turn in Manim."
    retention_device: "one-sentence takeaway over a visual callback (R13); progress complete (R6)"
    interrupt: "scale: back out to the map"
    transition_out: "Signature map turn, the sixth: the whole map opens into Chapter 7."
    map_update: {lights: [uncertainty], edges: [[change, uncertainty], [space, uncertainty], [quantity, uncertainty]], card: connects}
    sfx_music: "A soft tone as the node lights."

# ======================================================================== CH7 HOW IT CONNECTS
  - id: ch7_s01
    chapter: connects
    title: "Six turns later"
    arc_step: hook
    duration_s: 25.70
    duration_source: audio
    goal: "The map is back at the start (the identity of C6); the branches were connected all along."
    narration: |
      Six turns later, the map is right back where it started, just as the group of turns promised.
      [pause 1.0s] And the branches were never really separate. [pause 0.4s] Statistics runs on calculus.
      [pause 0.3s] The secure messages on your phone run on the algebra of whole numbers. [pause 0.3s] Physics
      runs on symmetry. [pause 0.6s] And under every one of them sit the definitions we started with.
    pause_after_s: 1.0
    visual:
      description: >
        The card 'How it connects' (small caps, C.text) shrinks away. The C6 progress arc completes: six of six,
        back to 0 degrees. All six nodes lit. As each link is named, its chord pulses: C-U, Q-S, S-Sp. On the last
        line three new chords draw from Foundations to Space, Change and Uncertainty.
      reveal_sequence:
        - {at_word: "Six turns", action: "C6 progress arc completes; 6 / 6 returns to 0 degrees"}
        - {at_word: "never", action: "all lit chords brighten once"}
        - {at_word: "Statistics", action: "chord C-U pulses"}
        - {at_word: "secure", action: "chord Q-S pulses"}
        - {at_word: "Physics", action: "chord S-Sp pulses"}
        - {at_word: "definitions", action: "chords F-Sp, F-C, F-U draw"}
      equations: []
      camera: "static on the full map"
