# ElevenLabs settings for video 015: the channel voice (as in 004-014), read calm and unhurried.
voice_id = "s3TPKV1kjDlVtZbl4Ksh"
model_id = "eleven_v4"
output_format = "mp3_44100_128"
stitch = true
seed = 7
chunking = "scene"          # one TTS request per <!-- scene: id --> block, neighbours sent for stitching

[settings]
stability = 0.55
similarity_boost = 0.75
speed = 0.90                # provisional: chosen by ear from the speed test (0.86 / 0.90 / 0.94)

# Pacing pass (free: applied to cached audio, never re-bills). See aion/voice/pacing.py.
# The planned silences live in plan/scenes.yaml (inline [pause N] and each scene's pause_after_s, written into
# voiceover.md as `> [pause N]` notes), so the automatic paragraph and section gaps are zero here.
[pacing]
snap = true
lead_in = 1.0               # the first stick lands before the first word
paragraph_gap = 0.0
section_gap = 0.0
tail = 6.0                  # = out_s02 pause_after_s: hold for the YouTube end-screen elements

# TTS spellings of single words (captions keep the script's spelling; possessives follow). Check each by ear
# in the speed test. Background and the names left as they are: script/pronunciation.md.
[aliases]
Euler = "Oiler"
Buffon = "Boo-fon"
Chongzhi = "Chong-jur"

# Banned words and phrases: the brief's list plus the saved narration-style list. scripts/lint_script.py also
# catches their other forms (unlocks, delving, ...).
[lint]
banned = ["strange", "fascinating", "mind-blowing", "magical", "delve", "dive in", "dive into", "journey",
          "tapestry", "realm", "unlock", "it's worth noting", "let's explore", "in today's video", "buckle up",
          "simply put", "game-changer", "game changer", "astonishing", "remarkable", "extraordinary", "stunning",
          "profound", "crucial", "in fact", "and yet", "at its heart", "this is where", "here's the thing"]
