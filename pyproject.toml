[project]
name = "aion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "manim>=0.22.1",
    "moderngl>=5.13.0",
    "pytinytex>=0.5.1",
    "pyvista>=0.49.2",
    "skia-python>=144.1",
]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aion"]
