[project]
name = "aion"
version = "2.0.0.dev0"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "click>=8.5.0",
    "fonttools>=4.68.0",
    "manim>=0.22.1",
    "moderngl>=5.13.0",
    "numpy>=2.5.4",
    "opensimplex>=0.4.5.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "pytinytex>=0.5.1",
    "pyvista>=0.49.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "skia-python>=144.1",
    "sympy>=1.14.0",
    "taichi>=1.7.4",
    "tqdm>=4.70.1",
]

[project.scripts]
aion = "aion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs an OpenGL context",
    "tex: needs LaTeX",
    "live: calls a paid external API (run with -m live)",
]
addopts = "-m 'not live'"

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aion"]
